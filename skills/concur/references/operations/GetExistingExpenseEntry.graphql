query GetExistingExpenseEntry($expenseId: String!, $reportId: String!, $userId: String!, $contextRole: ContextRoleType!, $expenseIdAsID: ID!, $reportIdAsID: ID!, $userIdAsID: ID!, $shouldFetchExpenseForm: Boolean! = true, $shouldFetchReportExceptions: Boolean! = false, $expenseTypeChangeContext: ExpenseTypeChangeExistingExpenseContext, $isBondUser: Boolean! = false, $shouldChangeWarningAlertsToInformation: Boolean = false) {
  expenseTypeFilters(
    userId: $userId
    contextRole: $contextRole
    reportId: $reportId
    expenseId: $expenseId
  ) {
    shouldFilterCashAdvanceExpenseTypes
    shouldFilterCompanyCarExpenseType
    shouldFilterPersonalCarExpenseType
    __typename
  }
  vehicleRegistrationInfo {
    hasPersonalCar
    hasCompanyCar
    __typename
  }
  entryExceptions(
    expenseId: $expenseId
    reportId: $reportId
    userId: $userId
    contextRole: $contextRole
    shouldChangeWarningAlertsToInformation: $shouldChangeWarningAlertsToInformation
  ) {
    ...EreEntryExceptionsFragment
    __typename
  }
  employee(userId: $userId, contextRole: $contextRole) {
    userId
    contextRole
    expenseReport(reportId: $reportId) {
      reportId
      rptKey
      reportDetails {
        ...ExpenseReportDetailsFragment
        __typename
      }
      entry(expenseId: $expenseId) {
        ...EreExpenseEntrySummaryFragment
        meta {
          isAiAssisted @include(if: $isBondUser)
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
  existingExpenseForm(
    dataContext: {expenseId: $expenseIdAsID, reportId: $reportIdAsID, expenseTypeChangeContext: $expenseTypeChangeContext}
    userContext: {userId: $userIdAsID, contextType: $contextRole}
  ) @include(if: $shouldFetchExpenseForm) {
    ...ExistingExpenseFormFragment
    __typename
  }
  reportExceptions(
    reportId: $reportId
    userId: $userId
    contextRole: $contextRole
  ) @include(if: $shouldFetchReportExceptions) {
    ...ReportExceptionsFragment
    __typename
  }
}

fragment EreEntryExceptionsFragment on EntryExceptions {
  reportId
  expenseId
  attendeesExceptionLevel
  transactionAmount {
    value
    currencyCode
    __typename
  }
  transactionDate
  expenseType {
    id
    code
    name
    meta {
      isJapanPublicTransportation
      __typename
    }
    __typename
  }
  countOfExceptions
  hasBlockingExceptions
  entryExceptions {
    allocationId
    exceptionCode
    expenseId
    isBlocking
    message
    parameters {
      entryExceptionAttendees {
        lastName
        firstName
        entryAmount
        crnCode
        totalExpensed
        totalAuthorized
        __typename
      }
      missingFields {
        missingSpecialParentField
        fields
        fieldIds
        __typename
      }
      __typename
    }
    parentExpenseId
    __typename
  }
  itemizationsExceptions {
    reportId
    expenseId
    attendeesExceptionLevel
    itemizationId
    transactionAmount {
      value
      currencyCode
      __typename
    }
    transactionDate
    expenseType {
      id
      code
      name
      meta {
        isJapanPublicTransportation
        __typename
      }
      __typename
    }
    countOfExceptions
    hasBlockingExceptions
    exceptions {
      allocationId
      exceptionCode
      expenseId
      isBlocking
      message
      parameters {
        entryExceptionAttendees {
          lastName
          firstName
          entryAmount
          crnCode
          totalExpensed
          totalAuthorized
          __typename
        }
        missingFields {
          missingSpecialParentField
          fields
          fieldIds
          __typename
        }
        __typename
      }
      parentExpenseId
      __typename
    }
    __typename
  }
  __typename
}

