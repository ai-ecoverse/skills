  editAdjustmentsMenuItemActive
  deleteTAMenuItemActive
  reimbursableAllowancesSummaryMenuItemActive
  viewTAMenuItemActive
  viewAdjustmentsMenuItemActive
  manageLegacyTAMenuItemActive
  viewLegacyTAMenuItemActive
  __typename
