fragment CashAdvanceFragment on CashAdvance {
  exchangeRate {
    operation
    value
    __typename
  }
  id
  name
  issuedDate
  requestedAmount {
    currencyCode
    value
    __typename
  }
  startingBalance {
    currencyCode
    value
    __typename
  }
  unsubmittedBalance {
    currencyCode
    value
    __typename
  }
  unsubmittedBalanceInRequestedCurrency {
    currencyCode
    value
    __typename
  }
  reimbursementCurrency
  __typename
}

fragment CashAdvanceForReportFragment on CashAdvancesForReportResponse {
  cashAdvances {
    ...CashAdvanceFragment
    __typename
  }
  totalRemaining {
    currencyCode
    value
    __typename
  }
  totalRequested {
    currencyCode
    value
    __typename
  }
  __typename
}

fragment TravelRequestFragment on TravelRequest {
  requestUUID
  id
  arName
  canceled
  closed
  postedAmount
  approvedAmount
  remainingAmount
  arCrnCode
  startDate
  endDate
  __typename
