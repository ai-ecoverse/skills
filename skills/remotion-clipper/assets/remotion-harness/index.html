<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>remotion render harness</title>
<!--
  Generated-by-copy harness for `remotion render` (copied in by `remotion render`).
  The import map is LOAD-BEARING: every bare specifier must resolve to exactly
  one esm.sh URL, or React/Remotion context breaks. The locally installed
  @remotion/web-renderer cannot be used directly because it imports bare
  react/react-dom, which are not installed as browser modules.
  Full write-up: references/render-target.md
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.3/es2022/react.mjs",
    "react/jsx-runtime": "https://esm.sh/react@19.2.3/es2022/jsx-runtime.mjs",
    "react-dom": "https://esm.sh/react-dom@19.2.3/X-ZXJlYWN0/es2022/react-dom.mjs",
    "react-dom/client": "https://esm.sh/react-dom@19.2.3/X-ZXJlYWN0/es2022/client.mjs",
    "remotion": "https://esm.sh/remotion@4.0.520/X-ZXJlYWN0LHJlYWN0LWRvbQ/es2022/remotion.mjs",
    "remotion/no-react": "https://esm.sh/remotion@4.0.520/X-ZXJlYWN0LHJlYWN0LWRvbQ/es2022/no-react.mjs",
    "remotion/version": "https://esm.sh/remotion@4.0.520/X-ZXJlYWN0LHJlYWN0LWRvbQ/es2022/version.mjs",
    "mediabunny": "https://esm.sh/mediabunny@1.55.5/es2022/mediabunny.mjs",
    "@remotion/media": "https://esm.sh/@remotion/media@4.0.520/X-ZW1lZGlhYnVubnkscmVhY3QscmVhY3QtZG9tLHJlbW90aW9u/es2022/media.mjs",
    "@remotion/web-renderer": "https://esm.sh/@remotion/web-renderer@4.0.520/X-ZW1lZGlhYnVubnkscmVhY3QscmVhY3QtZG9tLHJlbW90aW9u/es2022/web-renderer.mjs"
  }
}
</script>
<style>
  body { font-family: monospace; background:#0b0b0d; color:#ddd; margin:0; padding:10px; }
  pre { white-space: pre-wrap; font-size: 11px; line-height:1.35; }
  h4 { margin:0 0 6px; font-weight: 600; }
</style>
</head>
<body>
<h4>remotion render harness</h4>
<pre id="log">booting…</pre>
<script type="module">
const logEl = document.getElementById('log');
const lines = [];
const log = (...a) => {
  const s = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ');
  lines.push(s);
  logEl.textContent = lines.slice(-40).join('\n');
  console.log('[render]', s);
};
window.__log = lines;
window.__stage = 'importing';
window.__err = null;
window.__done = null;
window.__prog = null;

// The driver polls this ONE function; keep the expression it evaluates free of
// whitespace so it survives naive shell splitting on the jsh side.
window.__status = () =>
  JSON.stringify({
    stage: window.__stage,
    err: window.__err,
    done: window.__done,
    prog: window.__prog,
    assets: window.__assets,
    visible: document.visibilityState,
    tail: lines.slice(-4),
  });

try {
  // Keep the RAW text around: the driver compares it byte-for-byte to decide
  // whether an already-loaded tab can be reused (skipping the asset reload).
  const cfgText = await (await fetch('./cfg.json')).text();
  const cfg = JSON.parse(cfgText);
  window.__cfgText = cfgText;
  window.__cfg = cfg;
  document.title = `render ${cfg.id}`;

  const React = (await import('react')).default;
  const remotion = await import('remotion');
  const wr = await import('@remotion/web-renderer');
  const comp = await import('./composition.mjs');
  window.__React = React;
  window.__remotion = remotion;
  window.__wr = wr;
  log('modules ok, remotion', remotion.VERSION || '?');

  // ------------------------------------------------------------------ assets
  // `serve` 500s on files over ~25 MiB, so every source is delivered as ~8 MiB
  // parts and reassembled into ONE Blob here. The resulting blob: URL keeps the
  // original container timestamps, so every inSec in the EDL stays exact -- no
  // keyframe-snapped trim, no re-encode, no sync risk.
  window.__stage = 'assets';
  window.__assets = { bytes: 0, detail: 'start' };
  const urls = {};
  for (const [name, meta] of Object.entries(cfg.sources)) {
    const bufs = [];
    for (const part of meta.parts) {
      // The preview worker throws the occasional 504/500 under load; a part
      // fetch failing once is not a broken render, so retry before giving up.
      let ab = null;
      let lastStatus = 0;
      for (let attempt = 1; attempt <= 6 && !ab; attempt++) {
        try {
          const r = await fetch('./' + part, { cache: 'no-store' });
          lastStatus = r.status;
          if (r.ok) ab = await r.arrayBuffer();
        } catch (e) {
          lastStatus = String(e);
        }
        if (!ab) {
          log(`asset part ${part} attempt ${attempt} -> ${lastStatus}, retrying`);
          await new Promise((res) => setTimeout(res, 1500 * attempt));
        }
      }
      if (!ab) throw new Error(`asset part ${part} -> ${lastStatus} after 6 attempts`);
      bufs.push(ab);
      window.__assets.bytes += ab.byteLength;
      window.__assets.detail = `${name} ${bufs.length}/${meta.parts.length}`;
    }
    const blob = new Blob(bufs, { type: meta.mime });
    if (blob.size !== meta.size) throw new Error(`${name}: reassembled ${blob.size} != ${meta.size}`);
    urls[name] = URL.createObjectURL(blob);
    log(`asset ${name}: ${meta.parts.length} parts -> ${blob.size} bytes ok`);
  }
  window.__urls = urls;
  window.__assets.detail = 'done';

  // ---------------------------------------------------------------- captions
  let captions = null;
  if (cfg.captions) {
    const r = await fetch('./' + cfg.captions);
    if (!r.ok) throw new Error(`captions ${cfg.captions} -> HTTP ${r.status}`);
    captions = await r.json();
    log(`captions: ${captions.words?.length ?? 0} words (offset ${cfg.captionOffsetSec || 0}s)`);
  }

  // ------------------------------------------------------------- composition
  window.__stage = 'composing';
  const built = comp.buildComposition({ cfg, urls, captions });
  window.__built = built;
  const COMP = built.composition;
  log(
    'segments',
    built.segments.map((s) => `${s.shot.replace('portrait-', '')}@${s.startFrame}+${s.durationInFrames}`).join(' '),
  );
  log('total frames', built.totalFrames, '=', (built.totalFrames / cfg.fps).toFixed(3) + 's', `cues ${built.cues.length}`);

  const can = await wr.canRenderMediaOnWeb({
    container: cfg.render.container,
    videoCodec: cfg.render.videoCodec,
    audioCodec: cfg.render.audioCodec,
    // width/height are NOT optional here: without them h264 support reports
    // "requires width and height to be multiples of 2. Got undefinedxundefined".
    width: cfg.width,
    height: cfg.height,
    fps: cfg.fps,
  });
  window.__can = can;
  log('canRenderMediaOnWeb', JSON.stringify(can));
  if (can && can.canRender === false) log('WARNING: canRenderMediaOnWeb says no; trying anyway');

  // --------------------------------------------------------------------- api
  window.__still = async (frame) => {
    const r = await wr.renderStillOnWeb({ composition: COMP, frame, logLevel: 'info' });
    const blob = await r.blob({ format: 'jpeg', quality: 0.82 });
    window.__blob = blob;
    return { frame, size: blob.size };
  };

  const render = async () => {
    const t0 = performance.now();
    const res = await wr.renderMediaOnWeb({
      composition: COMP,
      container: cfg.render.container,
      videoCodec: cfg.render.videoCodec,
      audioCodec: cfg.render.audioCodec,
      muted: !!cfg.render.muted,
      videoBitrate: cfg.render.videoBitrate ?? 'high',
      audioBitrate: cfg.render.audioBitrate ?? 'high',
      delayRenderTimeoutInMilliseconds: cfg.render.delayRenderTimeoutInMilliseconds ?? 120000,
      logLevel: cfg.render.logLevel ?? 'info',
      onProgress: (p) => {
        window.__prog = p;
      },
    });
    const msRender = performance.now() - t0;
    const blob = await res.getBlob();
    window.__blob = blob;
    const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    return {
      size: blob.size,
      type: blob.type,
      magic: Array.from(head)
        .map((x) => x.toString(16).padStart(2, '0'))
        .join(' '),
      msRender: Math.round(msRender),
      msTotal: Math.round(performance.now() - t0),
      frames: built.totalFrames,
      clipSec: +(built.totalFrames / cfg.fps).toFixed(3),
    };
  };

  // Fire-and-forget: a blocking eval would time the CDP bridge out on a long
  // render. The driver polls __status() instead.
  window.__go = () => {
    if (window.__stage === 'rendering') return 'already-running';
    window.__stage = 'rendering';
    window.__err = null;
    window.__done = null;
    render().then(
      (out) => {
        window.__done = out;
        window.__stage = 'done';
        log('RENDER DONE', JSON.stringify(out));
      },
      (e) => {
        window.__err = String((e && e.stack) || e);
        window.__stage = 'error';
        log('RENDER FAILED', window.__err);
      },
    );
    return 'started';
  };

  // blob -> VFS in independently-decodable byte slices (safe to concatenate).
  window.__chunk = async (i, chunkSize) => {
    const size = chunkSize || 3 * 1024 * 1024;
    const b = window.__blob;
    const start = i * size;
    if (!b || start >= b.size) return null;
    const buf = new Uint8Array(await b.slice(start, Math.min(b.size, start + size)).arrayBuffer());
    let bin = '';
    const CH = 0x8000;
    for (let j = 0; j < buf.length; j += CH) bin += String.fromCharCode.apply(null, buf.subarray(j, j + CH));
    return btoa(bin);
  };
  window.__nchunks = (chunkSize) => Math.ceil(window.__blob.size / (chunkSize || 3 * 1024 * 1024));

  window.__stage = 'ready';
  log('READY -- __go() / __status() / __chunk(i) / __still(frame)');
} catch (e) {
  window.__err = String((e && e.stack) || e);
  window.__stage = 'error';
  log('FATAL', window.__err);
}
</script>
</body>
</html>
