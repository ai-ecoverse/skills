<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webrunner debug</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --panel: #f6f7f9; --line: #d9dce1; --text: #1d2026; --muted: #5d6470;
    --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; --warn: #b45309; --new: #c026d3;
    --chosen: #16a34a; --menu: #2563eb; --excluded: #6b7280;
    /* who decided: System 1 (kev), System 2 after a shrug, a random audit, a plan review */
    --s1: #0e7490; --s2: #c2410c; --audit: #7c3aed; --review: #be185d; --direct: #5d6470;
    /* sections of the state the decider reads */
    --st-goal: #4338ca; --st-plan: #15803d; --st-notes: #a16207; --st-history: #6b7280; --st-page: #0369a1; --st-controls: #9333ea;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1d2026; --line: #343943; --text: #e6e8eb; --muted: #9aa3af;
      --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --new: #e879f9;
      --chosen: #4ade80; --menu: #60a5fa; --excluded: #9ca3af;
      --s1: #22d3ee; --s2: #fb923c; --audit: #a78bfa; --review: #f472b6; --direct: #9aa3af;
      --st-goal: #a5b4fc; --st-plan: #4ade80; --st-notes: #facc15; --st-history: #9ca3af; --st-page: #7dd3fc; --st-controls: #d8b4fe;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .goal { flex: 1 1 400px; min-width: 0; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); min-height: calc(100vh - 50px); }
  nav { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; max-height: calc(100vh - 50px); position: sticky; top: 0; }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; padding: 8px 12px; font: inherit; cursor: pointer; }
  nav button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  nav button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 3px 0 var(--accent); }
  nav button:focus-visible, summary:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav .what { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .meta { font-size: 12px; color: var(--muted); }
  section.step { padding: 12px 16px 48px; min-width: 0; overflow-wrap: anywhere; }
  h2 { font-size: 15px; margin: 20px 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  h2 .ms { font-weight: normal; font-size: 12px; color: var(--muted); }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12.5px; max-height: 420px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.chosen td { background: color-mix(in srgb, var(--chosen) 14%, transparent); }
  .bar { height: 8px; background: var(--accent); border-radius: 4px; min-width: 1px; }
  .shot { position: relative; display: inline-block; max-width: 100%; border: 1px solid var(--line); }
  .shot img { display: block; max-width: 100%; height: auto; }
  .box { position: absolute; border: 2px solid var(--menu); pointer-events: auto; }
  .box.chosen { border-color: var(--chosen); border-width: 3px; background: color-mix(in srgb, var(--chosen) 18%, transparent); }
  .box.new { border-color: var(--new); border-style: dashed; }
  .box.excluded { border-color: var(--excluded); border-style: dotted; border-width: 1px; }
  .box span { position: absolute; top: -1px; left: -1px; font-size: 10px; line-height: 12px; padding: 0 3px; background: var(--menu); color: #fff; }
  .box.chosen span { background: var(--chosen); }
  .box.new span { background: var(--new); }
  .box.excluded span { background: var(--excluded); }
  .toggles { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
  details { margin: 6px 0; }
  summary { cursor: pointer; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .diff li { margin: 2px 0; }
  .add { color: var(--ok); } .rem { color: var(--bad); } .chg { color: var(--warn); }
  .empty { color: var(--muted); padding: 24px 16px; }
  .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .audit { --c: var(--audit); }
  .review, .plan { --c: var(--review); } .direct { --c: var(--direct); }
  .who { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 17px; white-space: nowrap;
    color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .plan.who { border-style: dashed; }
  .card { border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 6%, transparent); border-radius: 0 6px 6px 0; padding: 4px 12px; margin: 8px 0; }
  .card h3 { font-size: 13px; margin: 6px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card h3 .ms { font-weight: normal; font-size: 12px; color: var(--muted); }
  nav .legend { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; }
  nav .legend select { margin-left: auto; font-size: 12px; }
  nav button { border-left: 4px solid var(--c, transparent); }
  pre.state { padding: 0; }
  pre.state .sec { display: block; padding: 2px 10px 2px 8px; border-left: 4px solid var(--sc); }
  pre.state .sec > b { color: var(--sc); }
  .sec.goal { --sc: var(--st-goal); } .sec.plan { --sc: var(--st-plan); } .sec.notes { --sc: var(--st-notes); }
  .sec.history { --sc: var(--st-history); } .sec.page { --sc: var(--st-page); } .sec.controls { --sc: var(--st-controls); }
  .sec.other { --sc: var(--line); }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin: 4px 0; }
  .keys span { border-left: 4px solid var(--sc); padding-left: 4px; }
  .delta li.add::marker { content: '+ '; } .delta li.rem::marker { content: '− '; }
  nav .meta .who { margin-right: 4px; }
  select { font: inherit; }
  code { font-size: 12.5px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } nav { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>webrunner debug</h1>
  <select id="runs" aria-label="Run"></select>
  <span id="result"></span>
  <span class="goal" id="goal"></span>
</header>
<main>
  <nav id="steps" aria-label="Steps"></nav>
  <section class="step" id="detail"><p class="empty">Loading…</p></section>
</main>
<script>
'use strict';
const $ = (sel) => document.querySelector(sel);
const params = new URLSearchParams(location.search);
let runId = params.get('run');
let lines = [];
let current = Number(params.get('step')) || 0;
let timer = null;
const show = { menu: true, chosen: true, new: true, excluded: false };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style') node.setAttribute('style', v);
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const ms = (v) => (v == null ? '' : v >= 1000 ? `${(v / 1000).toFixed(1)} s` : `${v} ms`);
const pct = (p) => (p == null ? '' : `${(p * 100).toFixed(1)}%`);

// Who decided a step. Each kind has a colour and always a text label.
const WHO = {
  s1: { short: 'S1', label: 'System 1', title: 'System 1 (kev) decided' },
  s2: { short: 'S2', label: 'System 2', title: 'System 1 was unsure and handed the step to System 2' },
  audit: { short: 'Audit', label: 'System 2 audit', title: 'System 1 was sure; System 2 reviewed the step at random' },
  review: { short: 'Review', label: 'Plan review', title: 'System 2 rewrote the plan, notes and values; no action' },
  plan: { short: 'Plan', label: 'Original plan', title: 'System 2 wrote the first plan' },
  direct: { short: 'Direct', label: 'Direct', title: 'No decider: the page had one answer' },
};
function whoOf(d) {
  if (!d) return null;
  if (d.system === 'direct') return 'direct';
  if (d.system1) return d.system1.oversight ? 'audit' : d.system1.shrug ? 's2' : 's1';
  // kev alone, or an agent / System 2 decider without kev
  return /^kev\b/.test(d.system || '') ? 's1' : 's2';
}
const chip = (kind, text, long) => el('span', { class: `who ${kind}`, title: WHO[kind].title }, text ?? (long ? WHO[kind].label : WHO[kind].short));
let filter = 'all';
const FILTERS = {
  all: { label: 'All steps', keep: () => true },
  s2: { label: 'System 2 only', keep: (s) => s.plan || s.review || ['s2', 'audit'].includes(whoOf(s.decide)) },
  review: { label: 'Plans and reviews', keep: (s) => s.plan || s.review },
};

async function fetchText(path) {
  const res = await fetch(`${path}${path.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.text();
}

async function loadRuns() {
  let runs = [];
  try { runs = JSON.parse(await fetchText('index.json')); } catch { runs = []; }
  const select = $('#runs');
  select.replaceChildren(...runs.map((r) => el('option', { value: r.id, selected: r.id === runId },
    `${r.ok === true ? '✓' : r.ok === false ? '✗' : '…'} ${r.id}`)));
  if (!runId && runs.length) runId = runs[0].id;
  if (runId && !runs.some((r) => r.id === runId)) select.prepend(el('option', { value: runId, selected: true }, runId));
  select.onchange = () => { runId = select.value; current = 0; history.replaceState(null, '', `?run=${encodeURIComponent(runId)}`); load(); };
}

async function load() {
  clearTimeout(timer);
  if (!runId) { $('#detail').replaceChildren(el('p', { class: 'empty' }, 'No runs yet. Run webrunner, then reload.')); return; }
  try {
    const text = await fetchText(`${encodeURIComponent(runId)}/trace.jsonl`);
    lines = text.split('\n').filter(Boolean).map((l) => JSON.parse(l));
  } catch (err) {
    $('#detail').replaceChildren(el('p', { class: 'empty' }, String(err.message || err)));
    return;
  }
  render();
  // A run still in progress has no end line: keep reading it.
  if (!lines.some((l) => l.type === 'end')) timer = setTimeout(load, 2000);
}

const startLine = () => lines.find((l) => l.type === 'start') || {};
const endLine = () => lines.find((l) => l.type === 'end');
const stepLines = () => lines.filter((l) => l.type === 'step');

function render() {
  const start = startLine();
  const end = endLine();
  $('#goal').textContent = start.goal || '';
  $('#result').replaceChildren(
    end ? el('span', { class: `badge ${end.ok ? 'ok' : 'bad'}` }, end.ok ? 'passed' : 'failed') : el('span', { class: 'badge warn' }, 'running'),
    ' ', el('span', { class: 'muted' }, [start.decider, end ? `${end.steps} steps · ${end.seconds?.toFixed?.(1)} s` : null, end && !end.ok ? end.reason : null].filter(Boolean).join(' · '))
  );
  const steps = stepLines();
  if (!steps.length) { $('#steps').replaceChildren(); $('#detail').replaceChildren(el('p', { class: 'empty' }, 'No steps yet.')); return; }
  if (current < 1 || current > steps.length) current = steps.length;
  const count = { s1: 0, s2: 0, audit: 0, review: 0 };
  for (const s of steps) {
    const w = whoOf(s.decide);
    if (w in count) count[w] += 1;
    if (s.review) count.review += 1;
  }
  const legend = el('div', { class: 'legend' },
    ...['s1', 's2', 'audit', 'review'].map((k) => chip(k, `${WHO[k].short} ${count[k]}`)),
    el('select', { 'aria-label': 'Show steps', onchange: (ev) => { filter = ev.target.value; render(); } },
      ...Object.entries(FILTERS).map(([k, f]) => el('option', { value: k, selected: k === filter }, f.label))));
  const rows = steps.map((s, i) => [s, i]).filter(([s]) => FILTERS[filter].keep(s));
  $('#steps').replaceChildren(legend, ...rows.map(([s, i]) => {
    const d = s.decide;
    const who = whoOf(d);
    const what = s.outcome ? s.outcome : d ? d.action.describe + (d.action.text && !/^type "/.test(d.action.describe) ? ` "${d.action.text}"` : '') : '';
    const conf = who === 's1' && d.confidence != null ? ` ${pct(d.confidence)}` : who === 's2' && d.system1 ? ` · kev ${pct(d.system1.confidence)}` : '';
    const cls = s.act && s.act.error ? 'bad' : s.outcome && /passed|confirmed/.test(s.outcome) ? 'ok' : '';
    return el('button', { class: who || '', 'aria-current': i + 1 === current ? 'true' : 'false', onclick: () => select(i + 1) },
      el('span', { class: `what ${cls}` }, `${s.step}. ${what}`),
      el('span', { class: 'meta' },
        s.plan ? chip('plan') : '', s.review ? chip('review') : '',
        who ? chip(who, `${WHO[who].short}${conf}`) : '',
        d?.system2?.replanned ? el('span', { class: 'who review', title: 'System 2 edited the plan' }, 'plan edit') : '',
        ms((s.observe?.ms || 0) + (s.orient?.ms || 0) + (s.review?.ms || 0) + (d?.ms || 0) + (s.act?.ms || 0))));
  }));
  if (!rows.length) $('#steps').append(el('p', { class: 'empty' }, 'No steps of this kind.'));
  renderStep(steps[current - 1]);
}

function select(n) {
  current = n;
  const url = new URL(location.href);
  url.searchParams.set('step', n);
  history.replaceState(null, '', url);
  render();
  $('#steps').querySelector('[aria-current="true"]')?.focus();
}

function shotView(s) {
  const o = s.observe;
  if (!o.screenshot) return el('p', { class: 'muted' }, 'No screenshot (--shots off).');
  const wrap = el('div', { class: 'shot' });
  const img = el('img', { src: `${encodeURIComponent(runId)}/${o.screenshot}`, alt: `Screenshot at step ${s.step}` });
  wrap.append(img);
  const vw = o.viewport?.width;
  const vh = o.viewport?.height;
  const menuTokens = new Set((s.orient?.menu || []).map((a) => a.token).filter(Boolean));
  const excluded = new Map((s.orient?.excluded || []).map((e) => [e.token, e.reason]));
  const added = new Set(s.diff?.replaced ? [] : (s.diff?.added || []).map((e) => e.token));
  const chosen = s.decide?.action?.token;
  const draw = () => {
    wrap.querySelectorAll('.box').forEach((b) => b.remove());
    const w = vw || img.naturalWidth;
    const h = vh || img.naturalHeight;
    if (!w || !h) return;
    for (const e of o.elements || []) {
      if (!e.box || e.box[2] === 0 || e.box[3] === 0) continue;
      let kind = null;
      if (e.token === chosen && show.chosen) kind = 'chosen';
      else if (menuTokens.has(e.token) && show.menu) kind = 'menu';
      else if (added.has(e.token) && show.new) kind = 'new';
      else if (excluded.has(e.token) && show.excluded) kind = 'excluded';
      if (!kind) continue;
      const [x, y, bw, bh] = e.box;
      if (y + bh <= 0 || y >= h) continue;
      const title = `${e.token} ${e.role} "${e.label}"${excluded.has(e.token) ? ` — ${excluded.get(e.token)}` : ''}`;
      wrap.append(el('div', {
        class: `box ${kind === 'menu' ? '' : kind}`,
        title,
        style: `left:${(x / w) * 100}%;top:${(y / h) * 100}%;width:${(bw / w) * 100}%;height:${(bh / h) * 100}%`,
      }, el('span', {}, e.token)));
    }
  };
  img.addEventListener('load', draw);
  const toggles = el('div', { class: 'toggles' }, ...Object.keys(show).map((k) =>
    el('label', {}, el('input', { type: 'checkbox', checked: show[k], onchange: (ev) => { show[k] = ev.target.checked; draw(); } }), ` ${k}`)));
  return el('div', {}, toggles, wrap);
}

function diffView(diff) {
  if (!diff) return el('p', { class: 'muted' }, 'First observation: nothing to compare.');
  const items = [];
  if (diff.url) items.push(el('li', { class: 'chg' }, `address: ${diff.url.from} → ${diff.url.to}`));
  if (diff.title) items.push(el('li', { class: 'chg' }, `title: ${diff.title.from} → ${diff.title.to}`));
  if (diff.scrolled) items.push(el('li', { class: 'chg' }, `scrolled ${diff.scrolled} px`));
  for (const c of diff.changed) items.push(el('li', { class: 'chg' }, `~ [${c.token}] ${c.role} "${c.label}": "${c.from}" → "${c.to}"`));
  for (const a of diff.added) items.push(el('li', { class: 'add' }, `+ [${a.token}] ${a.role} "${a.label}"`));
  for (const r of diff.removed) items.push(el('li', { class: 'rem' }, `− ${r.role} "${r.label}"`));
  for (const t of diff.texts) items.push(el('li', { class: 'add' }, `+ ${t.role}: ${t.text}`));
  if (!items.length) return el('p', { class: 'warn' }, 'Nothing changed.');
  return el('ul', { class: 'diff' }, items.slice(0, 200));
}

function menuView(s) {
  const d = s.decide;
  // After a shrug the probabilities shown are System 1's: the agent gives none.
  const probs = d?.probabilities || d?.system1?.probabilities || {};
  const s1 = d?.system1?.action;
  const chosen = d?.action?.id;
  const rows = (s.orient?.menu || []).map((a) => ({ ...a, p: probs[a.id] }));
  if (Object.keys(probs).length) rows.sort((a, b) => (b.p ?? -1) - (a.p ?? -1));
  return el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, 'id'), el('th', {}, 'action'), el('th', {}, 'p'), el('th', { style: 'width:30%' }, ''))),
    el('tbody', {}, rows.map((a) => el('tr', { class: a.id === chosen ? 'chosen' : '' },
      el('td', {}, el('code', {}, a.id), ' ',
        s1 && a.id === s1 && a.id !== chosen ? chip('s1', '← System 1') : '',
        a.id === chosen && ['s2', 'audit'].includes(whoOf(d)) ? chip(whoOf(d), `← ${WHO[whoOf(d)].label}`) : ''),
      el('td', {}, a.describe), el('td', { class: 'num' }, pct(a.p)),
      el('td', {}, a.p != null ? el('div', { class: 'bar', style: `width:${Math.max(a.p * 100, 0.5)}%` }) : '')))));
}

function excludedView(s) {
  const byToken = new Map((s.observe?.elements || []).map((e) => [e.token, e]));
  const list = s.orient?.excluded || [];
  if (!list.length) return el('p', { class: 'muted' }, 'Nothing left out.');
  return el('details', {}, el('summary', {}, `${list.length} controls left out of the menu`),
    el('table', {}, el('tbody', {}, list.map((x) => {
      const e = byToken.get(x.token) || {};
      return el('tr', {}, el('td', {}, el('code', {}, x.token)), el('td', {}, `${e.role || ''} "${e.label || ''}"`), el('td', { class: 'muted' }, x.reason));
    }))));
}

function commandsView(commands) {
  if (!commands?.length) return el('p', { class: 'muted' }, 'No commands.');
  return el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, 'command'), el('th', {}, 'exit'), el('th', {}, 'time'))),
    el('tbody', {}, commands.map((c) => el('tr', {},
      el('td', {}, el('code', {}, c.argv.join(' ')),
        c.stdout || c.stderr ? el('details', {}, el('summary', {}, 'output'), el('pre', {}, [c.stdout, c.stderr && `[stderr]\n${c.stderr}`].filter(Boolean).join('\n'))) : ''),
      el('td', { class: `num ${c.exitCode ? 'bad' : ''}` }, c.exitCode), el('td', { class: 'num' }, ms(c.ms))))));
}

// The state the decider reads, one coloured band per section.
const SECTIONS = [
  [/^Goal:/, 'goal', 'Goal'], [/^Plan:/, 'plan', 'Plan'], [/^Notes:/, 'notes', 'Notes'],
  [/^(Done so far|Last action changed|Going in circles|Not as typed):?/, 'history', 'History'],
  [/^(Page|Page text):/, 'page', 'Page'], [/^Controls:/, 'controls', 'Controls'],
];
function stateView(text) {
  const pre = el('pre', { class: 'state' });
  let sec = null;
  for (const line of String(text || '').split('\n')) {
    const hit = SECTIONS.find(([re]) => re.test(line));
    if (hit || !sec) {
      sec = el('span', { class: `sec ${hit ? hit[1] : 'other'}` });
      pre.append(sec);
    }
    const colon = hit ? line.indexOf(':') + 1 : 0;
    if (colon) sec.append(el('b', {}, line.slice(0, colon)), `${line.slice(colon)}\n`);
    else sec.append(`${line}\n`);
  }
  const keys = el('div', { class: 'keys' }, ...SECTIONS.map(([, cls, label]) => el('span', { class: `sec ${cls}` }, label)));
  return el('div', {}, keys, pre);
}

// What one System 2 hand-over changed in the plan.
function planDelta(done, added) {
  if (!(done && done.length) && !(added && added.length)) return el('p', { class: 'muted' }, 'Plan unchanged.');
  return el('ul', { class: 'delta' },
    ...(added || []).map((p) => el('li', { class: 'add' }, `next: ${p}`)),
    ...(done || []).map((p) => el('li', { class: 'rem' }, `done: ${p}`)));
}

// What one System 2 call changed in the notes.
function notesDelta(added, removed) {
  if (!(added && added.length) && !(removed && removed.length)) return el('p', { class: 'muted' }, 'Notes unchanged.');
  return el('ul', { class: 'delta' },
    ...(added || []).map((n) => el('li', { class: 'add' }, `added: ${n}`)),
    ...(removed || []).map((n) => el('li', { class: 'rem' }, `removed: ${n}`)));
}

function planView(plan, notes, values) {
  return el('div', {},
    plan && plan.length ? el('ol', {}, plan.map((p) => el('li', {}, p))) : el('p', { class: 'muted' }, 'No plan.'),
    notes && notes.length ? el('ul', { class: 'muted' }, notes.map((n) => el('li', {}, n))) : '',
    values && values.length ? el('p', {}, 'Values for System 1: ', ...values.map((v, i) => el('span', {}, i ? ' · ' : '', el('code', {}, v.text), v.field ? ` into "${v.field}"` : ''))) : '');
}

function renderStep(s) {
  const o = s.observe || {};
  const d = s.decide;
  const parts = [];
  parts.push(el('h2', {}, `Step ${s.step}`, s.outcome ? el('span', { class: `badge ${/passed|confirmed/.test(s.outcome) ? 'ok' : 'bad'}` }, s.outcome) : ''));
  parts.push(el('p', { class: 'muted' }, `${o.title || ''} — ${o.url || ''}`,
    o.viewport ? ` · viewport ${o.viewport.width}×${o.viewport.height}, scrollY ${o.viewport.scrollY} of ${o.viewport.scrollHeight}` : ''));

  if (s.plan) {
    parts.push(el('div', { class: 'card plan' },
      el('h3', {}, chip('plan', null, true), 'System 2 wrote it before the first step', el('span', { class: 'ms' }, ms(s.plan.ms))),
      planView(s.plan.plan, s.plan.notes),
      s.plan.prompt ? el('details', {}, el('summary', {}, 'plan prompt'), el('pre', {}, s.plan.prompt)) : ''));
  }
  if (s.review) {
    parts.push(el('div', { class: 'card review' },
      el('h3', {}, chip('review', null, true), `System 2, no action: ${s.review.why}`, el('span', { class: 'ms' }, ms(s.review.ms))),
      s.review.assessment ? el('p', {}, s.review.assessment) : '',
      notesDelta(s.review.notesAdded, s.review.notesRemoved),
      planView(s.review.plan, s.review.notes, s.review.values),
      el('p', { class: 'muted' }, 'System 1 then decided this step with the new plan.'),
      s.review.prompt ? el('details', {}, el('summary', {}, 'review prompt'), el('pre', {}, s.review.prompt)) : ''));
  }
  parts.push(el('h2', {}, 'Observe', el('span', { class: 'ms' }, ms(o.ms))));
  parts.push(shotView(s));
  parts.push(el('details', {}, el('summary', {}, 'raw snapshot'), el('pre', { 'data-src': o.snapshot }, 'loading…')));
  parts.push(el('details', {}, el('summary', {}, 'observe commands'), commandsView(o.commands)));

  parts.push(el('h2', {}, 'What the last action changed'));
  parts.push(diffView(s.diff));

  if (s.orient) {
    parts.push(el('h2', {}, 'Orient', el('span', { class: 'ms' }, ms(s.orient.ms))));
    parts.push(el('div', { class: 'grid2' },
      el('div', {}, el('h3', {}, 'State given to the decider'), stateView(s.orient.state),
        s.vision ? el('div', {}, el('h3', {}, `Image given to the decider (${s.vision.width}×${s.vision.height}, ${s.vision.marks} marks)`),
          el('img', { src: `${encodeURIComponent(runId)}/${s.vision.image}`, alt: `Marked screenshot at step ${s.step}`, style: 'max-width:100%;border:1px solid var(--line)' })) : ''),
      el('div', {}, el('h3', {}, `Menu (${s.orient.menu.length})`), menuView(s), excludedView(s))));
  }
  if (s.verify) {
    parts.push(el('h2', {}, 'DONE check'), el('pre', {}, JSON.stringify(s.verify, null, 2)));
  }
  if (d) {
    const who = whoOf(d);
    parts.push(el('h2', {}, 'Decide', chip(who, null, true), el('span', { class: 'ms' }, `${d.system} · ${ms(d.ms)}`)));
    parts.push(el('p', {}, el('strong', {}, d.action.describe), d.action.text ? ` — text "${d.action.text}"` : '',
      d.confidence != null ? el('span', { class: 'muted' }, ` · confidence ${pct(d.confidence)}`) : ''));
    if (d.system1) {
      const s1 = d.system1;
      const verdict = s1.shrug ? `unsure (${s1.shrug}), so it handed the step to System 2.`
        : s1.oversight ? `sure, but System 2 audited the step at random (${s1.oversight.reason}, p=${s1.oversight.chance}).`
        : 'sure: its choice was taken.';
      parts.push(el('div', { class: 'card s1' },
        el('h3', {}, chip('s1', 'System 1 (kev)'), `chose ${s1.action} at ${pct(s1.confidence)}`),
        el('p', {}, verdict)));
    } else if (who === 's1') {
      parts.push(el('div', { class: 'card s1' }, el('h3', {}, chip('s1', 'System 1 (kev)'), 'decided alone')));
    }
    if (d.system2 || (who === 's2' && !d.system1)) {
      const audit = who === 'audit';
      const kept = audit && d.system1 && d.system1.action === d.action.id;
      parts.push(el('div', { class: `card ${audit ? 'audit' : 's2'}` },
        el('h3', {}, chip(audit ? 'audit' : 's2', null, true),
          audit ? (kept ? 'kept System 1\'s choice' : `changed ${d.system1?.action} to ${d.action.id}`) : `decided ${d.action.id}`),
        d.system2?.assessment ? el('p', {}, d.system2.assessment) : '',
        d.system2 && d.system2.planDone ? planDelta(d.system2.planDone, d.system2.planAdded) : '',
        d.system2 ? notesDelta(d.system2.notesAdded, d.system2.notesRemoved) : '',
        d.system2 ? el('details', {}, el('summary', {}, 'the plan, notes and values after this step'), planView(d.system2.plan, d.system2.notes, d.system2.values)) : ''));
    }
    if (d.prompt) parts.push(el('details', {}, el('summary', {}, 'prompt'), el('pre', {}, d.prompt)));
    if (d.answer) parts.push(el('details', {}, el('summary', {}, 'answer'), el('pre', {}, JSON.stringify(d.answer, null, 2))));
  }
  if (s.act) {
    parts.push(el('h2', {}, 'Act', el('span', { class: 'ms' }, ms(s.act.ms))));
    if (s.act.error) parts.push(el('p', { class: 'bad' }, s.act.error));
    parts.push(commandsView(s.act.commands));
  }
  $('#detail').replaceChildren(...parts);
  const pre = $('#detail pre[data-src]');
  if (pre && o.snapshot) {
    pre.closest('details').addEventListener('toggle', async () => {
      if (pre.dataset.loaded) return;
      pre.dataset.loaded = '1';
      try { pre.textContent = await fetchText(`${encodeURIComponent(runId)}/${o.snapshot}`); } catch (err) { pre.textContent = String(err.message || err); }
    }, { once: true });
  }
}

document.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, select, textarea')) return;
  const n = stepLines().length;
  if ((ev.key === 'ArrowDown' || ev.key === 'j') && current < n) { ev.preventDefault(); select(current + 1); }
  if ((ev.key === 'ArrowUp' || ev.key === 'k') && current > 1) { ev.preventDefault(); select(current - 1); }
});

loadRuns().then(load);
</script>
</body>
</html>
