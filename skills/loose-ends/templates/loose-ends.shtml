<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loose ends</title>
  <link rel="icon" href="list-todo" />
  <meta name="loose-ends-store" content="__STORE__" />
  <style>
    :root {
      --fg: var(--s2-content-default, CanvasText);
      --fg-muted: var(--s2-content-secondary, color-mix(in srgb, CanvasText 65%, transparent));
      --line: var(--s2-border-subtle, color-mix(in srgb, CanvasText 12%, transparent));
      --chip: var(--s2-bg-layer-2, color-mix(in srgb, CanvasText 9%, transparent));
      --primary-bg: var(--s2-accent, CanvasText);
      --primary-fg: var(--s2-bg-base, Canvas);
      --negative: var(--s2-negative, #d33);
    }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 12px; color: var(--fg); font: 14px/1.45 var(--s2-font-family, system-ui, sans-serif); }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    h1 small { font-weight: normal; color: var(--fg-muted); font-size: 12px; }
    .card { padding: 12px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
    .card:last-child { border-bottom: 0; }
    .card.busy { opacity: .5; }
    .head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 11px; color: var(--fg-muted); margin-bottom: 3px; }
    .head .when { margin-left: auto; }
    .tag { padding: 0 6px; border-radius: var(--s2-radius-pill, 999px); background: var(--chip); }
    .title { font-weight: 600; overflow-wrap: anywhere; }
    .summary { margin: 3px 0 0; color: var(--fg-muted); overflow-wrap: anywhere; }
    .brief { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; font: 12px/1.45 var(--s2-font-family, system-ui, sans-serif); color: var(--fg-muted); padding-left: 8px; border-left: 2px solid var(--line); }
    .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .actions .spacer { flex: 1; }
    button, select { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: var(--s2-radius-default, 6px); border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer; }
    :where(button, select, a):focus-visible { outline: 2px solid var(--primary-bg); outline-offset: 1px; }
    .quiet { color: var(--fg-muted); padding-left: 4px; padding-right: 4px; }
    .quiet:hover { color: var(--fg); }
    select.quiet { appearance: none; -webkit-appearance: none; }
    .secondary { border-color: var(--line); }
    .primary { background: var(--primary-bg); color: var(--primary-fg); font-weight: 600; }
    button[disabled], select[disabled] { opacity: .4; cursor: default; }
    .section { display: block; margin: 14px 0 0; padding: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); }
    .empty { color: var(--fg-muted); padding: 12px 0; }
    .error { color: var(--negative); padding: 8px 0; font-size: 12px; overflow-wrap: anywhere; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Loose ends <small id="count" aria-live="polite"></small></h1>
  <div id="error" class="error" role="status" hidden></div>
  <div id="open"></div>
  <button type="button" class="section" id="snoozedHead" aria-expanded="false" hidden></button>
  <div id="snoozed" hidden></div>
  <script>
    const STORE = document.querySelector('meta[name="loose-ends-store"]').content;
    const POLL_MS = 3000;
    const bridge = typeof slicc === 'object' && slicc ? slicc : null;
    let mode = null;
    let last = null;
    let showSnoozed = false;
    const pending = new Set();
    const openBriefs = new Set();

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<"']+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    const day = (iso) => {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    };

    function showError(text) {
      const el = document.getElementById('error');
      el.hidden = !text;
      el.textContent = text || '';
    }

    async function cgi(action, body) {
      const init = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { method: 'GET' };
      const res = await fetch(`cgi-bin/${action}`, { ...init, cache: 'no-store' });
      if (res.headers.get('x-loose-ends') !== '2') throw new Error('no cgi-bin');
      const data = await res.json();
      if (!data.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { handled: true });
      return data;
    }

    async function detect() {
      try {
        const data = await cgi('items');
        mode = 'cgi';
        return data;
      } catch (e) {
        if (e.handled) throw e;
        if (!bridge) throw new Error('This panel needs SLICC or a CGI server for its cgi-bin/.');
        mode = 'lick';
        return null;
      }
    }

    async function act(command, task, extra) {
      pending.add(task.id);
      render();
      const data = { id: task.id, ...(extra || {}) };
      if (mode === 'cgi') {
        try {
          const res = await cgi(command, data);
          pending.delete(task.id);
          showError('');
          apply({ updated: res.updated, tasks: res.tasks });
        } catch (e) {
          pending.delete(task.id);
          showError(`${command} failed: ${e.message}`);
          render();
        }
        return;
      }
      bridge.lick({ action: command, data: { ...data, title: task.title } });
    }

    function card(t, snoozed) {
      const el = document.createElement('div');
      el.className = pending.has(t.id) ? 'card busy' : 'card';
      const busy = pending.has(t.id) ? 'disabled' : '';
      const tags = (t.skills || []).map((x) => `<span class="tag">${esc(x)}</span>`).join('');
      const when = (snoozed ? `until ${esc(day(t.snoozedUntil))}` : `since ${esc(day(t.created))}`) + (t.cone ? ` · ${esc(t.cone)}` : '');
      const briefOpen = openBriefs.has(t.id);
      const doButton = bridge ? `<button type="button" class="primary" data-a="do" ${busy}>Do</button>` : '';
      el.innerHTML = `
        <div class="head">${tags}<span class="when">${when}</span></div>
        <div class="title">${esc(t.title)}</div>
        ${t.summary ? `<div class="summary">${linkify(t.summary)}</div>` : ''}
        ${t.detail ? `<pre class="brief" ${briefOpen ? '' : 'hidden'}>${linkify(t.detail)}</pre>` : ''}
        <div class="actions">
          ${t.detail ? `<button type="button" class="quiet" data-a="brief" aria-expanded="${briefOpen}">${briefOpen ? '▾' : '▸'} Brief</button>` : ''}
          ${snoozed ? '' : `<select class="quiet" data-a="snooze" aria-label="Snooze" ${busy}><option value="">Snooze ▾</option><option value="tomorrow">Tomorrow</option><option value="monday">Next Monday</option><option value="week">Next week</option></select>`}
          ${t.url ? '<button type="button" class="quiet" data-a="view">View ↗</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="secondary" data-a="done" ${busy}>Done</button>
          ${snoozed ? `<button type="button" class="primary" data-a="wake" ${busy}>Wake</button>` : doButton}
        </div>`;
      for (const b of el.querySelectorAll('button')) {
        b.onclick = () => {
          const a = b.dataset.a;
          if (a === 'view') return window.open(t.url, '_blank', 'noopener');
          if (a === 'brief') {
            if (openBriefs.has(t.id)) openBriefs.delete(t.id);
            else openBriefs.add(t.id);
            return render();
          }
          if (a === 'do') return bridge.lick({ action: 'do', data: { id: t.id, title: t.title } });
          act(a, t);
        };
      }
      const sel = el.querySelector('select');
      if (sel) sel.onchange = () => sel.value && act('snooze', t, { when: sel.value });
      return el;
    }

    function render() {
      if (!last) return;
      const now = Date.now();
      const live = last.tasks.filter((t) => !t.done);
      const snoozed = live.filter((t) => t.snoozedUntil && Date.parse(t.snoozedUntil) > now);
      const open = live.filter((t) => !snoozed.includes(t));
      document.getElementById('count').textContent = `${open.length} open${snoozed.length ? ` · ${snoozed.length} snoozed` : ''}`;
      const empty = Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Nothing open.' });
      document.getElementById('open').replaceChildren(...(open.length ? open.map((t) => card(t, false)) : [empty]));
      const head = document.getElementById('snoozedHead');
      head.hidden = !snoozed.length;
      head.textContent = `${showSnoozed ? '▾' : '▸'} Snoozed (${snoozed.length})`;
      head.setAttribute('aria-expanded', String(showSnoozed));
      const list = document.getElementById('snoozed');
      list.hidden = !showSnoozed || !snoozed.length;
      list.replaceChildren(...snoozed.map((t) => card(t, true)));
    }

    function apply(store) {
      if (!store || !Array.isArray(store.tasks)) return;
      if (last && store.updated !== last.updated) pending.clear();
      const changed = !last || JSON.stringify(store) !== JSON.stringify(last);
      last = store;
      if (changed) render();
    }

    async function load() {
      try {
        if (mode === null) {
          const first = await detect();
          if (first) return apply(first);
        }
        if (mode === 'cgi') return apply(await cgi('items'));
        if (!(await bridge.exists(STORE))) return apply({ updated: null, tasks: [] });
        apply(JSON.parse(await bridge.readFile(STORE)));
        showError('');
      } catch (e) {
        showError(`Can't read the loose ends: ${e.message || e}`);
      }
    }

    document.getElementById('snoozedHead').onclick = () => {
      showSnoozed = !showSnoozed;
      render();
    };
    load();
    setInterval(() => {
      if (!document.hidden) load();
    }, POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) load();
    });
  </script>
</body>
</html>
