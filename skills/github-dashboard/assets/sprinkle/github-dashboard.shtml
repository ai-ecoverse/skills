<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub work</title>
    <link rel="icon" href="git-pull-request" />
    <style>
      /* ------------------------------------------------------------------
         UNWIRED DRAFT (rev 2, design review applied).

         Colour rules, unchanged:
           - every colour is a var(--s2-*) token, or a var(--uxc-*-subtle-*)
             pair from the sprinkle style guide where S2 has no hue (see the
             GITHUB SEMANTICS block below);
           - every var() fallback chains to another token, never a literal;
           - no @media (prefers-color-scheme): the host toggles .theme-light
             on this document's <html> and the tokens swap in lockstep.

         Corner budget (review item 1): the shell has none, the accordion
         groups have none, only cards are rounded — one level, not three.
         ------------------------------------------------------------------ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --line: var(--s2-border-subtle, var(--s2-bg-layer-2));
        --fg: var(--s2-content-default);
        --fg-muted: var(--s2-content-secondary, var(--s2-content-default));
        --fg-faint: var(--s2-content-tertiary, var(--s2-content-secondary));

        /* ------------- GITHUB STATE PALETTE (pass 3, item 2) -------------
           Hue accuracy to GitHub wins over semantic naming here, so state
           colours come from the hue-specific --uxc-<hue>-subtle-* pairs
           (theme-aware, contrast-checked as a pair). Each one degrades to an
           S2 token if a --uxc-* is ever absent. NON-state chrome — surfaces,
           text, borders, radii, spacing, type — stays purely --s2-*.

           GitHub's convention                    this panel uses
           open issue/PR, CI success, approved    --uxc-positive-subtle-text
           in progress (no GitHub equivalent)     --uxc-accent-subtle-text
           CI pending, waiting, merge queue       --uxc-yellow-subtle-text
           CI failure, conflicts, changes req.    --uxc-negative-subtle-text
           merged, closed-as-completed            --uxc-purple-subtle-text
           draft PR                               --s2-content-tertiary — NOT
             --uxc-gray-subtle-text (#292929/#cfcfcf: that is body text, so
             draft would read as emphasised rather than muted) and NOT
             --s2-gray-500, which is #8f8f8f light but #6e6e6e dark, i.e. it
             gets DARKER on the dark theme and loses glyph contrast.
             content-tertiary (#717171/#8a8a8a) inverts correctly and lands
             closest to GitHub's own muted grey (#6e7781/#8b949e).
           ---------------------------------------------------------------- */
        --gh-open: var(--uxc-positive-subtle-text, var(--s2-positive));
        --gh-progress: var(--uxc-accent-subtle-text, var(--s2-accent));
        --gh-pending: var(--uxc-yellow-subtle-text, var(--s2-notice));
        --gh-fail: var(--uxc-negative-subtle-text, var(--s2-negative));
        --gh-draft: var(--s2-content-tertiary, var(--s2-content-secondary));
        --gh-merged: var(--uxc-purple-subtle-text, var(--s2-accent));
        --gh-neutral: var(--s2-content-tertiary, var(--s2-content-secondary));
      }
      :root.theme-light {
        color-scheme: light;
      }

      body {
        font:
          14px/1.45 var(--s2-font-family, system-ui),
          sans-serif;
        background: var(--s2-bg-base);
        color: var(--fg);
        padding: var(--s2-spacing-200, 12px);
        /* No fixed height and no overflow:hidden — the panel scrolls. */
      }

      /* --- header ------------------------------------------------------ */
      .head {
        padding-bottom: var(--s2-spacing-100, 8px);
      }
      .head-row {
        display: flex;
        flex-wrap: wrap; /* 8d: lets a stale-snapshot warning take its own line */
        align-items: center;
        gap: 8px;
      }
      .head-row h1 {
        font-size: 15px;
        font-weight: 700;
      }
      .head-row .count-total {
        margin-left: auto;
        color: var(--fg-muted);
        font-size: var(--s2-font-size-75, 12px);
      }
      .head-row > .sprinkle-icon {
        color: var(--fg-muted);
      }
      /* Phase 8d: snapshot age. FRESH: one muted item after the count, same
         size and colour, a clock glyph as its separator. STALE / UNKNOWN: the
         same element takes the header's full width on its own line under the
         title row, a band inside the header rather than a floating toast,
         built like .store-error. The warning is carried by the WORDS and by a
         different glyph (clock -> triangle-alert); the notice colour on the
         border and glyph is the third, redundant signal. The text stays
         --fg, so it reads at full contrast in both themes. Records are never
         dimmed: the reader still wants them, just warned. */
      .snap-age {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--fg-muted);
        font-size: var(--s2-font-size-75, 12px);
        white-space: nowrap;
      }
      .snap-age .sprinkle-icon {
        flex: none;
      }
      .snap-age[data-state='stale'],
      .snap-age[data-state='unknown'] {
        flex-basis: 100%;
        gap: 6px;
        white-space: normal;
        padding: var(--s2-spacing-75, 6px) var(--s2-spacing-100, 8px);
        border: 1px solid var(--s2-notice);
        border-left-width: 3px;
        border-radius: var(--s2-radius-default, 8px);
        background: var(--s2-bg-layer-1);
        color: var(--fg);
        font-weight: var(--s2-font-weight-bold, 700);
      }
      .snap-age[data-state='stale'] .sprinkle-icon,
      .snap-age[data-state='unknown'] .sprinkle-icon {
        color: var(--s2-notice);
      }
      /* Screen-reader-only text: the snapshot-age live region. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Project filter row (review item 4). Everything clickable in this
         panel is a .sprinkle-btn; nothing else is allowed to look clickable. */
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: var(--s2-spacing-100, 8px);
      }
      .btn-mini.sprinkle-btn {
        height: 26px;
        padding: 0 10px;
        font-size: var(--s2-font-size-75, 12px);
        font-weight: 600;
        box-shadow: none;
      }
      /* Controls must not share a surface colour with the card they sit on,
         in either theme — otherwise only the hairline border says "button". */
      .btn-mini.sprinkle-btn--secondary {
        background: var(--s2-bg-elevated);
      }
      .btn-mini.sprinkle-btn .n {
        color: inherit;
        opacity: 0.7;
      }
      /* Inert controls: real buttons that do nothing YET. They keep button
         chrome (so they read as controls) but not the pointer cursor (so they
         do not promise a working click). Phase 7a wired the three per-card
         actions, so the only survivor is the project `+`. */
      .btn-inert.sprinkle-btn {
        cursor: default;
      }

      /* --- phase 7c: quick view ----------------------------------------
         A <dialog> rather than a bespoke overlay: showModal() gives the focus
         trap, the inert background and Escape-to-close for free, so the
         keyboard behaviour is the platform's rather than my approximation of it.
         Everything it shows already sits in the snapshot, so it opens with no
         network call and no model call. */
      .qv {
        border: 1px solid var(--line);
        border-radius: var(--s2-radius-default, 8px);
        background: var(--s2-bg-base);
        color: var(--fg);
        padding: 0;
        width: min(680px, 92vw);
        max-height: 82vh;
        box-shadow: var(--s2-shadow-container, 0 8px 32px rgb(0 0 0 / 0.28));
        /* Phase 7o, requested: "when quickview is open, it can't be scrolled and
           scrolls the background instead."

           MEASURED on the longest record (2,816 chars of content, 1020px
           viewport): a scroll container DID exist and DID work — .qv-inner had
           scrollHeight 932 against clientHeight 836 and its scrollTop could be
           driven to 95.6. Two other things made it useless:

             • overscroll-behavior-y was `auto` on it, so the moment those 96px
               of travel were used up — one wheel notch — the gesture CHAINED to
               the document, which was scrollable at scrollTop 3253. A view that
               scrolls 96px and then hands the wheel to the page reads exactly as
               "it can't be scrolled and scrolls the background instead";
             • the dialog element's own overflow-y is `auto` when modal but
               `visible` when NOT (Chrome styles dialog:modal differently), so the
               two modes had different geometry: committed had two nested
               scrollers, hover had one.

           So: the DIALOG is now the single scroll container in BOTH modes, with
           chaining contained. .qv-inner stops scrolling (below) — nested
           scrollers are the classic reason a wheel gesture appears to do nothing.
           overflow-y here also overrides the UA's `visible` for the non-modal
           case, which is what made hover behave differently at all. */
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* Phase 7i: a NON-modal dialog (the hover case) is not viewport-centred by
         the UA the way a modal one is — it lays out against the document, so on a
         scrolled page it would open above the viewport and simply not be seen.
         Pin it to the viewport explicitly. The modal case keeps the UA's own
         centring and is untouched. */
      .qv.is-hover {
        position: fixed;
        inset: 0;
        margin: auto;
      }
      .qv::backdrop {
        background: color-mix(in srgb, var(--s2-bg-base) 62%, transparent);
      }
      .qv-inner {
        display: grid;
        gap: var(--s2-spacing-200, 12px);
        padding: var(--s2-spacing-300, 16px);
        /* Phase 7o: NOT a scroll container any more, and no second max-height.
           It used to carry `max-height: 82vh; overflow: auto`, i.e. it was capped
           against the VIEWPORT while sitting inside a dialog capped the same way
           — which is why the dialog itself reported scrollHeight 836 against
           clientHeight 835. The dialog scrolls; this just lays the content out. */
        max-height: none;
        overflow: visible;
      }
      .qv-head {
        display: flex;
        align-items: flex-start;
        gap: var(--s2-spacing-200, 12px);
        /* Phase 7o: with the dialog scrolling, a long quick view would carry its
           title and close button off the top. Sticky keeps the one control that
           dismisses it reachable at every scroll position; the background is the
           dialog's own token so content cannot show through it. */
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--s2-bg-base);
        padding-bottom: var(--s2-spacing-100, 8px);
      }
      .qv-head .qv-heading {
        flex: 1 1 auto;
        min-width: 0;
        display: grid;
        gap: 4px;
      }
      .qv-title {
        font-size: var(--s2-font-size-200, 16px);
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .qv-title code {
        font-family: var(--s2-font-mono, ui-monospace, monospace);
        font-size: 0.92em;
        padding: 0 3px;
        border-radius: var(--s2-radius-s, 4px);
        background: var(--s2-bg-layer-2, var(--s2-bg-layer-1));
      }
      .qv-sub {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: var(--s2-font-size-75, 12px);
        color: var(--fg-muted);
      }
      .qv-sub a {
        color: var(--s2-accent);
      }
      .qv-sect {
        display: grid;
        gap: 4px;
      }
      .qv-sect > h4 {
        margin: 0;
        font-size: var(--s2-font-size-50, 11px);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--fg-faint);
        font-weight: 600;
      }
      .qv-body,
      .qv-comment p {
        margin: 0;
        font-size: var(--s2-font-size-75, 12px);
        line-height: var(--s2-line-height-75, 16px);
        color: var(--fg-muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* Phase 7l: rendered markdown inside the quick view. Every value is a
         var(--s2-*) token or one of this panel's own derived vars — no literal
         colours, no prefers-color-scheme, and no min-height/clamp. The rules are
         scoped under .md so they cannot reach the panel's own chrome. */
      .md-host > .md {
        display: grid;
        gap: var(--s2-spacing-100, 8px);
      }
      .md p,
      .md ul,
      .md ol,
      .md blockquote,
      .md pre,
      .md table {
        margin: 0;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        margin: 0;
        font-size: var(--s2-font-size-100, 14px);
        font-weight: var(--s2-font-weight-bold, 700);
        color: var(--fg);
      }
      .md ul,
      .md ol {
        padding-left: var(--s2-spacing-200, 16px);
        display: grid;
        gap: 2px;
      }
      .md blockquote {
        border-left: 2px solid var(--line);
        padding-left: var(--s2-spacing-100, 8px);
        color: var(--fg-muted);
      }
      .md code {
        font-family: var(--s2-font-mono, ui-monospace, monospace);
        font-size: 0.92em;
        background: var(--s2-bg-layer-2, var(--s2-bg-layer-1));
        border-radius: var(--s2-radius-s, 4px);
        padding: 0 3px;
      }
      .md pre {
        background: var(--s2-bg-layer-2, var(--s2-bg-layer-1));
        border: 1px solid var(--line);
        border-radius: var(--s2-radius-s, 4px);
        padding: var(--s2-spacing-100, 8px);
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        border: 0;
        padding: 0;
      }
      .md table {
        border-collapse: collapse;
        font-size: var(--s2-font-size-75, 12px);
      }
      .md th,
      .md td {
        border: 1px solid var(--line);
        padding: 2px var(--s2-spacing-75, 6px);
        text-align: left;
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line);
      }
      .md details > summary {
        cursor: pointer;
        color: var(--fg-muted);
      }
      /* A link whose scheme was refused, an image from an untrusted host, and an
         image that failed to load all keep their text and are marked inert rather
         than disappearing: silently dropping content would be its own bug. These
         are ATTRIBUTE selectors because the renderer is not allowed to emit a
         class — an input-chosen class could impersonate the panel's own UI. */
      .md [data-md='link-dropped'],
      .md [data-md='img-dropped'],
      .md [data-md='img-broken'] {
        color: var(--fg-faint);
        text-decoration: underline dotted;
      }
      /* Phase 7m: images from trusted hosts (github.com, *.githubusercontent.com).
         max-width keeps a 2000px screenshot from blowing out the quick view, and
         height:auto keeps its aspect ratio while it is still loading. */
      .md img.md-img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid var(--line);
        border-radius: var(--s2-radius-s, 4px);
        background: var(--s2-bg-layer-2, var(--s2-bg-layer-1));
      }
      .qv-comment {
        border-left: 2px solid var(--line);
        padding-left: var(--s2-spacing-100, 8px);
        display: grid;
        gap: 2px;
      }
      .qv-comment > time {
        font-size: var(--s2-font-size-50, 11px);
        color: var(--fg-faint);
      }
      .qv-act {
        display: grid;
        gap: 2px;
        padding: var(--s2-spacing-100, 8px);
        border: 1px solid var(--line);
        border-left-width: 3px;
        border-radius: var(--s2-radius-s, 4px);
      }
      .qv-act[data-kind='approve'] { border-left-color: var(--gh-open); }
      .qv-act[data-kind='nudge'] { border-left-color: var(--gh-progress); }
      .qv-act[data-kind='clarify'] { border-left-color: var(--gh-pending); }
      /* An unknown kind is not an error, so it reads neutral, not alarming. */
      .qv-act[data-kind-unknown='1'] { border-left-color: var(--gh-neutral); }
      .qv-act .qv-act-inert {
        display: flex;
        align-items: center;
        gap: var(--s2-spacing-75, 6px);
        margin-top: var(--s2-spacing-75, 6px);
        font-size: var(--s2-font-size-50, 11px);
        color: var(--fg-faint);
      }
      .qv-act .qv-act-label {
        font-size: var(--s2-font-size-75, 12px);
        font-weight: 600;
      }
      .qv-act .qv-act-why {
        font-size: var(--s2-font-size-50, 11px);
        color: var(--fg-faint);
      }
      /* The only new control this phase: the quick view's close button. */
      .qv-close.sprinkle-btn {
        flex: none;
        width: 28px;
        padding: 0;
        background: var(--s2-bg-elevated);
      }
      /* The description is the hover/keyboard handle for the quick view, so it
         has to look interactive on approach without looking like a button. */
      .status[data-qv] {
        cursor: pointer;
      }
      .status[data-qv]:hover,
      .status[data-qv]:focus-visible {
        color: var(--fg);
      }

      /* --- accordion groups (review items 1 + 3) ----------------------- */
      .grp {
        border-top: 1px solid var(--line);
      }
      .grp > summary {
        list-style: none;
        cursor: pointer;
        padding: 9px 2px;
      }
      .grp > summary::-webkit-details-marker {
        display: none;
      }
      .grp > summary:hover {
        background: var(--s2-bg-layer-1);
      }
      /* The flex row lives on a wrapper INSIDE <summary> so nothing of ours
         sets `display` on the element that owns collapse behaviour. */
      .grp-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grp-row .chev {
        color: var(--fg-faint);
        transition: transform var(--s2-transition-default, 0.13s ease);
      }
      .grp[open] > summary .chev {
        transform: rotate(90deg);
      }
      .grp-row .dot {
        width: 8px;
        height: 8px;
        border-radius: var(--s2-radius-pill, 9999px);
        background: var(--tone);
      }
      .grp-row .name {
        font-weight: 600;
      }
      .grp-row .n {
        margin-left: auto;
        color: var(--fg-muted);
        font-size: var(--s2-font-size-75, 12px);
      }

      /* --- card grid (review item 2): up to three abreast, no media
         queries. Each column is at least a third of the row, so auto-fit
         can never make a fourth; below 3x--card-min it reflows to 2 then 1.
         Width comes from the panel, not the viewport. ------------------- */
      .card-grid {
        --cols: 3;
        --grid-gap: var(--s2-spacing-200, 12px);
        --card-min: 250px;
        display: grid;
        gap: var(--grid-gap);
        /* Phase 6a, requested: "I want the cards to have the same height ... so
           that they can grow to their box size." Default align-items is
           stretch, so each row's box grows to its TALLEST card's content and
           every card in that row fills it. There is deliberately NO
           grid-auto-rows, NO min-height on any text element and NO line
           clamping: the earlier attempt used those and clipped a
           190-character title, which is why it was reverted. */
        grid-template-columns: repeat(
          auto-fit,
          minmax(
            max(var(--card-min), calc((100% - (var(--cols) - 1) * var(--grid-gap)) / var(--cols))),
            1fr
          )
        );
        padding-bottom: var(--s2-spacing-300, 16px);
      }

      /* --- card -------------------------------------------------------- */
      /* .sprinkle-card supplies border, shadow and background. We retune
         padding, radius and height, but NEVER `display` — the framework owns
         that. All internal layout therefore lives on .card-inner. */
      .card.sprinkle-card {
        padding: var(--s2-spacing-200, 12px);
        border-radius: var(--s2-radius-default, 8px);
        background: var(--s2-bg-layer-1);
      }
      /* Item A: fixed row order with the footer pinned to the bottom edge.
         Row 4 (the status block) absorbs the slack, so the button/timestamp
         row sits flush at the bottom however short the text above it is. */
      /* Fill the (stretched) card, and give the BODY row the slack so it
         collects between the text and the footer rather than under the text.
         height:100% is relative to a card whose height the grid row has
         already made definite — it is not a fixed height. */
      .card-inner {
        display: grid;
        grid-template-rows: auto auto auto 1fr auto;
        row-gap: 6px;
        height: 100%;
      }
      /* MEASURED 2026-09-21: without this, .row-top was 632px wide inside a
         326px content box and the card's scrollWidth (657) exceeded its
         clientWidth (350) — a grid item's automatic minimum size is its
         min-content width, so the row expanded the column instead of letting
         the tag block shrink, and the fit pass never saw an overflow to act
         on. min-width:0 lets the column hold the card's width, which is what
         forces .tags to shrink and the +N overflow to engage. */
      .card-inner > * {
        min-width: 0;
      }
      /* The framework lifts a card's shadow on hover. A card is not
         clickable (only its link and its three buttons are), so kill the
         affordance and keep the resting shadow. */
      .card.sprinkle-card:hover {
        box-shadow: var(--s2-shadow-container);
      }

      /* Item C: the progress bar IS the card's top border. Negative margins
         cancel the card padding *and* its border, so the bar covers the
         border line, and its top corners use the card's radius so nothing
         square pokes out. .sprinkle-progress-bar keeps its own
         overflow:hidden, which clips the fill to those corners.
         `width: auto` is required: the framework sets width:100%, which
         ignores the negative margins and leaves the bar 26px short. */
      .bar-top.sprinkle-progress-bar {
        margin: calc(-1 * (var(--s2-spacing-200, 12px) + 1px))
          calc(-1 * (var(--s2-spacing-200, 12px) + 1px)) 0;
        width: auto;
        border-radius: var(--s2-radius-default, 8px) var(--s2-radius-default, 8px) 0 0;
        height: 4px;
      }

      .row-top {
        display: flex;
        /* Phase 6a: ONE line, always. Tags no longer drop to a second row;
           instead the fit pass hides the lowest-IDF ones behind a +N count, so
           nothing is clipped mid-label and nothing vanishes silently. The 20px
           floor matches the state glyph so the row cannot collapse. */
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        min-height: 20px;
      }
      /* Item D: this is the state signal. Glyph is primary, colour secondary.
         The NAME sits on this SPAN, not on the <svg>: Chrome does not render a
         tooltip from a `title` ATTRIBUTE on an SVG element (SVG wants a
         <title> child), so the span carries title + role=img + aria-label and
         the glyph inside is aria-hidden. */
      .state-icon {
        display: inline-flex;
        align-items: center;
        color: var(--tone);
        flex: none;
      }
      .ref {
        display: inline-flex;
        align-items: center;
        font-family: var(--s2-font-mono, ui-monospace), monospace;
        font-size: var(--s2-font-size-75, 12px);
        color: var(--fg);
        text-decoration: none;
        /* Shrink and ellipsize rather than wrap (see .row-top). */
        min-width: 0;
        overflow: hidden;
      }
      /* The emphasised part of the identifier carries the item's state tone,
         the same --gh-* value as the state glyph and the top bar (pass 4).
         --tone is set on the .card element, so it inherits here. The muted
         `org/` prefix above is deliberately left on --fg-faint. */
      .ref .num {
        color: var(--tone);
        /* The number is the primary token in the identifier; on draft cards it
           shares the prefix's grey, so weight carries the emphasis instead of
           colour (pass 5). Colour values are untouched. */
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ref .org {
        color: var(--fg-faint);
        white-space: nowrap;
      }
      .ref:hover .num {
        text-decoration: underline;
      }

      /* Labels (review item 11): flat, no border, no shadow — a tag, not a
         control. GitHub renders labels as pills, so keep the shape. */
      /* Labels are information the reader filters work by, so nothing is
         hidden behind a tooltip or an overflow marker: the row wraps and every
         label stays whole. margin-left:auto keeps them at the right-hand end of
         the identifier when they fit, and right-aligned on their own line when
         they do not. No fixed height anywhere — the card grows instead. */
      /* Right-aligned, always: the block's right edge sits flush with the
         card's content edge on every card. That is the consistent rule the owner
         asked for — the old inconsistency came from wrapping, where a full row
         looked left-aligned; with one line and a +N overflow it cannot happen.
         flex-shrink is huge so the TAGS give up width first and the identifier
         keeps its natural size; the fit pass then hides whatever no longer
         fits. */
      .tags {
        display: flex;
        flex-wrap: nowrap;
        gap: 4px;
        margin-left: auto;
        flex: 0 999 auto;
        min-width: 0;
        overflow: hidden;
      }
      /* The overflow count. A tag, not a control: flat, no border, no pointer. */
      .tag-more {
        flex: none;
        font-size: var(--s2-font-size-50, 11px);
        line-height: 1.5;
        padding: 0 6px;
        border-radius: var(--s2-radius-pill, 9999px);
        background: var(--s2-bg-layer-2);
        color: var(--fg-faint);
        white-space: nowrap;
      }
      .tag {
        font-size: var(--s2-font-size-50, 11px);
        line-height: 1.5;
        padding: 0 6px;
        border-radius: var(--s2-radius-pill, 9999px);
        background: var(--uxc-gray-subtle-bg, var(--s2-bg-layer-2));
        color: var(--uxc-gray-subtle-text, var(--s2-content-secondary));
        /* nowrap keeps a label from breaking across lines. flex:none is what
           makes the fit pass work: a shrinkable tag would be squeezed and
           ellipsised instead of overflowing, so the row never reported an
           overflow and no tag was ever hidden (measured). With flex:none the
           tags keep their natural width, the row overflows, and the pass hides
           the lowest-IDF ones behind +N. max-width + ellipsis remains only as
           the fallback for a single label wider than the whole row, which ends
           in a visible "…" rather than a hard cut. */
        flex: none;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title {
        font-size: var(--s2-font-size-100, 14px);
        font-weight: 600;
        line-height: 1.3;
        overflow-wrap: anywhere;
        /* Pass 5: no clamp and no reserve — the title wraps to as many lines
           as it needs and the card grows with it. */
      }
      /* Phase 7c: a markdown code span inside a title. Monospace and a hairline
           tint say "this is an identifier", without the box growing the line: no
           padding on the block axis, and a font-size step down so the glyph box
           stays inside the existing 1.3 line-height. That keeps titles at the
           same height as before, which the equal-row invariant depends on. */
      .title code {
        font-family: var(--s2-font-mono, ui-monospace, monospace);
        font-size: 0.92em;
        padding: 0 3px;
        border-radius: var(--s2-radius-s, 4px);
        background: var(--s2-bg-layer-2, var(--s2-bg-layer-1));
        color: var(--fg);
      }
      /* Item D: the textual state chip is gone — glyph + colour + tooltip
         carry the state now, with the coloured top bar as second carrier.
         The --gh-draft / --gh-merged badge tints died with the chip; those
         hues live on in the --gh-* custom properties. */
      .status {
        font-size: var(--s2-font-size-75, 12px);
        /* Pinned to the token (not the inherited 1.45) so status and note
           share one rhythm. */
        line-height: var(--s2-line-height-75, 16px);
        color: var(--fg-muted);
        overflow-wrap: anywhere;
        /* Phase 6a: the two-line clamp is GONE. It existed to bound card
           height, and stretch now does that job properly — a long status
           makes its row taller instead of losing text. Nothing in a card is
           truncated any more except a pathological single label (see .tag). */
      }
      /* Phase 4: a card can represent an issue + its PR (+ a bb thread). The
         PR leads (it is the .ref), and everything else is listed here so the
         reader can SEE the card covers several artefacts and can reach each
         one. Links, not controls. */
      .also {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        font-size: var(--s2-font-size-50, 11px);
        line-height: var(--s2-line-height-75, 16px);
        color: var(--fg-faint);
      }
      .also-item {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        min-width: 0;
      }
      .also-role {
        color: var(--fg-faint);
      }
      .also-ref {
        font-family: var(--s2-font-mono, ui-monospace), monospace;
        color: var(--fg-muted);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      a.also-ref:hover {
        color: var(--s2-accent);
        text-decoration: underline;
      }
      .note {
        font-size: var(--s2-font-size-75, 12px);
        line-height: var(--s2-line-height-75, 16px);
        color: var(--fg-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Items B + G: icon-only buttons at one end, timestamp at the other. */
      .foot {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .acts {
        display: flex;
        gap: 4px;
      }
      /* Row 4 of the card: the status (+ optional note). Pass 5 removed the
         three-line reservation, so this block is only as tall as its text. */
      .card-body {
        display: grid;
        align-content: start;
        row-gap: 4px;
      }
      /* Item B: icon-only and square, so three fit beside the timestamp even
         in a one-column rail. */
      .icon-btn.sprinkle-btn {
        width: 26px;
        height: 26px;
        padding: 0;
        box-shadow: none;
        background: var(--s2-bg-elevated);
      }
      /* Phase 7a. The `Go` action is an <a> whenever it has somewhere to go:
         an anchor navigates without depending on a popup-blocker's idea of a
         user gesture, and it gives middle-click and copy-link for free. It
         wears the same .sprinkle-btn + .icon-btn chrome, so the row is
         unchanged; these three declarations only undo anchor defaults. No
         width/height here — the shared .icon-btn rule above owns the box. */
      .acts a.icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      /* A latched action is a STATE, not a colour accident: aria-pressed
         carries it to assistive tech and the tone token paints it. Both
         latching actions (done, scoop requested) are reversible, so the
         pressed look has to read as "on", not as "disabled". */
      .acts .sprinkle-btn[aria-pressed='true'] {
        color: var(--gh-open);
        border-color: var(--gh-open);
        background: var(--s2-bg-layer-1);
      }
      /* Phase 7c: DISPATCH IS CONFIRMED BY COLOUR. A scoop request that has been
         sent paints its own button instead of adding a line of copy to the card.
         Accent, not the done green: dispatched means in flight, not finished,
         and the check button already owns green. The tint is mixed from the S2
         accent token so it follows the theme in both directions, and the
         selector carries the aria-pressed attribute as well so it wins over the
         generic pressed rule above regardless of source order.
         Three distinguishable steps: plain button, dispatched, dispatched+hover. */
      /* Phase 7p: the action buttons live inside the quick view, so the dispatched
         colour has to be stated for them too — the existing rule is scoped to
         `.acts` on a card. Same tokens, same convention: colour plus aria-pressed,
         never new copy. */
      .qv-act-do {
        margin-top: var(--s2-spacing-100, 8px);
      }
      .qv-act-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--s2-spacing-100, 8px);
        font-size: var(--s2-font-size-75, 12px);
      }
      .qv-act .sprinkle-btn.is-dispatched[aria-pressed='true'] {
        color: var(--s2-accent);
        border-color: var(--s2-accent);
        background: color-mix(in srgb, var(--s2-accent) 14%, var(--s2-bg-elevated));
      }
      .qv-act .sprinkle-btn.is-dispatched[aria-pressed='true']:hover {
        background: color-mix(in srgb, var(--s2-accent) 30%, var(--s2-bg-elevated));
      }
      .acts .sprinkle-btn.is-dispatched[aria-pressed='true'] {
        color: var(--s2-accent);
        border-color: var(--s2-accent);
        background: color-mix(in srgb, var(--s2-accent) 14%, var(--s2-bg-elevated));
      }
      .acts .sprinkle-btn.is-dispatched[aria-pressed='true']:hover {
        background: color-mix(in srgb, var(--s2-accent) 30%, var(--s2-bg-elevated));
      }
      .acts .sprinkle-btn[aria-disabled='true'] {
        opacity: 0.5;
      }
      /* A store failure is rendered, never swallowed: a click that did not
         reach the file must not keep looking applied. */
      .store-error {
        margin-top: var(--s2-spacing-100, 8px);
        padding: var(--s2-spacing-100, 8px);
        border: 1px solid var(--gh-fail);
        border-left-width: 3px;
        border-radius: var(--s2-radius-default, 8px);
        background: var(--s2-bg-layer-1);
        color: var(--gh-fail);
        font-size: var(--s2-font-size-75, 12px);
      }
      /* Review item 12: relative time, bottom-right, exact value in title. */
      .when {
        margin-left: auto;
        color: var(--fg-faint);
        font-size: var(--s2-font-size-75, 12px);
        white-space: nowrap;
      }
      /* Phase 2: an unusable snapshot must be loud and specific. Colours come
         from the existing --gh-* state layer, so no new palette. */
      .load-error {
        display: grid;
        gap: var(--s2-spacing-100, 8px);
        margin-top: var(--s2-spacing-200, 12px);
        padding: var(--s2-spacing-300, 16px);
        border: 1px solid var(--gh-fail);
        border-left-width: 3px;
        border-radius: var(--s2-radius-default, 8px);
        background: var(--s2-bg-layer-1);
      }
      .load-error__head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--gh-fail);
        font-size: var(--s2-font-size-200, 16px);
      }
      .load-error__detail {
        color: var(--fg-muted);
        font-size: var(--s2-font-size-75, 12px);
      }
      .load-error__path {
        font-family: var(--s2-font-mono, ui-monospace), monospace;
        font-size: var(--s2-font-size-75, 12px);
        color: var(--fg);
        background: var(--s2-bg-layer-2);
        border-radius: var(--s2-radius-s, 4px);
        padding: 4px 6px;
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--fg-faint);
        font-size: var(--s2-font-size-75, 12px);
        padding-bottom: var(--s2-spacing-200, 12px);
      }
      footer {
        margin-top: var(--s2-spacing-200, 12px);
        padding-top: var(--s2-spacing-100, 8px);
        border-top: 1px solid var(--line);
        color: var(--fg-faint);
        font-size: var(--s2-font-size-50, 11px);
      }
    </style>
  </head>

    <script type="module">
      /* ==================================================================
         GitHub work dashboard — WIRED TO A LIVE SNAPSHOT (phase 2).
         Records come from data/snapshot.json, produced out-of-band by the
         fetcher. This panel makes no GitHub calls itself: it reads one VFS
         file through slicc.readFile and derives every category from it. If
         that file is missing, unreadable or malformed the panel renders an
         explicit error and NO records — it must never present stale work as
         current.

         Interactive surface (deliberately small):
           - project filter chips: filter locally, no lick, no I/O;
           - accordion open/close: native <details>;
           - the three per-card actions (phase 7a): snooze and done write USER
             STATE to a second VFS file and re-render; go navigates. NONE of
             them writes to GitHub, and the panel still makes no GitHub calls;
           - the project `+`: still INERT, no handler.
         ================================================================== */

      /* GHD-CLASSIFY:START (phase 8e) ------------------------------------
         From here to the matching END marker is PURE: constants and functions of
         (record, now). tests/live-clock.test.js cuts it out of the BUILT panel
         and runs it, so it must not reach DOM, module state or a clock.
         ------------------------------------------------------------------ */

      /* ------------------------------------------------------------------
         1. TUNABLE CONSTANTS
         ------------------------------------------------------------------ */

      // Stall limit in hours for the stages an AGENT owns (thread started,
      // working, draft PR).
      const STALL_AFTER_HOURS = 6;
      // Review waits on other humans, so tolerate far longer.
      const REVIEW_STALL_AFTER_HOURS = 24;
      // The merge queue should move in minutes.
      const MERGE_QUEUE_STALL_AFTER_HOURS = 2;
      // Per-stage overrides of STALL_AFTER_HOURS (internal stage number -> h).
      const STALL_AFTER_HOURS_BY_STAGE = {
        6: REVIEW_STALL_AFTER_HOURS,
        8: MERGE_QUEUE_STALL_AFTER_HOURS,
      };
      // Snooze backoff: snoozeCount (re-snoozes with NOTHING changed) indexes
      // this table for the next snooze length. Clamped at the end.
      const FIB_BACKOFF_DAYS = [1, 1, 2, 3, 5, 8, 13, 21];

      // Phase 5, requested: "an open issue without work or comments should move from
      // needs attention to stalled after five working days". WORKING days, so
      // weekends do not burn the clock down.
      // Amended 2026-09-25 (operator): a comment RESETS the five-working-day clock; it
      // does not exempt the issue. Until then an issue with even one comment could
      // never stall (ai-ecoverse/skills#360: one comment, 12.1 working days idle,
      // held in needs-attention). The clock is counterResetAt, which the fetcher
      // moves on every qualifying timeline event, human comments included, and
      // never on the mirror's own comments or a Bot's.
      const ISSUE_STALL_AFTER_WORKING_DAYS = 5;

      // Phase 6b, the original spec for the done pile: two working days,
      // weekend-extended. A done item older than this leaves the done group
      // entirely — it is finished AND stale, so it is not one of the four
      // working categories either. The fetcher supplies a five-day window so
      // this cap has something to bite on.
      const DONE_RETENTION_WORKING_DAYS = 2;

      // Phase 7a: where the bb threads this panel links to actually live. The
      // snapshot supplies the PROJECT ids (meta.threadLinkage.projects) but not
      // the server, so this is the one piece of configuration in the panel. It
      // is an origin, not a credential — bb's own API needs a stored machine
      // credential that this panel never sees or wants. Verified with `bb
      // status`. A future fetcher run should carry it as meta.bbOrigin so this
      // constant can go away.
      // Phase 7e/7f: the bb origin now travels WITH the data. The fetcher emits
      // it as meta.bbOrigin (from /shared/github-monitor/config.json), so the
      // panel reads it from the snapshot and keeps this literal only as the
      // fallback for a snapshot generated before 7e.
      const BB_ORIGIN_FALLBACK = 'https://bb.example.invalid';
      function bbOrigin() {
        const fromMeta = META && typeof META.bbOrigin === 'string' ? META.bbOrigin.trim().replace(/\/+$/, '') : '';
        return /^https?:\/\/[^\s/]+$/.test(fromMeta) ? fromMeta : BB_ORIGIN_FALLBACK;
      }

      // Internal stage numbers. NEVER rendered (review item 5) — they remain
      // the sort key and the input to the category derivation.
      const WORKING_STAGES = [2, 4, 5, 6, 8];
      const DONE_STAGES = [10, 11];
      // Merged-but-unreleased counts as waiting-on-the-release-train.
      const RELEASE_WAIT_IS_SNOOZE = true;

      // Phase 8e: there is NO module clock. Until 8e a `const NOW = new Date()`
      // stood here, fixed when the panel opened, and every reader below drifted
      // on a panel left open: labels stopped counting, nothing ever stalled,
      // expired snoozes stayed snoozed, the done pile never aged out. Every
      // function here takes `now` (ms or Date) from its caller; the caller's
      // clock is PASS_NOW (see "LIVE CLOCK", next to the 8d age tick).

      /* ------------------------------------------------------------------
         2. STATE MODEL

         Internally an item still carries a numeric stage (1..11) and an
         optional substage ('5a'..'8b'); that is how work is ordered and how
         the category is derived. The UI shows only the NAME of the state and
         a coloured progress bar (review item 5).

         `tone` names a GitHub semantic; the CSS maps each tone to an S2
         token in one place (see the GITHUB SEMANTICS block in <style>).
         ------------------------------------------------------------------ */

      /* Item D: the glyph is the PRIMARY state signal, colour is secondary,
         and the label reaches assistive tech through title + aria-label.
         Every state therefore needs its OWN glyph — the four failure states
         are shape-coded (circle / triangle / octagon / square) precisely
         because they all share the red tone. `glyphCollisions` in
         window.__ghDashboard asserts the distinctness. */
      const STATE = {
        1: { label: 'open issue', icon: 'circle-dot', tone: 'open', progress: 8 },
        2: { label: 'thread started', icon: 'message-square', tone: 'progress', progress: 18 },
        3: { label: 'needs guidance', icon: 'circle-help', tone: 'pending', progress: 22 },
        4: { label: 'agent working', icon: 'bot', tone: 'progress', progress: 36 },
        5: {
          label: 'draft PR, CI running',
          icon: 'git-pull-request-draft',
          tone: 'draft',
          progress: 50,
        },
        '5a': { label: 'CI failing', icon: 'circle-x', tone: 'fail', progress: 50 },
        '5b': { label: 'merge conflicts', icon: 'triangle-alert', tone: 'fail', progress: 50 },
        6: { label: 'in review', icon: 'eye', tone: 'progress', progress: 64 },
        '6a': { label: 'approved', icon: 'thumbs-up', tone: 'open', progress: 70 },
        '6b': {
          label: 'changes requested',
          icon: 'message-square-warning',
          tone: 'fail',
          progress: 64,
        },
        7: { label: 'ready to merge', icon: 'circle-check-big', tone: 'open', progress: 76 },
        8: { label: 'in merge queue', icon: 'list-ordered', tone: 'pending', progress: 86 },
        '8a': {
          label: 'merge queue conflicts',
          icon: 'octagon-alert',
          tone: 'fail',
          progress: 86,
        },
        '8b': { label: 'merge queue checks failed', icon: 'square-x', tone: 'fail', progress: 86 },
        9: { label: 'merged, awaiting release', icon: 'git-merge', tone: 'merged', progress: 94 },
        10: { label: 'released', icon: 'package-check', tone: 'open', progress: 100 },
        11: { label: 'closed', icon: 'circle-check', tone: 'merged', progress: 100 },
      };

      // Where a failure state sends the work back to. Internal only — never
      // rendered (review item 13); a human decides between guidance and
      // straight rework anyway.
      const BOUNCE_DEFAULTS = { '5a': 4, '5b': 4, '6b': 3, '8a': 4, '8b': 4 };

      // tone -> the CSS custom property for the bar, and the badge class for
      // the chip. positive/accent/notice/negative come from the framework;
      // the two GitHub hues S2 lacks are defined in <style>.
      // tone -> the CSS custom property used for BOTH the state glyph's
      // colour and the top bar's fill. (The badge classes are gone with the
      // textual chip.) The two GitHub hues S2 lacks are noted in <style>.
      const TONE = {
        open: 'var(--gh-open)',
        progress: 'var(--gh-progress)',
        pending: 'var(--gh-pending)',
        fail: 'var(--gh-fail)',
        draft: 'var(--gh-draft)',
        merged: 'var(--gh-merged)',
      };

      const CATEGORIES = {
        'needs-attention': {
          label: 'Needs attention',
          tone: 'var(--gh-pending)',
          // Pass-3 item 1: no group renders its explainer as visible prose.
          // Every group's `lead` reaches the reader through the summary's
          // title= only, so all five behave identically.
          lead: 'Issues to dispatch, and open questions pointed at you.',
        },
        active: {
          label: 'Actively being worked on',
          tone: 'var(--gh-progress)',
          lead: 'An agent is busy; you are waiting on the agent.',
        },
        snoozed: {
          label: 'Snoozed',
          tone: 'var(--gh-neutral)',
          lead: 'Waiting on something else — an upstream release, an external dependency, another human. Fibonacci backoff while nothing changes; a comment cancels the snooze, and here the alarm button un-snoozes.',
        },
        stalled: {
          label: 'Stalled',
          tone: 'var(--gh-fail)',
          lead: 'Looks like it is working, but nothing has moved for longer than the state allows.',
        },
        done: {
          label: 'Done',
          tone: 'var(--gh-open)',
          lead: 'Released or closed. Terminal states have no home in the four working categories, so they get their own group.',
        },
      };

      // Rendering order, and which groups start open (review item 3).
      const ORDER = ['needs-attention', 'stalled', 'active', 'snoozed', 'done'];
      const OPEN_BY_DEFAULT = ['needs-attention', 'stalled'];

      /* ------------------------------------------------------------------
         3. CATEGORY DERIVATION — one pure function over one item record.
            categorize(item, now) -> { category, reason }
            `reason` is kept for debugging (window.__ghDashboard); it is no
            longer rendered — the card shows a human status line instead
            (review item 10).

         PRECEDENCE (explicit, highest first):
           0. DONE (released / closed) wins over everything: it is over.
           1. A HUMAN IS BLOCKED beats a snooze — changes requested, a thread
              asking for guidance, or an all-green PR nobody queued. A snooze
              is a promise that nothing needs you yet; these falsify it.
           2. SNOOZE beats STALLED: silence is exactly what was asked for.
              Merged-awaiting-release is treated the same way. A snooze is
              void once a comment lands after it was set.
           3. Undispatched issue (open, no thread) -> needs attention, EXCEPT
              3a. An open issue with no work (no thread, no closing PR) that
                  has been untouched for ISSUE_STALL_AFTER_WORKING_DAYS working
                  days -> STALLED. This is a deliberate exception to the
                  ordering: step 3 would otherwise hold it in needs-attention
                  for ever. Nothing else moves; the counter comes from the
                  GitHub timeline (counterResetAt), never from updated_at, and
                  cross-references and mentions do not reset it. Since
                  2026-09-25 comments do not exempt an issue: a human comment
                  is a qualifying event, so it RESETS the counter (mirror and
                  Bot comments do not), and an issue that goes quiet again
                  stalls five working days later like any other.
           4. STALLED: a working state idle longer than its limit.
           5. ACTIVE: everything else in a working state.
           6. Fallback -> needs attention: an item we cannot classify is a
              bug in this function, so surface it rather than hide it.
         ------------------------------------------------------------------ */

      function hoursSince(iso, now) {
        return (now - new Date(iso)) / 36e5;
      }

      /* Working-day arithmetic. Weekends (Saturday + Sunday) do not count; a
         working day is 24h of wall-clock on a Mon-Fri, NOT an 8h shift, because
         the rule is about an issue sitting untouched and an issue does not rest
         overnight. Day boundaries are UTC: the data is UTC and the panel renders
         UTC, so classification cannot depend on the viewer's timezone.
         Public holidays are deliberately not modelled — they vary by country,
         nothing in the data says which applies, and guessing would silently
         shift classifications. Unit-checked against weekend-crossing spans, a
         Saturday start, and spans crossing two and three weekends. */
      const WORKING_DAY_MS = 864e5;

      function workingMsBetween(from, to) {
        const a = new Date(from).getTime();
        const b = new Date(to).getTime();
        if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a) return 0;
        let total = 0;
        let cursor = a;
        while (cursor < b) {
          const d = new Date(cursor);
          const dayStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
          const segEnd = Math.min(b, dayStart + WORKING_DAY_MS);
          const dow = new Date(dayStart).getUTCDay(); // 0 Sun ... 6 Sat
          if (dow !== 0 && dow !== 6) total += segEnd - cursor;
          cursor = segEnd;
        }
        return total;
      }

      function workingDaysSince(iso, now) {
        return workingMsBetween(iso, now) / WORKING_DAY_MS;
      }

      /** An open issue nobody has started work on: no closing PR and no thread
          of any kind. Exactly the population the five-working-day rule applies
          to. Comments do NOT exclude an issue (2026-09-25; until then this was
          isUntouchedOpenIssue and required commentsCount === 0): they reset the
          clock instead, through counterResetAt, see untouchedWorkingDays(). */
      function isUndispatchedOpenIssue(item) {
        return item.kind === 'issue' && item.stage === 1 && !item.thread && !item.hasClosingPr;
      }

      /** Working days since the last event that counts as "something happened
          to this issue". The fetcher supplies counterResetAt from the GitHub
          timeline (filtered to real changes, human comments included; the
          mirror's own comments and Bots' excluded); lastActivityAt is only a
          fallback for a record written before that field existed. */
      function untouchedWorkingDays(item, now) {
        return workingDaysSince(item.counterResetAt || item.lastActivityAt, now);
      }

      /** Snooze state, including "a comment cancels the snooze". */
      function snoozeState(item, now) {
        if (!item.snoozedUntil) return { present: false, active: false };
        const until = new Date(item.snoozedUntil);
        const since = item.snoozedAt ? new Date(item.snoozedAt) : null;
        const commentedAfter =
          !!item.lastCommentAt && !!since && new Date(item.lastCommentAt) > since;
        const step = item.snoozeCount ?? 0;
        const idx = Math.min(step, FIB_BACKOFF_DAYS.length - 1);
        return {
          present: true,
          active: !commentedAfter && until > now,
          expired: until <= now,
          cancelledByComment: commentedAfter,
          until,
          step,
          days: FIB_BACKOFF_DAYS[idx],
          nextDays: FIB_BACKOFF_DAYS[Math.min(step + 1, FIB_BACKOFF_DAYS.length - 1)],
          reason: item.snoozeReason || null,
        };
      }

      function stallLimitFor(stage) {
        return STALL_AFTER_HOURS_BY_STAGE[stage] ?? STALL_AFTER_HOURS;
      }

      /** THE pure function. No I/O, no clock read — `now` is injected. */
      function categorize(item, now) {
        const stage = item.stage;
        const sub = item.substage || null;
        const idle = hoursSince(item.lastActivityAt, now);
        const snooze = snoozeState(item, now);

        // Phase 7a, precedence step 0: the user pressed done. That outranks
        // everything GitHub says, including a still-open issue — the mark means
        // "I have handled this", not "GitHub thinks this is closed". Retention
        // counts from doneAt, NOT lastActivityAt: the item became finished when
        // the human said so, so it gets its full two working days of visibility
        // from that moment (and stays reversible for exactly that long).
        if (item.doneAt) {
          const heldFor = workingDaysSince(item.doneAt, now);
          if (heldFor > DONE_RETENTION_WORKING_DAYS) {
            return {
              category: 'aged-out',
              reason: `marked done locally ${heldFor.toFixed(1)} working days ago (retention ${DONE_RETENTION_WORKING_DAYS})`,
            };
          }
          return {
            category: 'done',
            reason: `marked done locally ${heldFor.toFixed(1)} working days ago (nothing written to GitHub)`,
          };
        }

        if (DONE_STAGES.includes(stage)) {
          // Retention, in WORKING days: a Friday release is still in the pile on
          // Tuesday. Older than that and the item ages out of the panel rather
          // than being reclassified — nothing that is over belongs in a working
          // category. render() skips any category outside ORDER and counts it.
          const doneFor = workingDaysSince(item.lastActivityAt, now);
          if (doneFor > DONE_RETENTION_WORKING_DAYS) {
            return {
              category: 'aged-out',
              reason: `${stage === 10 ? 'released' : 'closed'} ${doneFor.toFixed(1)} working days ago (retention ${DONE_RETENTION_WORKING_DAYS})`,
            };
          }
          return {
            category: 'done',
            reason: `${stage === 10 ? 'released' : 'closed'} ${doneFor.toFixed(1)} working days ago`,
          };
        }
        if (sub === '6b') return { category: 'needs-attention', reason: 'changes requested' };
        if (stage === 3) return { category: 'needs-attention', reason: 'thread wants guidance' };
        if (stage === 7) return { category: 'needs-attention', reason: 'all green, not queued' };

        if (snooze.active) {
          return {
            category: 'snoozed',
            reason: `snoozed ${snooze.days}d (backoff step ${snooze.step})`,
          };
        }
        if (stage === 9 && RELEASE_WAIT_IS_SNOOZE) {
          return { category: 'snoozed', reason: 'waiting on the release train' };
        }
        if (stage === 1 && !item.thread) {
          // 3a: the five-working-day exception (see the precedence note above).
          if (isUndispatchedOpenIssue(item)) {
            const wd = untouchedWorkingDays(item, now);
            if (wd >= ISSUE_STALL_AFTER_WORKING_DAYS) {
              return {
                category: 'stalled',
                reason: `untouched ${wd.toFixed(1)} working days (limit ${ISSUE_STALL_AFTER_WORKING_DAYS})`,
              };
            }
            return {
              category: 'needs-attention',
              reason: `no thread yet, untouched ${wd.toFixed(1)} of ${ISSUE_STALL_AFTER_WORKING_DAYS} working days`,
            };
          }
          return { category: 'needs-attention', reason: 'no thread yet' };
        }
        if (WORKING_STAGES.includes(stage)) {
          const limit = stallLimitFor(stage);
          if (idle >= limit) {
            return { category: 'stalled', reason: `idle ${Math.round(idle)}h, limit ${limit}h` };
          }
          return { category: 'active', reason: `moved ${Math.round(idle)}h ago` };
        }
        return { category: 'needs-attention', reason: 'unclassified — surfaced deliberately' };
      }

      /* Phase 8e: the clock-dependent reads the DOM side needs, kept pure. */

      /** A card's "Xh ago". Clamped at zero: a record whose activity is later
          than this runtime's clock (a follower's clock, or activity after the
          pass) reads "0m ago", never "-30m ago". */
      function whenLabel(iso, now) {
        return fmtHours(Math.max(0, hoursSince(iso, now))) + ' ago';
      }

      /** Keys whose category at `now` differs from the one the list on screen
          was built with (`renderedCats`: key -> category, 'aged-out'
          included). Records the list never showed are not drift. */
      function categoryDrift(records, renderedCats, now, keyOf) {
        const drift = [];
        for (const r of records) {
          const k = keyOf(r);
          if (!renderedCats.has(k)) continue;
          const cat = categorize(r, now).category;
          if (cat !== renderedCats.get(k)) drift.push({ key: k, from: renderedCats.get(k), to: cat });
        }
        return drift;
      }

      /** May a CLOCK-driven regroup move cards now? Only when nobody can be
          mid-interaction: the panel is hidden, or no quick view is open, the
          pointer is outside the panel and keyboard focus is not in the list. */
      function canRegroup(s) {
        return !!s.hidden || (!s.dialogOpen && !s.pointerInside && !s.focusInside);
      }
      /* GHD-CLASSIFY:END ------------------------------------------------- */

      /* ------------------------------------------------------------------
         4. DATA SOURCE — the live snapshot, read from the VFS.

            Shape: { meta, records }. `records` carries the same contract the
            fixture did: id, repo, kind, title, url, stage, openedAt,
            lastActivityAt, labels, status, statusSource on every record, plus
            optional substage / ci / mergedAt / reviewers / thread / snooze
            fields. Absent optional fields are normal (the fetcher omits what
            GitHub cannot express) and must never render as "undefined".

            `statusSource` distinguishes 'derived' (mechanically composed from
            measured fields by the fetcher) from 'placeholder' (human-authored
            prose, which only the old fixture had) and 'agent' (model-written,
            not yet implemented).

            There is deliberately NO fallback to bundled data: a quiet catch
            here would show stale work as current.
         ------------------------------------------------------------------ */

      // `let`, not `const`: phase 7f lets a TEST probe repoint the panel at a
      // prepared snapshot under a scoop workspace, so driving the reconciler
      // through transitions never touches the live data the user is looking at.
      let SNAPSHOT_PATH = '/shared/sprinkles/github-dashboard/data/snapshot.json';

      let RECORDS = [];
      let META = null;
      let LOAD_ERROR = null;

      async function loadSnapshot() {
        if (typeof slicc === 'undefined' || typeof slicc.readFile !== 'function') {
          LOAD_ERROR = { what: 'No VFS bridge', detail: 'slicc.readFile is unavailable, so the snapshot cannot be read.' };
          return;
        }
        let text;
        try {
          text = await slicc.readFile(SNAPSHOT_PATH);
        } catch (err) {
          LOAD_ERROR = { what: 'Snapshot unreadable', detail: String((err && err.message) || err) };
          return;
        }
        if (typeof text !== 'string' || text.trim() === '') {
          LOAD_ERROR = { what: 'Snapshot empty', detail: 'The file exists but contains no data.' };
          return;
        }
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (err) {
          LOAD_ERROR = { what: 'Snapshot is not valid JSON', detail: String((err && err.message) || err) };
          return;
        }
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.records)) {
          LOAD_ERROR = { what: 'Snapshot has the wrong shape', detail: 'Expected { meta, records: [...] }; records is not an array.' };
          return;
        }
        const bad = parsed.records.findIndex(
          (r) => !r || typeof r !== 'object' || r.stage === undefined || !r.id || !r.repo || !r.lastActivityAt,
        );
        if (bad !== -1) {
          LOAD_ERROR = {
            what: 'Snapshot record is incomplete',
            detail: 'Record at index ' + bad + ' is missing id, repo, stage or lastActivityAt.',
          };
          return;
        }
        RECORDS = parsed.records;
        META = parsed.meta || null;
      }

      /* ------------------------------------------------------------------
         4b. USER STATE — the panel's OWN store (phase 7a).

         The fetcher OVERWRITES snapshot.json on every run, so user intent
         cannot live there: the next mirror of GitHub would destroy it. This
         second file is written only by this panel and read by nobody else,
         which keeps the two concerns apart — snapshot.json is what GitHub
         says, user-state.json is what the human decided.

         KEY: `<owner>/<repo>#<number>`, not the bare record id. GitHub numbers
         are per-repository: `403` names a PR in one repo and could name another
         tomorrow, and a bare-id store would silently apply one repo's snooze
         to the other repo's work. (Measured on this snapshot: 0 collisions
         among 101 ids today — the composite key is about tomorrow.)

         ABSENT FILE = empty store. That is the first run, not an error.

         STALE KEYS (an entry whose record is not in the snapshot) are KEPT,
         not pruned: the fetch window is five days, the record can come back,
         and deleting would quietly drop a snooze the user is still counting
         on. render() counts them and says so in the header tooltip.

         UNREADABLE FILE (present but corrupt) makes the store READ-ONLY: the
         panel renders the failure and refuses clicks rather than overwriting
         a file whose contents it could not understand.
         ------------------------------------------------------------------ */

      const USER_STATE_PATH = '/shared/sprinkles/github-dashboard/data/user-state.json';
      const USER_STATE_VERSION = 1;

      let USER_STATE = { version: USER_STATE_VERSION, items: {} };
      let STORE_WRITABLE = true;
      let STORE_ERROR = null;
      let STALE_KEYS = [];

      /** Stable identity of one card's work, across fetches and repos. */
      function recordKey(item) {
        return `${item.repo}#${item.id}`;
      }

      async function loadUserState() {
        USER_STATE = { version: USER_STATE_VERSION, items: {} };
        STORE_WRITABLE = true;
        if (typeof slicc === 'undefined' || typeof slicc.writeFile !== 'function') {
          STORE_WRITABLE = false;
          STORE_ERROR = {
            what: 'No VFS bridge',
            detail: 'slicc.writeFile is unavailable, so snooze and done cannot be saved. The three card actions are disabled.',
          };
          return;
        }
        let text = null;
        try {
          if (typeof slicc.exists === 'function' && !(await slicc.exists(USER_STATE_PATH))) {
            return; // first run: no file yet, empty store, no complaint
          }
          text = await slicc.readFile(USER_STATE_PATH);
        } catch (err) {
          STORE_WRITABLE = false;
          STORE_ERROR = {
            what: 'User state unreadable',
            detail:
              String((err && err.message) || err) +
              ' — clicks are refused rather than overwriting a file this panel could not read.',
          };
          return;
        }
        if (typeof text !== 'string' || text.trim() === '') return; // empty file = empty store
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (err) {
          STORE_WRITABLE = false;
          STORE_ERROR = {
            what: 'User state is not valid JSON',
            detail:
              String((err && err.message) || err) +
              ' — the file was left exactly as it is and clicks are refused, so nothing is lost. Fix or delete it, then close and reopen the panel.',
          };
          return;
        }
        if (!parsed || typeof parsed !== 'object' || !parsed.items || typeof parsed.items !== 'object') {
          STORE_WRITABLE = false;
          STORE_ERROR = {
            what: 'User state has the wrong shape',
            detail: 'Expected { version, items: { "owner/repo#N": {…} } }; clicks are refused so the file is not overwritten.',
          };
          return;
        }
        USER_STATE = { version: parsed.version ?? USER_STATE_VERSION, items: parsed.items };
      }

      async function saveUserState() {
        USER_STATE.version = USER_STATE_VERSION;
        USER_STATE.updatedAt = new Date().toISOString();
        USER_STATE.writtenBy = 'github-dashboard sprinkle (panel clicks only)';
        USER_STATE.note =
          'User intent for the GitHub dashboard. The fetcher never writes this file; snapshot.json never holds user state.';
        await slicc.writeFile(USER_STATE_PATH, JSON.stringify(USER_STATE, null, 2) + '\n');
      }

      /** Merge the store onto the in-memory records. These are the objects this
          panel parsed for itself, so the merge touches nothing on disk. Store
          fields WIN over snapshot fields of the same name — the snapshot cannot
          know what the user decided ten seconds ago. Every applied field is
          remembered in __fromStore so the next pass can undo it: that is what
          makes an undo-click visible without re-reading the snapshot. */
      function applyUserState() {
        STALE_KEYS = [];
        for (const r of RECORDS) {
          for (const f of r.__fromStore || []) delete r[f];
          delete r.__fromStore;
          delete r.userState;
        }
        const byKey = new Map(RECORDS.map((r) => [recordKey(r), r]));
        for (const [key, entry] of Object.entries(USER_STATE.items || {})) {
          const item = byKey.get(key);
          if (!item || !entry || typeof entry !== 'object') {
            STALE_KEYS.push(key);
            continue;
          }
          const applied = [];
          if (entry.snoozedUntil) {
            item.snoozedUntil = entry.snoozedUntil;
            item.snoozedAt = entry.snoozedAt || entry.snoozedUntil;
            item.snoozeCount = entry.snoozeCount ?? 0;
            item.snoozeReason = entry.snoozeReason || null;
            applied.push('snoozedUntil', 'snoozedAt', 'snoozeCount', 'snoozeReason');
          }
          if (entry.doneAt) {
            item.doneAt = entry.doneAt;
            applied.push('doneAt');
          }
          if (entry.scoopRequestedAt) {
            item.scoopRequestedAt = entry.scoopRequestedAt;
            applied.push('scoopRequestedAt');
          }
          // Phase 7p: per-action dispatch marks, so an action button's colour
          // survives a reopen AND a reconcile. Copied by reference deliberately:
          // __fromStore removes the field on the next pass, so the record never
          // keeps a stale mark after the store entry is cleared.
          if (entry.actionsDispatched && typeof entry.actionsDispatched === 'object') {
            item.actionsDispatched = entry.actionsDispatched;
            applied.push('actionsDispatched');
          }
          item.userState = entry;
          item.__fromStore = applied;
        }
      }

      function storeEntry(item) {
        return USER_STATE.items[recordKey(item)] || null;
      }

      /** One store mutation, optimistic then persisted.

          Optimistic because a click has to be acknowledged at once: the card
          moves group and the counts change in the same task as the click.
          Rolled back and RENDERED on a write failure, because a click that
          never reached the file must not keep looking applied. */
      async function mutateStore(item, mutate, describe) {
        if (!STORE_WRITABLE) {
          render();
          return false;
        }
        const key = recordKey(item);
        const before = key in USER_STATE.items ? JSON.stringify(USER_STATE.items[key]) : null;
        const entry = { ...(USER_STATE.items[key] || {}) };
        mutate(entry);
        if (Object.keys(entry).length) USER_STATE.items[key] = entry;
        else delete USER_STATE.items[key];
        STORE_ERROR = null;
        render();
        try {
          await saveUserState();
          return true;
        } catch (err) {
          if (before === null) delete USER_STATE.items[key];
          else USER_STATE.items[key] = JSON.parse(before);
          STORE_ERROR = {
            what: `Could not save ${describe} for ${key}`,
            detail: String((err && err.message) || err) + ' — the change was rolled back.',
          };
          render();
          return false;
        }
      }

      /* --- the three actions ------------------------------------------- */

      /** Phase 7k, requested: "fix the snooze, so it becomes an unsnooze when it's in
          that column."

          The snooze control has TWO MODES, and the mode is decided by the COLUMN
          the card is rendered in — categorize().category === 'snoozed' — not by
          whether a snooze mark merely exists. That distinction is load-bearing,
          because the two are not the same set:

            • a card can hold an ACTIVE snooze and still be rendered in
              needs-attention — changes requested, a thread wanting guidance and
              an all-green PR nobody queued all outrank a snooze (see
              categorize()). There the control must keep snoozing: offering to
              un-snooze a card that is not in the snoozed column would clear a
              mark whose effect the user cannot currently see.
            • a card can sit in the snoozed column with NO mark at all — merged
              and waiting on the release train. An un-snooze there would have
              nothing to clear, so the control stays a snooze.

          Hence un-snooze ⟺ an ACTIVE mark AND the snoozed column.

          Every difference between the two modes comes from this one function, so
          actions() (first render), updateActions() (the 7f reconcile) and
          snoozeClick() (the click) cannot disagree about which mode is showing.
          That is the same single-distinction discipline QV_MODE uses for the
          quick view: a control whose behaviour depends on the column but whose
          appearance does not is the original bug restated. */
      /* GHD-SNOOZESPEC:START */
      function snoozeSpec(item, now) {
        const sn = snoozeState(item, now);
        const inSnoozedColumn = categorize(item, now).category === 'snoozed';
        const nextStep =
          sn.present && !sn.cancelledByComment
            ? Math.min((item.snoozeCount ?? 0) + 1, FIB_BACKOFF_DAYS.length - 1)
            : 0;
        const nextDays = FIB_BACKOFF_DAYS[nextStep];
        const writes = ' Writes data/user-state.json. Nothing is written to GitHub.';
        if (sn.active && inSnoozedColumn) {
          return {
            mode: 'unsnooze',
            icon: 'alarm-clock-off',
            label: 'Un-snooze',
            // Pressed describes the STATE (this card is snoozed); the label
            // describes what the click does. Same pairing as "Undo done".
            pressed: 'true',
            title:
              `Snoozed until ${fmtWhen(item.snoozedUntil)} — backoff step ${sn.step} (${sn.days}d). ` +
              'Click to UN-SNOOZE: removes snoozedUntil/snoozedAt/snoozeCount/snoozeReason, so the ' +
              'card returns to whichever column its GitHub state puts it in. The backoff is CLEARED ' +
              'too, so a later snooze starts again at ' + FIB_BACKOFF_DAYS[0] + 'd (step 0), not ' +
              `${nextDays}d.` + writes,
          };
        }
        return {
          mode: 'snooze',
          icon: 'alarm-clock',
          label: sn.active ? 'Snooze again' : 'Snooze',
          pressed: sn.active ? 'true' : 'false',
          title:
            (sn.active
              ? `Already snoozed until ${fmtWhen(item.snoozedUntil)}. Nothing has changed since, so clicking advances the Fibonacci backoff to ${nextDays}d (step ${nextStep}).`
              : sn.cancelledByComment
                ? `A comment cancelled the previous snooze, so the backoff RESETS: this snoozes for ${nextDays}d (step 0).`
                : `Snooze for ${nextDays}d (Fibonacci step ${nextStep}) and move this card to Snoozed.`) +
            ' Writes snoozedUntil/snoozedAt/snoozeCount to data/user-state.json. A comment after the snooze cancels it. Nothing is written to GitHub.',
        };
      }
      /* GHD-SNOOZESPEC:END */

      /** Snooze. Honours what the Snoozed group's copy already promised:
          "Fibonacci backoff while nothing changes; a comment cancels the
          snooze". Re-snoozing an ACTIVE snooze means nothing changed, so the
          backoff advances one Fibonacci step. Re-snoozing after a comment
          cancelled it means something DID change, so the backoff resets to
          step 0 — otherwise an item that keeps getting comments would climb to
          21 days for being active, which is backwards. */
      function snoozeClick(item) {
        // Phase 7k: which mode this click is in is resolved HERE, from the live
        // record, not captured at render time (7f rule: handlers resolve
        // liveRecord at click time — a stale snoozeCount computing the wrong
        // backoff step was exactly that bug). The reconciler relabels this button
        // in the same pass that moves its card, so label and action stay in step.
        // 8e: PASS_NOW, the clock the button was LABELLED with, so the click does
        // what the button says even if a snooze has expired since.
        if (snoozeSpec(item, PASS_NOW).mode === 'unsnooze') return unsnoozeClick(item);
        const prev = snoozeState(item, new Date());
        const advance = prev.present && !prev.cancelledByComment;
        const step = advance
          ? Math.min((item.snoozeCount ?? 0) + 1, FIB_BACKOFF_DAYS.length - 1)
          : 0;
        const days = FIB_BACKOFF_DAYS[step];
        const at = new Date();
        const until = new Date(at.getTime() + days * 864e5);
        return mutateStore(
          item,
          (e) => {
            e.snoozedAt = at.toISOString();
            e.snoozedUntil = until.toISOString();
            e.snoozeCount = step;
            e.snoozeReason = advance
              ? `re-snoozed from the panel with nothing changed — backoff step ${step} (${days}d)`
              : `snoozed from the panel — backoff step 0 (${days}d)`;
          },
          'the snooze',
        );
      }

      /** Phase 7k: clear a snooze, for a card sitting in the Snoozed column.

          snoozeCount is CLEARED rather than preserved, and the button's title
          says so. The backoff exists to make re-snoozing cost something WHILE
          NOTHING CHANGES — that is why a comment already resets it to step 0
          (snoozeClick above). An explicit un-snooze is the strongest possible
          statement that the waiting assumption is over: the user is pulling the
          card back into view. Preserving the count would mean that pulling a card
          back and later parking it again jumps straight to 21 days, i.e. the
          longest silence for the item the user just said they cared about — the
          same inversion the comment-cancels-the-snooze rule was written to avoid.

          The fields are REMOVED rather than kept with a cleared flag, matching
          the done-undo path (`delete e.doneAt`); mutateStore then drops the whole
          entry if nothing else is left in it, so the file states only what is
          still true. This is not in tension with `gh monitor rm` deliberately not
          pruning this file: that protects marks the user still counts on when a
          repo is removed and re-added, whereas this IS the user asking for this
          one mark to go. A tombstone would also re-appear as a stale key in the
          store's own STALE_KEYS accounting. */
      function unsnoozeClick(item) {
        return mutateStore(
          item,
          (e) => {
            delete e.snoozedAt;
            delete e.snoozedUntil;
            delete e.snoozeCount;
            delete e.snoozeReason;
          },
          'the un-snooze',
        );
      }

      /** Done. Deliberately LOCAL: nothing is written to GitHub, the issue
          stays open, no comment is posted, no PR is touched. A standing
          standing Renovate dashboard — closing it would be wrong, and a
          single click is not consent for an irreversible remote write.
          Reversible: the card stays visible in Done and a second click on the
          same button removes the mark. */
      function doneClick(item) {
        const marking = !item.doneAt;
        return mutateStore(
          item,
          (e) => {
            if (marking) e.doneAt = new Date().toISOString();
            else delete e.doneAt;
          },
          marking ? 'the done mark' : 'the removal of the done mark',
        );
      }

      /** bb project for a repo, from the SNAPSHOT (meta.threadLinkage.projects,
          written by the fetcher) rather than a second copy of the mapping
          here. Returns null when the snapshot does not say. */
      function bbProject(repo) {
        const projects = (META && META.threadLinkage && META.threadLinkage.projects) || {};
        return projects[repo] || null;
      }

      /** Where the `Go` action leads. Two outcomes, and the caller renders a
          different element for each:
            url    — a real navigation target, rendered as an <a>;
