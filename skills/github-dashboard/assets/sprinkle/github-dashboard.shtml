            scoop  — no thread exists yet, so the work has not started: file a
                     request with the scoop that owns this panel (a <button>).

          Thread URLs: `<origin>/projects/<project>/threads/<thread>` is the
          form measured to render the thread (its page title was the thread's
          own title). When the snapshot does not name the project, fall back to
          the project-less `<origin>/threads/<thread>`, which bb also serves
          — measured: it loads, but its title was the generic "Thread thr_…",
          so it is the second choice, not the first. A reachable second choice
          still beats a dead button. */
      /* Phase 7n: the attachment map written by `gh pr attach`
         (/shared/github-monitor/attachments.json, shape
         {version, attachments:{"owner/repo#N":{thread, project, attachedAt}}}).

         This is an EXPLICIT human-made link, so it outranks the fetcher's
         heuristic thread linkage in the snapshot. It is a MAPPING, not a status,
         so it is safe to hold in memory — unlike thread state, which is never
         cached anywhere (see liveThreadStatus). Re-read whenever a new snapshot
         lands, which is when a new attachment plausibly appears; a failure to
         read leaves the map empty and the panel falls back to the snapshot. */
      const ATTACHMENTS_PATH = '/shared/github-monitor/attachments.json';
      let ATTACHMENTS = {};

      async function loadAttachments() {
        try {
          const parsed = JSON.parse(await slicc.readFile(ATTACHMENTS_PATH));
          ATTACHMENTS = parsed && typeof parsed.attachments === 'object' && parsed.attachments ? parsed.attachments : {};
        } catch (err) {
          ATTACHMENTS = {};
        }
      }

      /** The thread this record is attached to, if any: the explicit attachment
          first, then the snapshot's own linkage, then a thread record itself. */
      function threadFor(item) {
        const att = ATTACHMENTS[recordKey(item)];
        if (att && att.thread) {
          return { id: att.thread, project: att.project || null, source: 'attachment', attachedAt: att.attachedAt || null };
        }
        if (item.thread && item.thread.id) {
          return { id: item.thread.id, project: null, source: 'snapshot', state: item.thread.state, archived: !!item.thread.archived, title: item.thread.title };
        }
        if (item.kind === 'thread') return { id: item.id, project: null, source: 'self' };
        return null;
      }

      /** Phase 7n: where the Go control leads. THREE destinations, one per card,
          each with its own icon — that is the whole point of the trichotomy:

            'thread' — a bb thread is attached or linked. The conversation is
                       where the work is; go there.
            'start'  — no thread AND the item is still live work, so the work has
                       not started: ask the cone to start a scoop.
            'github' — no thread and the item is finished (released, closed, or
                       marked done locally). There is nothing to start and no
                       thread to read, so the only useful destination is the item
                       itself on GitHub.

          WHY 'github' EXISTS, measured: of 101 live records, 24 have a thread,
          17 are live work without one — and 60 are FINISHED without one. Under the
          old two-way split every one of those 60 rendered "Start a scoop", i.e.
          the panel's most prominent per-card action invited starting fresh agent
          work on something already merged or closed. (The two stray licks today
          were for a stage-6 PR, so this would not have prevented them; the point
          stands on its own.)

          The mode is derived from the RENDERED CATEGORY, not from the raw stage,
          so a locally-marked-done item also stops offering a dispatch — the user
          has said it is handled.

          Live thread STATUS is deliberately not part of this decision. Status
          changes within seconds (measured elsewhere: `show` said active seconds
          after `list` said idle for the same thread), and a destination that
          flickers is worse than one that is merely stable and correct. Status is
          reported in the quick view instead, fetched live at the moment it is
          shown. */
      function goTarget(item, now) {
        const thr = threadFor(item);
        if (thr) {
          const project = thr.project || bbProject(item.repo);
          const url = project
            ? `${bbOrigin()}/projects/${project}/threads/${thr.id}`
            : `${bbOrigin()}/threads/${thr.id}`;
          return {
            mode: 'thread',
            icon: 'messages-square',
            url,
            fallback: !project,
            label: 'Go to thread',
            title:
              `Open the bb thread ${thr.id}` +
              (thr.title ? ` ("${thr.title}")` : '') +
              (thr.archived ? ', archived' : '') +
              (thr.source === 'attachment'
                ? ` — attached explicitly with \`gh pr attach\`${thr.attachedAt ? ' on ' + fmtWhen(thr.attachedAt) : ''}`
                : ' — linked by the fetcher from the thread\'s own title and body') +
              `. Opens in a new tab: ${url}.` +
              (project ? '' : ` This snapshot does not say which bb project ${item.repo} maps to, so this is the project-less URL form.`) +
              ' The thread’s live status is shown in the quick view, not here, because it changes by the second. Reads nothing, writes nothing.',
          };
        }
        const cat = categorize(item, now).category;
        const finished = cat === 'done' || cat === 'aged-out';
        if (finished) {
          const url = item.url && String(item.url).startsWith('http') ? item.url : null;
          return {
            mode: 'github',
            icon: 'external-link',
            url,
            label: 'Open on GitHub',
            title:
              `${recordKey(item)} is finished (${cat === 'done' ? 'released, closed, or marked done locally' : 'aged out of the done pile'}) and has no bb thread, so there is nothing to start and no thread to read. ` +
              (url ? `This opens the item itself in a new tab: ${url}.` : 'This snapshot carries no URL for it, so there is nothing to open.') +
              ' Deliberately NOT a start-scoop button: a finished item must not invite fresh agent work.',
          };
        }
        return {
          mode: 'start',
          icon: 'rocket',
          label: 'Start a scoop',
          title:
            `No bb thread is attached or linked to ${recordKey(item)} and it is still live work, so the work has not started. This sends a ` +
            'start-scoop request to the CONE (the panel routes this lick explicitly, not to the scoop that ' +
            'owns the panel) and records it in data/user-state.json. ' +
            'It does NOT spawn the agent itself — starting an agent is an irreversible remote write, so a ' +
            'human-supervised cone decides. Click again to clear the mark (an already-sent request cannot be recalled).',
        };
      }

      /* Phase 7n: slicc.selectScoop(target) EXISTS in this runtime and was
         measured here — `typeof` is 'function', and three unresolvable targets
         ('scoop:no-such-scoop-7n', 'cone:no-such-folder-7n', 'utter-nonsense-7n')
         each resolved BOOLEAN false without throwing. It is deliberately NOT
         wired to anything: a per-card switch would need a scoop DISPLAY NAME to
         aim at, and no roster or liveness source exists (filed upstream), while `ps`
         truncates its SCOOP column to 10 characters (also filed) so its output
         cannot be joined to a name. Enumerating the scoop directory lists every folder that
         ever existed with no liveness, which is not a destination either. A
         button that resolves false is a button that does nothing, so there is no
         fourth branch until a roster exists. When one does: await the call and
         treat false as a VISIBLE failure, never a silent no-op. */

      /** Open a real navigation target. The iframe sandbox grants
          allow-popups, so this works from a click; if a blocker refuses
          anyway, say so instead of doing nothing. */
      function openExternal(url) {
        let w = null;
        try {
          w = window.open(url, '_blank', 'noopener');
        } catch (err) {
          w = null;
        }
        if (!w) {
          STORE_ERROR = {
            what: 'The browser refused to open a new tab',
            detail: url + ' — open it from the identifier link at the top of the card instead.',
          };
          render();
        }
      }

      /** File a scoop request. Two effects, both visible: the mark is
          persisted (so it survives a reopen) and a lick is sent to the owning
          scoop. A second click clears only the local mark. */
      async function scoopClick(item) {
        if (item.scoopRequestedAt) {
          await mutateStore(item, (e) => delete e.scoopRequestedAt, 'clearing the scoop request');
          return;
        }
        const at = new Date().toISOString();
        const saved = await mutateStore(item, (e) => (e.scoopRequestedAt = at), 'the scoop request');
        if (!saved) return; // the store failed; do not claim a request was filed
        if (typeof slicc === 'undefined' || typeof slicc.lick !== 'function') return;
        slicc.lick({
          action: 'start-scoop',
          // PLAIN JSON ONLY. The payload survives structured clone across the
          // iframe boundary but is finally rendered with JSON.stringify, so a
          // Date, Map, Set, function or undefined would degrade on the way to
          // the reader. Every field below is a string or null — `at` is already
          // an ISO string, not a Date.
          data: {
            key: recordKey(item),
            repo: item.repo,
            number: item.id,
            kind: item.kind,
            title: item.title,
            url: item.url,
            bbProject: bbProject(item.repo) || null,
            requestedAt: at,
            note: 'Requested from the github-dashboard panel. The panel did not spawn anything.',
          },
          // Route this to the CONE, not to the scoop that happens to own the
          // panel. The default (no target) is already the owning cone, so the
          // default was never the problem: `sprinkle open` AUTO-CLAIMS an
          // unrouted sprinkle for whoever opens it (claimSprinkleRoute), and this
          // panel was opened from the github-dashboard scoop's shell, so the
          // stored route is github-dashboard -> github-dashboard-scoop and wins
          // over the default. An explicit per-lick target beats the stored route,
          // which is why this is set here rather than by clearing the route — the
          // claimed route stays, so anything genuinely meant for the scoop still
          // reaches it.
          //
          // The literal is the cone's FOLDER, bare. matchLickTargetAlias tries
          // exact folder, then `<target>-scoop`, then exact name, with strict ===
          // and no prefix parsing, and the bootstrapped cone is
          // {name:'Cone', folder:'cone'} — so 'cone' matches on the first pass.
          // NOT 'sliccy' (that is assistantLabel, never compared), NOT 'cone:cone'
          // (a different resolver's vocabulary), NOT a jid. Hardcoded on purpose:
          // lick() is fire-and-forget postMessage with no id and no response, so
          // the panel cannot detect a misroute and must not guess from a display
          // name. An unresolvable target does not drop — it falls back and appends
          // a visible "Delivery note", which is a silent-ish failure to avoid.
          target: 'cone',
        });
      }

      /* ------------------------------------------------------------------
         5. RENDER
         ------------------------------------------------------------------ */

      // Local view state. Nothing here leaves the panel.
      const view = {
        project: 'all',
        open: new Set(OPEN_BY_DEFAULT),
      };

      /* GHD-FMT:START */
      function fmtHours(h) {
        if (h < 1) return `${Math.round(h * 60)}m`;
        if (h < 48) return `${Math.round(h)}h`;
        const d = Math.floor(h / 24);
        return `${d}d`;
      }

      function fmtWhen(iso) {
        return new Date(iso).toISOString().slice(0, 16).replace('T', ' ') + 'Z';
      }
      /* GHD-FMT:END */

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function icon(name, extra) {
        const i = el('i', 'sprinkle-icon' + (extra ? ' ' + extra : ''));
        i.dataset.lucide = name;
        return i;
      }

      /* Inverse document frequency over the labels the panel actually
         renders, i.e. each record's OWN labels. An absorbed issue's labels are
         deliberately NOT in this pool and are never shown as the lead PR's
         tags — attributing them to the PR is exactly what phase 4 avoided.
         They stay reachable in the .also line's tooltip.
         idf = ln(records / records carrying the label): a label on every card
         scores 0, a label on one card scores ln(N). */
      function labelIdf(records) {
        const df = new Map();
        for (const r of records) {
          for (const l of new Set(r.labels || [])) df.set(l, (df.get(l) || 0) + 1);
        }
        const idf = new Map();
        for (const [l, n] of df) idf.set(l, Math.log(records.length / n));
        return { idf, df, total: records.length };
      }

      let LABEL_IDF = new Map();

      /** Highest IDF first; alphabetical tie-break so the order is stable. */
      function labelsByIdf(labels) {
        return (labels || [])
          .slice()
          .sort((a, b) => (LABEL_IDF.get(b) ?? 0) - (LABEL_IDF.get(a) ?? 0) || a.localeCompare(b));
      }

      /** After layout: keep the tag row to ONE line by hiding the lowest-IDF
          tags and counting them in a +N chip whose tooltip names them. Runs on
          real measurements, so it cannot be fooled by font or width changes. */
      function fitTagRows() {
        for (const tags of document.querySelectorAll('.tags')) {
          const chips = [...tags.querySelectorAll('.tag')];
          const more = tags.querySelector('.tag-more');
          if (!chips.length || !more) continue;
          for (const c of chips) c.style.display = '';
          more.style.display = 'none';
          let hidden = 0;
          // scrollWidth > clientWidth means the row would spill; .tags is
          // overflow:hidden so nothing is ever half-drawn while we settle.
          while (tags.scrollWidth > tags.clientWidth + 1 && hidden < chips.length - 1) {
            const victim = chips[chips.length - 1 - hidden];
            victim.style.display = 'none';
            hidden++;
            const names = chips.slice(chips.length - hidden).map((c) => c.textContent);
            more.textContent = '+' + hidden;
            more.title = hidden + ' more: ' + names.join(', ');
            more.style.display = '';
          }
          tags.dataset.hidden = String(hidden);
        }
      }

      /* Phase 7c: markdown code spans in titles.

         Titles come from GitHub, so they are UNTRUSTED. This builds DOM nodes
         and never touches innerHTML: text goes in through textContent (which
         escapes by construction) and each span becomes a real <code> element.
         An unmatched backtick is content, not a delimiter — markdown treats it
         that way, and swallowing the rest of the title would hide information.
         Double-backtick spans (``a ` b``) are honoured, longest fence first,
         because that is how markdown lets a span contain a backtick.
         Returns an array of nodes so the caller can also keep the raw title in
         the tooltip. */
      function titleNodes(title) {
        const text = String(title == null ? '' : title);
        const nodes = [];
        let i = 0;
        let plain = '';
        const flush = () => {
          if (plain) {
            nodes.push(document.createTextNode(plain));
            plain = '';
          }
        };
        while (i < text.length) {
          if (text[i] !== '`') {
            plain += text[i++];
            continue;
          }
          // How long is this run of backticks? That run is the fence.
          let fence = 0;
          while (text[i + fence] === '`') fence++;
          const open = '`'.repeat(fence);
          const close = text.indexOf(open, i + fence);
          // No closing fence of the same length: the backticks are literal text.
          if (close === -1) {
            plain += open;
            i += fence;
            continue;
          }
          const inner = text.slice(i + fence, close);
          // An empty span (``) is not a code span in markdown either; keep the
          // characters so nothing silently disappears from a title.
          if (inner === '') {
            plain += open + open;
            i = close + fence;
            continue;
          }
          flush();
          const code = document.createElement('code');
          code.textContent = inner; // escapes <script>, &amp;, quotes, everything
          nodes.push(code);
          i = close + fence;
        }
        flush();
        return nodes;
      }

      function stateOf(item) {
        return STATE[item.substage || item.stage];
      }

      function shortRepo(repo) {
        return repo.split('/')[1] || repo;
      }

      /** THE CURRENT record for a key.

          Phase 7f, found by the reconciler tests: a card's event handlers used to
          close over the item object they were built with, so after an incremental
          update every click and hover acted on the PREVIOUS snapshot — a quick view
          showing data that had already changed, and worse, a snooze computing its
          backoff step from a stale snoozeCount. Handlers now resolve the live
          record by key at the moment of the click, and fall back to the captured
          item only if the record has left the window. */
      function liveRecord(key) {
        return RECORDS.find((r) => recordKey(r) === key) || null;
      }

      /** Item B: the three per-card actions, ICON-ONLY. WIRED (phase 7a):
          each carries an aria-label (its accessible name, since there is no
          visible text) and a title stating exactly what the click does —
          including which file it writes and that GitHub is never written to.
          Snooze and done latch; go navigates or files a request. */
      function actions(item) {
        const wrap = el('div', 'acts');

        const mk = (glyph, label, title) => {
          const b = el('button', 'sprinkle-btn sprinkle-btn--secondary icon-btn');
          b.type = 'button';
          b.setAttribute('aria-label', label);
          b.title = title;
          // Phase 7k: SEED the glyph name on the button. The reconciler compares
          // it to decide whether to swap the icon, and a signature card() does not
          // seed is a signature the first update rebuilds needlessly (7f rule 1).
          b.dataset.icon = glyph;
          b.appendChild(icon(glyph));
          return b;
        };

        // --- 1. snooze / un-snooze (phase 7k) ---------------------------
        const spec = snoozeSpec(item, PASS_NOW);
        const snoozeBtn = mk(spec.icon, spec.label, spec.title);
        snoozeBtn.dataset.mode = spec.mode;
        snoozeBtn.setAttribute('aria-pressed', spec.pressed);
        snoozeBtn.addEventListener('click', () => snoozeClick(liveRecord(recordKey(item)) || item));
        wrap.appendChild(snoozeBtn);

        // --- 2. done (local, reversible) --------------------------------
        const doneBtn = mk(
          'check',
          item.doneAt ? 'Undo done' : 'Done',
          item.doneAt
            ? `Marked done locally at ${fmtWhen(item.doneAt)}. Click to UNDO: removes doneAt from data/user-state.json and the card returns to the group its GitHub state puts it in. Nothing was ever written to GitHub.`
            : 'Mark this handled: writes doneAt to data/user-state.json and moves the card to Done. Nothing is written to GitHub — no close, no comment, no PR touched. Click again to undo.',
        );
        doneBtn.setAttribute('aria-pressed', item.doneAt ? 'true' : 'false');
        doneBtn.addEventListener('click', () => doneClick(liveRecord(recordKey(item)) || item));
        wrap.appendChild(doneBtn);

        // --- 3. go: thread / start a scoop / GitHub (phase 7n) ----------
        const tgt = goTarget(item, PASS_NOW);
        if (tgt.mode === 'start') {
          // Phase 7c, requested: dispatch is confirmed by the BUTTON'S COLOUR, not by
          // copy. The label stays "Start a scoop" in every state — a label that
          // changes to "Scoop requested" is a second status line competing with
          // the card's own, and it moved the tag row.
          //
          // Phase 7n: the GLYPH now carries DESTINATION, so it must not also
          // carry dispatch state — one symbol with two meanings is unreadable.
          // Colour keeps the state, aria-pressed keeps it for assistive tech, and
          // the quick view lists the dispatch time under "Your marks", so nothing
          // depends on colour alone.
          const b = mk(tgt.icon, tgt.label, tgt.title);
          const dispatched = !!item.scoopRequestedAt;
          if (dispatched) {
            b.title =
              `Dispatched ${fmtWhen(item.scoopRequestedAt)}: a start-scoop request for ${recordKey(item)} ` +
              'went to the cone and is recorded in data/user-state.json. The panel did not spawn ' +
              'anything itself. Click again to clear the mark (the sent request cannot be recalled).';
          }
          b.classList.toggle('is-dispatched', dispatched);
          b.setAttribute('aria-pressed', dispatched ? 'true' : 'false');
          b.dataset.go = tgt.mode;
          b.addEventListener('click', () => scoopClick(liveRecord(recordKey(item)) || item));
          wrap.appendChild(b);
        } else if (tgt.url) {
          const a = el('a', 'sprinkle-btn sprinkle-btn--secondary icon-btn');
          a.href = tgt.url;
          a.target = '_blank';
          a.rel = 'noreferrer';
          a.setAttribute('aria-label', tgt.label);
          a.title = tgt.title;
          a.dataset.go = tgt.mode;
          a.dataset.icon = tgt.icon;
          a.appendChild(icon(tgt.icon));
          wrap.appendChild(a);
        }
        // A finished item with no URL gets no third control: there is genuinely
        // nowhere to go, and an inert button would be a lie.
        return wrap;
      }

      /** The ".also" line: the artefacts this card also covers. Extracted from
          card() in phase 7f so an incremental update can rebuild just this line
          when a merge changes what a card absorbs. */
      function alsoLine(item) {
        const also = el('div', 'also');
        const ROLE = { closes: 'closes', alsoCloses: 'also closes', thread: 'thread' };
        for (const sec of item.secondary || []) {
          const wrap = el('span', 'also-item');
          wrap.appendChild(el('span', 'also-role', ROLE[sec.role] || sec.role));
          const isLink = typeof sec.url === 'string' && sec.url.startsWith('http');
          const ref = el(isLink ? 'a' : 'span', 'also-ref', sec.label);
          if (isLink) {
            ref.href = sec.url;
            ref.target = '_blank';
            ref.rel = 'noreferrer';
          }
          const bits = [];
          if (sec.title) bits.push(sec.title);
          if (sec.state) bits.push('state: ' + sec.state);
          // The absorbed issue's OWN labels live here, not in the card's tag
          // row, so they are never shown as the lead PR's labels.
          const secArt = (item.artifacts || []).find(
            (a) => a.kind === sec.kind && String(a.number) === String(sec.label).split('#')[1],
          );
          if (secArt && secArt.labels && secArt.labels.length) {
            bits.push('its labels: ' + secArt.labels.join(', '));
          }
          if (sec.outOfWindow) bits.push('outside the current snapshot window, carried as context only');
          if (bits.length) ref.title = bits.join(' — ');
          wrap.appendChild(ref);
          also.appendChild(wrap);
        }
        return also;
      }

      /** The note lines under the status, as data. Shared by card() and
          updateCard() so the signature they compare is the same string —
          otherwise the first incremental update rebuilds every card's notes. */
      function noteSpecs(item) {
        const notes = [];
        const sn = snoozeState(item, PASS_NOW);
        if (sn.active) {
          notes.push({
            text: `Snoozed until ${fmtWhen(item.snoozedUntil)} · ${sn.days}d step`,
            title: `Snoozed until ${fmtWhen(item.snoozedUntil)} (Fibonacci step ${sn.step} = ${sn.days}d; next round ${sn.nextDays}d)`,
          });
        } else if (item.blockedOn) {
          notes.push({ text: `Blocked on ${item.blockedOn}`, title: `Blocked on ${item.blockedOn}` });
        }
        if (item.doneAt) {
          notes.push({
            text: `Done locally ${fmtWhen(item.doneAt)}`,
            title:
              `Marked done in this panel at ${fmtWhen(item.doneAt)} — stored in data/user-state.json. ` +
              'Nothing was written to GitHub: the issue or PR is exactly as it was. The check button undoes it.',
          });
        }
        return notes;
      }

      function card(item) {
        const st = stateOf(item);
        const tone = TONE[st.tone];
        const c = el('article', 'card sprinkle-card');
        c.style.setProperty('--tone', tone);
        c.dataset.key = recordKey(item);
        // Phase 7c: clicking the card opens the quick view — EXCEPT on the three
        // actions, the Go anchor and the identifier links, which keep their own
        // behaviour untouched. closest() is the test rather than a stopPropagation
        // sprinkled over each handler, so nothing about phase 7a had to change.
        c.addEventListener('click', (e) => {
          if (e.target.closest('button, a')) return;
          cancelQuickViewHover();
          cancelQuickViewClose();
          // A click is a commitment: modal, focused, and it does not auto-close.
          // If a hover view is already open on this card, it is promoted rather
          // than reopened, so the click does not make it flicker.
          if (QV_DIALOG && QV_DIALOG.open && QV_DIALOG.dataset.key === recordKey(item)) {
            commitQuickView();
            return;
          }
          openQuickView(liveRecord(recordKey(item)) || item, c, 'committed');
        });
        // Leaving the card anywhere (not just the description) arms the close, and
        // entering it cancels one — so the whole card behaves as one hover surface.
        c.addEventListener('mouseenter', cancelQuickViewClose);
        c.addEventListener('mouseleave', () => scheduleQuickViewClose('pointer left the card'));
        const inner = el('div', 'card-inner');

        // Row 1 — item C: the bar is the card's top border.
        // Pass-3 item 3: the internal stage/substage id lives in this
        // tooltip and nowhere else. No number is ever rendered as text; this
        // is the recovery path when an item looks miscategorised.
        const bar = el('div', 'bar-top sprinkle-progress-bar');
        bar.style.setProperty('--progress', st.progress + '%');
        bar.style.setProperty('--fill-color', tone);
        bar.setAttribute('role', 'presentation');
        bar.title = `stage ${item.substage || item.stage} · ${st.label} · ${st.progress}%`;
        inner.appendChild(bar);

        // Row 2 — item D: coloured state glyph, then org/repo#id, then tags
        // pushed to the right-hand end (item F). The accessible name and the
        // tooltip live on the wrapping span, not the <svg> (see .state-icon).
        const top = el('div', 'row-top');
        const stateWrap = el('span', 'state-icon');
        stateWrap.title = st.label;
        stateWrap.setAttribute('role', 'img');
        stateWrap.setAttribute('aria-label', st.label);
        // 7f: record which glyph is mounted, so an update only swaps the icon
        // when the stage actually changed.
        stateWrap.dataset.icon = st.icon;
        const glyph = icon(st.icon, 'sprinkle-icon--l');
        glyph.setAttribute('aria-hidden', 'true');
        stateWrap.appendChild(glyph);
        top.appendChild(stateWrap);

        const ref = el('a', 'ref');
        if (item.url.startsWith('http')) {
          ref.href = item.url;
          ref.target = '_blank';
          ref.rel = 'noreferrer';
        }
        ref.title = item.url;
        ref.appendChild(el('span', 'org', item.repo.split('/')[0] + '/'));
        ref.appendChild(
          el(
            'span',
            'num',
            item.kind === 'thread'
              ? `${shortRepo(item.repo)} · ${item.id}`
              : `${shortRepo(item.repo)}#${item.id}`,
          ),
        );
        top.appendChild(ref);
        if (item.labels && item.labels.length) {
          const tags = el('div', 'tags');
          const ordered = labelsByIdf(item.labels);
          for (const l of ordered) {
            const t = el('span', 'tag', l);
            const v = LABEL_IDF.get(l);
            t.title = v === undefined ? l : `${l} — idf ${v.toFixed(2)}`;
            tags.appendChild(t);
          }
          // Always present, shown only when the fit pass hides something.
          const more = el('span', 'tag-more', '');
          more.style.display = 'none';
          tags.appendChild(more);
          // Phase 7f: seed the signature the reconciler compares against, so an
          // unchanged tag row is left completely alone on an update.
          tags.dataset.sig = JSON.stringify(ordered);
          top.appendChild(tags);
        }
        inner.appendChild(top);

        // Row 3 — title (clamped to two lines; full text in the tooltip)
        // Row 3 — title. Code spans become <code> nodes (phase 7c); the tooltip
        // keeps the raw markdown so nothing is lost.
        const h = el('h3', 'title');
        for (const n of titleNodes(item.title)) h.appendChild(n);
        h.title = item.title;
        h.dataset.sig = item.title; // 7f: same reason as the tag row
        inner.appendChild(h);

        // Row 4 — the slack-absorbing block: clamped status + optional note
        const body = el('div', 'card-body');
        const status = el('p', 'status', item.status);        // The card shows the short line; hover carries the longer summary and
        // the suggested follow-ups. Both are generated in the fetcher and
        // cached in the snapshot — the panel never calls a model. No new
        // controls: the actions are text in the tooltip, not buttons.
        const hover = [item.statusLong || item.status];
        if (Array.isArray(item.actions) && item.actions.length) {
          // Phase 7b turned actions from bare strings into structured objects
          // ({kind,label,target,grounds,...}). This line keeps doing exactly what
          // it did before — listing the labels in the tooltip — for BOTH shapes;
          // without it a 7b snapshot renders "Next: [object Object]". Rendering
          // the structured actions as controls is phase 7c's job, not this line's.
          const labels = item.actions
            .map((a) => (typeof a === 'string' ? a : a && typeof a.label === 'string' ? a.label : ''))
            .filter(Boolean);
          if (labels.length) hover.push('Next: ' + labels.join(' · '));
        }
        if (item.statusSource && item.statusSource !== 'agent') {
          hover.push('(status composed mechanically, not model-written)');
        }
        status.title = hover.join('\n\n');
        // Phase 7c: the description is the quick view's handle. Hover (delayed)
        // for the mouse, Enter/Space for the keyboard, and it is focusable so a
        // keyboard user can reach it at all. role=button with an explicit name,
        // because the paragraph's own text is the status, not the action.
        status.dataset.qv = '1';
        status.tabIndex = 0;
        status.setAttribute('role', 'button');
        status.setAttribute('aria-haspopup', 'dialog');
        status.setAttribute('aria-label', `Quick view: ${item.title}`);
        status.addEventListener('mouseenter', () => {
          cancelQuickViewHover();
          // The pointer is back on a card: whatever close was pending, cancel it.
          // This is also what makes crossing back from the quick view harmless.
          cancelQuickViewClose();
          QV_HOVER_TIMER = setTimeout(
            () => openQuickView(liveRecord(recordKey(item)) || item, status, 'hover'),
            QUICK_VIEW_HOVER_MS,
          );
        });
        status.addEventListener('mouseleave', () => {
          cancelQuickViewHover();
          // Requested: "hovering away from the quick view should close it again". The
          // grace timer covers the trip from card to panel; the panel's own
          // mouseenter cancels it if the pointer arrives.
          scheduleQuickViewClose('pointer left the card');
        });
        status.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            cancelQuickViewHover();
            cancelQuickViewClose();
            // Keyboard is a deliberate act: modal, focused, and it stays.
            openQuickView(liveRecord(recordKey(item)) || item, status, 'committed');
          }
        });
        body.appendChild(status);
        // Phase 7f: notes come from the shared spec so card() and updateCard()
        // agree on both the content and the signature.
        const specs = noteSpecs(item);
        body.dataset.noteSig = JSON.stringify(specs);
        for (const spec of specs) {
          const n = el('p', 'note', spec.text);
          n.title = spec.title;
          body.appendChild(n);
        }
        // Phase 7a's "done locally" line and phase 7c's deliberate silence about
        // a dispatched scoop request both live in noteSpecs() now (7f), so card()
        // and the reconciler cannot drift apart.
        // Phase 4: the artefacts this card also covers. The lead identifier is
        // the .ref above; these are secondary and each is reachable.
        if (Array.isArray(item.secondary) && item.secondary.length) {
          const also = alsoLine(item);
          also.dataset.sig = JSON.stringify(item.secondary);
          body.appendChild(also);
        }
        inner.appendChild(body);

        // Row 5 — items B + G: buttons left, relative time right, pinned to
        // the card's bottom edge.
        const foot = el('div', 'foot');
        foot.appendChild(actions(item));
        const when = el('time', 'when', whenLabel(item.lastActivityAt, PASS_NOW));
        when.dateTime = item.lastActivityAt;
        when.title = `Last activity ${fmtWhen(item.lastActivityAt)}`;
        foot.appendChild(when);
        inner.appendChild(foot);

        c.appendChild(inner);
        return c;
      }

      /* ------------------------------------------------------------------
         5b. QUICK VIEW (phase 7c)

         Everything shown here is already in the snapshot — bodyExcerpt, recent
         comments, ci, labels, stageWhy, statusLong, the structured 7b actions —
         so opening is instant and offline: no fetch, no model, no GitHub call.

         One <dialog>, reused. showModal() brings the platform's focus trap,
         inert background and Escape handling, which is why this is not a
         hand-rolled overlay. Content is built with createElement/textContent
         only; nothing from GitHub ever reaches innerHTML.

         HOVER DELAY: 500 ms. Chosen to match the browser's own `title` tooltip
         delay — the quick view then arrives no sooner than the tooltip the user
         already expects from hovering, so scanning a wall of cards at speed
         opens nothing. Anything near 200 ms fired while the pointer was merely
         crossing a card on its way somewhere else.
         ------------------------------------------------------------------ */

      /* GHD-QV-STATE:START (phase 8f): quick-view state, its close handling and
         the page lock. tests/quickview-close.test.js cuts this region and the
         GHD-QV-OPEN one out of the BUILT panel and drives them against a fake
         <dialog> whose close event is queued, as Chromium queues it. */
      const QUICK_VIEW_HOVER_MS = 500;
      /* Phase 7i: how long the pointer may be over NEITHER the card nor the quick
         view before it closes. 350 ms, chosen against two pressures:

         • it must survive the transit between the two surfaces. In practice the
           centred dialog overlaps or sits beside the hovered card (measured: with
           a card scrolled to the middle of the viewport, the dialog covers the
           card's own centre point), so the gap is usually a few pixels, not a
           screen's width;
         • it must be clearly SHORTER than the 500 ms open delay, or dismissing
           would feel stickier than summoning — which is the tedium being fixed.

         A pointer that crawls across a wide gap will lose the view and can
         re-summon it; that is the deliberate trade, because the alternative (a
         second-long grace) recreates the complaint. */
      const QUICK_VIEW_CLOSE_MS = 350;
      let QV_DIALOG = null;
      let QV_RETURN_FOCUS = null;
      // Phase 8f: what opened the view (the hovered description, or the card or
      // description that was clicked). A PROMOTED view takes its focus-return
      // target from here, since the hover that opened it recorded none.
      let QV_OPENER = null;
      let QV_HOVER_TIMER = null;
      /* 'hover' — opened because the pointer rested on a description: NON-MODAL
            (so the page outside stays live and pointer-out is observable), takes
            no focus, and closes itself when the pointer leaves both surfaces.
         'committed' — opened by a click on the card or by Enter/Space on the
            description: MODAL (platform focus trap, inert background), takes
            focus, and never auto-closes. The user asked for it; it stays.
         The mode IS the distinction between the two behaviours; every transient
         path checks it, so a committed view can never be dismissed by a pointer. */
      let QV_MODE = null;
      let QV_CLOSE_TIMER = null;
      let QV_CLOSE_REASON = null;
      /* MEASURED, not assumed: HTMLDialogElement.show() runs the dialog focusing
         steps too, so a non-modal dialog ALSO takes the keyboard — it just does not
         make the rest of the page inert. The first version of this fix therefore
         stole focus on hover AND tripped the click-to-commit promotion via the
         resulting focusin. So the hover path hands focus straight back and
         suppresses promotion for that one task. */
      let QV_SUPPRESS_PROMOTE = false;
      /* Phase 7o: the page lock, for the MODAL case only.

         Chrome does NOT stop the document scrolling behind a modal <dialog> —
         measured: with the quick view open and `showModal()` in force, driving
         document.scrollingElement.scrollTop still moved the page, and both <html>
         and <body> computed overflow-y: visible. So the lock is ours to apply.

         HOVER IS DELIBERATELY NOT LOCKED. A hover view closes 350 ms after the
         pointer leaves, so a lock it owned could outlive anything the user can
         see themselves causing — freezing the page "for no reason" is worse than
         a page that scrolls. Scrolling a hover view is coherent anyway: the
         pointer has to be over it to scroll it, and being over it is exactly what
         keeps it open, so the wheel lands on the view and `overscroll-behavior:
         contain` stops it leaking to the page. */
      let QV_SCROLL_LOCK = null;

      function lockPageScroll() {
        if (QV_SCROLL_LOCK) return;
        const sc = document.scrollingElement || document.documentElement;
        QV_SCROLL_LOCK = { top: sc.scrollTop, inlineOverflow: document.documentElement.style.overflow };
        document.documentElement.style.overflow = 'hidden';
      }

      function unlockPageScroll() {
        if (!QV_SCROLL_LOCK) return;
        const sc = document.scrollingElement || document.documentElement;
        document.documentElement.style.overflow = QV_SCROLL_LOCK.inlineOverflow;
        // Restore the position EXPLICITLY. Applying overflow:hidden to the
        // scrolling element is not specified to preserve scrollTop, and a panel
        // that silently jumps the reader back to the top of 98 cards would be a
        // worse bug than the one this phase fixes.
        sc.scrollTop = QV_SCROLL_LOCK.top;
        QV_SCROLL_LOCK = null;
      }

      /* Phase 8f: the three close decisions, as pure functions of the state they
         depend on, so each path is decided in one place.

         qvCloseAction: what the dialog's `close` EVENT may do. Chromium fires it
         at the next rendered frame, not synchronously, so a view closed and
         reopened before a frame is drawn receives the FIRST close's event while
         it is open again. That event is STALE: it belongs to the session that
         ended. Acting on it (as 8e did) released a live modal's page lock and
         set QV_MODE to null under it. A stale event therefore leaves mode, focus
         and the grace timer alone. The one thing it may still do is drop a lock
         that no open view owns: the lock is held exactly while a MODAL view is
         open, so if the reopened view is non-modal (hover, or promoted) the
         lock left by the ended modal session must go. The reopened view gets
         its own close event when it really closes, and that one does all of it.

         qvEscapeAction: a MODAL view is closed by the platform (Escape fires
         `cancel`, then `close`), so the panel keeps out of its way. A NON-modal
         view, hover or promoted, gets no platform Escape (closedBy "none"), so
         the panel closes it. Focus goes back to the opener only if the keyboard
         was in the view (or nowhere): a promoted view is non-modal, so the user
         may be typing in the page behind it, and Escape must not yank focus.

         qvOutsideAction: an outside press closes only a HOVER view. A PROMOTED
         view stays open, deliberately. It is non-modal, so the page behind it
         is live, and a press there is far more likely to be the reader using
         the page (scrolling, a filter, selecting text to copy) with the view
         kept beside it than a request to dismiss it; the user promoted it by
         clicking INTO it precisely so it would stop evaporating. It still
         closes by its close button and, since 8f, by Escape. A MODAL view's
         outside click is its backdrop, handled on the dialog itself: there
         the page is inert, so the press cannot mean anything else. */
      function qvCloseAction(s) {
        if (s.open) return { stale: true, unlock: !s.modal, resetMode: false, restoreFocus: false };
        return { stale: false, unlock: true, resetMode: true, restoreFocus: true };
      }

      function qvEscapeAction(s) {
        if (!s.open || s.modal) return { close: false };
        if (s.mode === 'hover') return { close: true, reason: 'escape-hover', returnFocus: false };
        if (s.mode === 'committed') {
          return { close: true, reason: 'escape-promoted', returnFocus: !!(s.focusInView || s.focusOnBody) };
        }
        return { close: false };
      }

      function qvOutsideAction(s) {
        return { close: !!(s.open && !s.modal && s.mode === 'hover' && !s.targetInView) };
      }

      /** Where focus returns for a view opened from `trigger`: the trigger if it
          can take focus, else its card's description (a card is an <article>
          and cannot). */
      function qvFocusTarget(trigger) {
        if (!trigger) return null;
        if (typeof trigger.matches === 'function' && trigger.matches('[tabindex], a, button, summary')) return trigger;
        return (trigger.querySelector && trigger.querySelector('.status[data-qv]')) || null;
      }

      function quickViewDialog() {
        if (QV_DIALOG) return QV_DIALOG;
        const d = document.createElement('dialog');
        d.className = 'qv';
        d.setAttribute('aria-label', 'Quick view');
        // A click on the backdrop lands on the <dialog> itself; a click on the
        // content lands on .qv-inner or deeper, so this closes only on outside.
        // A click on the CONTENT of a hover-opened view PROMOTES it to committed:
        // once someone has clicked into it they are reading it, and it must stop
        // evaporating when the pointer wanders off.
        d.addEventListener('click', (e) => {
          if (e.target === d) {
            d.close('outside');
            return;
          }
          if (QV_MODE === 'hover') commitQuickView();
        });
        // Same when focus arrives inside it (a keyboard user tabbing in) — except
        // when the focus came from show() itself, see QV_SUPPRESS_PROMOTE.
        d.addEventListener('focusin', () => {
          if (QV_SUPPRESS_PROMOTE) return;
          if (QV_MODE === 'hover') commitQuickView();
        });
        // A hover-opened view is NON-MODAL, so the pointer can actually leave it
        // — which is the whole point — and these two handlers are what keep it
        // alive while the pointer is ON it.
        d.addEventListener('mouseenter', cancelQuickViewClose);
        d.addEventListener('mouseleave', () => scheduleQuickViewClose('pointer left the quick view'));
        // Covers Escape (the platform fires cancel) and every other close path.
        // The focus restore is deferred by a task on purpose: inside the `close`
        // handler the document can still be inert from showModal(), and a
        // focus() call there is silently refused — measured, not assumed.
        d.addEventListener('close', () => {
          // Phase 8f: decided by qvCloseAction, above. A stale event (the dialog
          // is OPEN again) touches nothing that belongs to the reopened view.
          const a = qvCloseAction({ open: d.open, modal: d.matches(':modal') });
          // Phase 7o: a no-op unless a modal view took the lock. Every real close
          // (button, Escape, backdrop, the hover grace timer, a probe) arrives
          // here with the dialog closed and releases it.
          if (a.unlock) unlockPageScroll();
          if (a.stale) return;
          cancelQuickViewClose();
          QV_MODE = null;
          const back = QV_RETURN_FOCUS;
          const key = d.dataset.key;
          QV_RETURN_FOCUS = null;
          QV_OPENER = null;
          setTimeout(() => {
            // A full render() (a filter click behind a non-modal view) replaces
            // the cards, so fall back to the same card's description by key.
            const target =
              back && document.contains(back)
                ? back
                : back && key
                  ? document.querySelector(`.card[data-key="${key}"] .status[data-qv]`)
                  : null;
            if (target) target.focus();
          }, 0);
        });
        document.body.appendChild(d);
        QV_DIALOG = d;

        /* A NON-modal <dialog> gets none of the platform's dismissal behaviour,
           so Escape has to be handled here. These two document listeners are
           added once, with the dialog. Escape closes every NON-modal view, hover
           or promoted (8f: a promoted view used to ignore it); an outside press
           closes only a hover view. The modal case gets Escape from the
           platform's `cancel` event and outside clicks from its backdrop. See
           qvEscapeAction / qvOutsideAction for why. */
        document.addEventListener('keydown', (e) => {
          if (e.key !== 'Escape' || !QV_DIALOG) return;
          const a = document.activeElement;
          const esc = qvEscapeAction({
            open: QV_DIALOG.open,
            modal: QV_DIALOG.matches(':modal'),
            mode: QV_MODE,
            focusInView: !!a && QV_DIALOG.contains(a),
            focusOnBody: !a || a === document.body,
          });
          if (!esc.close) return;
          e.preventDefault();
          if (esc.returnFocus) {
            if (!QV_RETURN_FOCUS) QV_RETURN_FOCUS = qvFocusTarget(QV_OPENER);
          } else {
            QV_RETURN_FOCUS = null;
          }
          QV_DIALOG.close(esc.reason);
        });
        document.addEventListener('mousedown', (e) => {
          if (!QV_DIALOG) return;
          const out = qvOutsideAction({
            open: QV_DIALOG.open,
            modal: QV_DIALOG.matches(':modal'),
            mode: QV_MODE,
            targetInView: QV_DIALOG.contains(e.target),
          });
          if (out.close) QV_DIALOG.close('outside-nonmodal');
        });
        return d;
      }
      /* GHD-QV-STATE:END */

      function qvSection(heading, buildBody) {
        const s = el('div', 'qv-sect');
        s.appendChild(el('h4', null, heading));
        buildBody(s);
        return s;
      }

      /** Phase 7l: markdown for a quick-view field, via the bundled renderer.

          LAZY BY CONSTRUCTION: buildQuickView only runs when a quick view
          opens, so a 5-second reconcile never renders markdown for 98 cards.
          The renderer caches per id + content hash, so re-opening the same card
          (or a refreshQuickView during a reconcile) re-parses nothing.

          Degrades to plain text if the bundle is missing or throws. A renderer
          that fails must cost formatting, never the panel: the .shtml has to
          keep working if someone strips the generated <script> region. */
      function mdField(cls, id, text) {
        const host = el('div', cls + ' md-host');
        const R = typeof window !== 'undefined' ? window.GHMarkdown : null;
        if (R && typeof R.into === 'function') {
          try {
            R.into(host, id, text);
            return host;
          } catch (err) {
            host.textContent = '';
          }
        }
        host.appendChild(el('p', null, String(text)));
        return host;
      }

      /** Phase 7p: a stable key for one action inside a record.

          kind+label, not the array index: the fetcher regenerates actions on every
          run and an index would silently re-point a dispatch mark at a different
          instruction. Label text IS the instruction, so if it changes the action
          has changed and deserves a fresh mark. */
      function actionKey(a) {
        return `${a.kind || 'action'}:${a.label || ''}`;
      }

      /** PHASE 8C. ONE table, because the 7p bug was structural, not a missing
          branch. That code asked `kind === 'clarify' ? … : …` in four separate
          places, so every kind that was not `clarify` became a NUDGE: the `send`
          glyph, the "Dispatch this instruction" label, and a `do-nudge` lick.
          When the fetcher's agents started emitting `approve` actions ("Approve
          and merge"), the panel silently offered to dispatch a GitHub WRITE as an
          instruction. The fall-through DIRECTION was the whole defect — an
          unrecognised kind landed on the most action-shaped branch there is.

          These kinds are MODEL-GENERATED, so the next unknown one is a matter of
          time. Hence: a kind must be REGISTERED to get a control, and anything
          unregistered degrades to an inert, honest chip (see UNKNOWN_KIND). The
          fall-through now points at "do nothing and say so" instead of "act".

          Each entry owns every per-kind difference — glyph, button copy, aria
          text, the lick name, and the note the cone receives — so adding a kind
          is one object and no other edit. */
      const ACTION_KINDS = {
        nudge: {
          act: 'nudge',
          icon: 'send',
          cta: 'Dispatch this instruction',
          aria: 'Dispatch this instruction to the cone',
          lick: 'do-nudge',
          note: 'A specific instruction from the github-dashboard panel. The panel did not spawn anything.',
        },
        clarify: {
          act: 'clarify',
          icon: 'message-circle-question',
          cta: 'Raise with the cone',
          aria: 'Raise this question with the cone',
          lick: 'clarify-question',
          note: 'A clarification from the github-dashboard panel: this needs a human decision, not agent work.',
        },
        /* approve — "Approve and merge", "Merge when ready". Both live examples
           name a GITHUB WRITE, and this panel performs no writes. Delegating the
           write to an agent would be worse, not better: it moves an irreversible
           act further from the person answerable for it.

           A navigation-only button was rejected because 7p measured that every
           action's target.ref equals its own record, so it would duplicate the Go
           control, which already opens the item.

           What IS worth dispatching is the work that stops SHORT of the write:
           read the item now and report whether approving looks safe. That has
           value precisely BECAUSE the grounds the fetcher attached ("All 2 CI
           checks passing") are a snapshot, and a snapshot's CI summary is the
           thing this project has already watched rot — a panel once asserted
           "2 of 45 checks running" on a PR that had already merged. Someone about
           to click Merge wants a fresh read, not a cached one.

           The lick is named for what it ASKS, not for the verb in the label:
           review-before-approval, never do-approve. A lick name that reads as an
           imperative to approve is how a mislabelled instruction turns into an
           unwanted GitHub write at the other end. The note repeats the
           prohibition in words, because the cone reads the note. */
        approve: {
          act: 'approve',
          icon: 'scan-eye',
          cta: 'Ask for a safety check',
          aria: 'Ask the cone to check whether this is safe to approve',
          lick: 'review-before-approval',
          note:
            'A PRE-APPROVAL REVIEW requested from the github-dashboard panel. Read the item and report whether approving looks safe. Do NOT approve, merge, or submit a review on GitHub — the approval is the operator\u2019s to give, and the panel performs no writes. The grounds quoted with this request came from a snapshot and may be stale; check the current state.',
        },
      };

      /* The inert fallback. Deliberately NOT a disabled button: a disabled
         control still says "there is an action here, you just cannot have it",
         whereas the honest statement is "this panel does not know this kind".
         Precedent: selectScoop was left unwired for the same reason — an honest
         informational state beat a control that resolved false. */
      const UNKNOWN_KIND = { icon: 'circle-dashed' };

      /** The registered spec for an action, or null when the kind is unknown.
          hasOwnProperty, so a kind called "constructor" or "toString" cannot
          inherit a spec off Object.prototype and become dispatchable. */
      function actionSpec(a) {
        const k = a && typeof a.kind === 'string' ? a.kind : null;
        return k && Object.prototype.hasOwnProperty.call(ACTION_KINDS, k) ? ACTION_KINDS[k] : null;
      }

      /** Phase 7p, requested: "render the structured nudge/clarify actions as buttons"
          / "make the quick-view action boxes clickable".

          The boxes were inert display. They now carry ONE button each, and the two
          kinds do DIFFERENT things because they are different work (measured over
          the live snapshot: 15 records carry 16 actions, 10 nudge and 6 clarify):

            nudge   — an instruction an agent could carry out ("Check CI and
                      request review", "Review and merge"). The button dispatches
                      THAT INSTRUCTION to the cone. This is why it earns space next
                      to the Go control: `start` says "do something about this
                      card", whereas this says "do this specific thing", and it
                      carries the evidence the fetcher already computed (`because`,
                      `grounds`) so the cone does not have to re-derive it.
            clarify — a question only the operator can answer ("Decide test-runner
                      strategy", "Confirm: treat Renovate dashboards as no"). An
                      agent cannot resolve it, so dispatching it as work would be a
                      lie. What the panel CAN do is put the question, with its
                      context, in front of the operator who can answer it — the cone
                      is his conversation surface. So this button raises the
                      question rather than assigning it.

          Navigation was considered and rejected: every action's target.ref equals
          its own record (measured: zero off-record targets), so "open the target"
          would be a second control to a place the card already reaches.

          Both are recorded in user-state under `actionsDispatched[actionKey]`, so
          the colour survives a reopen and a 7f reconcile, and a second click
          clears it. */
      async function actionClick(item, action, btn) {
        // Defence in depth: an unregistered kind gets no control at all, so
        // arriving here means something else went wrong. Refuse anyway: no
        // lick, no store write.
        const spec = actionSpec(action);
        if (!spec) return;
        const key = actionKey(action);
        const already = (item.actionsDispatched || {})[key];
        if (already) {
          const ok = await mutateStore(
            item,
            (e) => {
              if (e.actionsDispatched) {
                delete e.actionsDispatched[key];
                // Drop the container when it empties, or mutateStore's
                // empty-entry pruning would keep a husk entry alive for ever.
                if (!Object.keys(e.actionsDispatched).length) delete e.actionsDispatched;
              }
            },
            'clearing the dispatch of “' + (action.label || key) + '”',
          );
          if (ok) paintActionButton(btn, action, null);
          return;
        }
        const at = new Date().toISOString();
        const saved = await mutateStore(
          item,
          (e) => {
            e.actionsDispatched = { ...(e.actionsDispatched || {}), [key]: at };
          },
          'the dispatch of “' + (action.label || key) + '”',
        );
        if (!saved) return; // the store failed: do not claim anything was sent
        paintActionButton(btn, action, at);
        if (typeof slicc === 'undefined' || typeof slicc.lick !== 'function') return;
        slicc.lick({
          // Two distinct actions, because the cone should do two different things:
          // carry out an instruction, or bring a question to the operator.
          action: spec.lick,
          data: {
            key: recordKey(item),
            repo: item.repo,
            number: item.id,
            kind: item.kind,
            title: item.title,
            url: item.url,
            actionKind: action.kind || null,
            instruction: action.label || null,
            because: action.because || null,
            grounds: action.grounds || null,
            targetRef: (action.target && action.target.ref) || null,
            targetUrl: (action.target && action.target.url) || null,
            bbProject: bbProject(item.repo) || null,
            requestedAt: at,
            note: spec.note,
          },
          // Same routing rule as start-scoop: the cone's bare FOLDER, hardcoded.
          target: 'cone',
        });
      }

      /** The dispatched state, in COLOUR and aria-pressed only — never new copy.
          The “Scoop requested” label was removed deliberately, and the glyph carries the
          kind, so it must not also carry the state. */
      function paintActionButton(btn, action, at) {
        const dispatched = !!at;
        btn.classList.toggle('is-dispatched', dispatched);
        btn.setAttribute('aria-pressed', dispatched ? 'true' : 'false');
        btn.title = actionButtonTitle(action, at);
      }

      function actionButtonTitle(action, at) {
        const what = action.label || 'this action';
        if (action.kind === 'approve') {
          return at
            ? `Asked ${fmtWhen(at)}: a pre-approval review of “${what}” went to the cone and is recorded in data/user-state.json. It asked for a judgement, not an approval — approving is still yours. Click again to clear the mark (the sent request cannot be recalled).`
            : `Ask the cone to review “${what}” and report whether approving looks safe. It does NOT approve, merge or submit a review, and neither does this panel — that stays with you. Worth asking because the grounds shown here came from a snapshot and may already be stale. Writes data/user-state.json; nothing is written to GitHub.`;
        }
        if (action.kind === 'clarify') {
          return at
            ? `Raised ${fmtWhen(at)}: “${what}” went to the cone as a question for you, with its context. Recorded in data/user-state.json. Click again to clear the mark (the sent message cannot be recalled).`
            : `Raise “${what}” with the cone as a QUESTION. A clarification needs a human decision, so this does not assign work — it puts the question and its evidence in front of you where you can answer it. Writes data/user-state.json; nothing is written to GitHub.`;
        }
        return at
          ? `Dispatched ${fmtWhen(at)}: the instruction “${what}” went to the cone and is recorded in data/user-state.json. The panel did not spawn anything itself. Click again to clear the mark (the sent request cannot be recalled).`
          : `Dispatch “${what}” to the cone as a specific instruction, with the evidence the fetcher derived for it. More precise than the card's Start-a-scoop, which only says “do something about this card”. It does NOT spawn an agent — a human-supervised cone decides. Writes data/user-state.json; nothing is written to GitHub.`;
      }

      function buildQuickView(item) {
        const st = stateOf(item);
        const inner = el('div', 'qv-inner');

        const head = el('div', 'qv-head');
        const heading = el('div', 'qv-heading');
        const h = el('h3', 'qv-title');
        for (const n of titleNodes(item.title)) h.appendChild(n);
        heading.appendChild(h);

        const sub = el('div', 'qv-sub');
        const stateWrap = el('span', 'state-icon');
        stateWrap.style.color = TONE[st.tone];
        stateWrap.setAttribute('role', 'img');
        stateWrap.setAttribute('aria-label', st.label);
        stateWrap.title = st.label;
        const glyph = icon(st.icon);
        glyph.setAttribute('aria-hidden', 'true');
        stateWrap.appendChild(glyph);
        sub.appendChild(stateWrap);
        sub.appendChild(el('span', null, st.label));
        sub.appendChild(el('span', null, '·'));
        if (item.url && item.url.startsWith('http')) {
          const a = el('a', null, recordKey(item));
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noreferrer';
          sub.appendChild(a);
        } else {
          sub.appendChild(el('span', null, recordKey(item)));
        }
        sub.appendChild(el('span', null, '·'));
        sub.appendChild(el('span', null, `last activity ${fmtWhen(item.lastActivityAt)}`));
        if (item.ci) {
          sub.appendChild(el('span', null, '·'));
          sub.appendChild(el('span', null, `CI ${item.ci}`));
        }
        heading.appendChild(sub);
        head.appendChild(heading);

        const close = el('button', 'sprinkle-btn sprinkle-btn--secondary icon-btn qv-close');
        close.type = 'button';
        close.setAttribute('aria-label', 'Close quick view');
        close.title = 'Close this quick view (Escape also closes it)';
        close.appendChild(icon('x'));
        close.addEventListener('click', () => quickViewDialog().close('button'));
        head.appendChild(close);
        inner.appendChild(head);

        // The card line and the longer hover text, in full.
        inner.appendChild(
          qvSection('Status', (s) => {
            // The short status stays PLAIN text: it is one terse line, and the
            // card shows the same string, so the two must not diverge in style.
            s.appendChild(el('p', 'qv-body', item.status));
            if (item.statusLong && item.statusLong !== item.status) {
              // The long form is model-written prose and does use markdown
              // (measured: 31 of 101 records carry backticks, bold or lists).
              s.appendChild(mdField('qv-body', recordKey(item) + ':statusLong', item.statusLong));
            }
            const provenance = [];
            if (item.statusSource && item.statusSource !== 'agent') provenance.push('composed mechanically, not model-written');
            if (item.statusCached) provenance.push(`served from the status cache (written ${fmtWhen(item.statusCached)})`);
            if (item.stageWhy) provenance.push(`state derived because: ${item.stageWhy}`);
            if (provenance.length) s.appendChild(el('p', 'qv-act-why', provenance.join(' · ')));
          }),
        );

        if (item.labels && item.labels.length) {
          inner.appendChild(
            qvSection('Labels', (s) => {
              const row = el('div', 'qv-sub');
              for (const l of labelsByIdf(item.labels)) row.appendChild(el('span', 'tag', l));
              s.appendChild(row);
            }),
          );
        }

        if (Array.isArray(item.actions) && item.actions.length) {
          inner.appendChild(
            qvSection('Suggested follow-ups', (s) => {
              for (const a of item.actions) {
                // Phase 7b actions are objects; a 6b snapshot's bare strings
                // still have to render, so both shapes are handled.
                if (typeof a === 'string') {
                  const box = el('div', 'qv-act');
                  box.appendChild(el('div', 'qv-act-label', a));
                  s.appendChild(box);
                  continue;
                }
                if (!a || typeof a !== 'object') continue;
                const box = el('div', 'qv-act');
                if (a.kind) box.dataset.kind = a.kind;
                box.appendChild(el('div', 'qv-act-label', a.label || a.kind || 'action'));
                if (a.question) box.appendChild(el('p', 'qv-body', a.question));
                const why = [];
                if (a.kind) why.push(a.kind);
                if (a.because) why.push(a.because);
                if (a.grounds) why.push(`grounded in: ${a.grounds}`);
                if (why.length) box.appendChild(el('div', 'qv-act-why', why.join(' — ')));
                if (a.target && a.target.ref) {
                  const t = el('div', 'qv-sub');
                  if (a.target.url) {
                    const link = el('a', null, a.target.ref);
                    link.href = a.target.url;
                    link.target = '_blank';
                    link.rel = 'noreferrer';
                    t.appendChild(link);
                  } else {
                    t.appendChild(el('span', null, a.target.ref));
                  }
                  box.appendChild(t);
                }
                // Phase 7p: the one control per box. A real <button>, appended
                // NEXT TO the target link rather than wrapping the box — the box
                // already contains an anchor, and nesting interactive elements is
                // invalid and unusable by keyboard. Tab reaches it inside the
                // dialog because it is a plain button in flow order.
                const spec = actionSpec(a);
                if (!spec) {
                  // Unknown kind: informational only, and NOTHING clickable. A
                  // chip, not a button — no control to press, no listener to
                  // fire, nothing that looks dispatchable.
                  box.dataset.kindUnknown = '1';
                  const chip = el('div', 'qv-act-inert');
                  chip.appendChild(icon(UNKNOWN_KIND.icon));
                  chip.appendChild(el('span', null, 'No action for \u201C' + a.kind + '\u201D in this panel'));
                  chip.title =
                    'This panel does not recognise the action kind \u201C' +
                    a.kind +
                    '\u201D, so it offers no control rather than guessing what to do with it. The follow-up itself is shown above exactly as the fetcher wrote it. Nothing was dispatched and nothing was written.';
                  box.appendChild(chip);
                  s.appendChild(box);
                  continue;
                }
                const dispatchedAt = (item.actionsDispatched || {})[actionKey(a)] || null;
                const row = el('div', 'qv-act-do');
                const b = el('button', 'sprinkle-btn sprinkle-btn--secondary qv-act-btn');
                b.type = 'button';
                b.dataset.act = spec.act;
                b.dataset.icon = spec.icon;
                b.setAttribute('aria-label', spec.aria);
                b.appendChild(icon(b.dataset.icon));
                b.appendChild(el('span', null, spec.cta));
                paintActionButton(b, a, dispatchedAt);
                b.addEventListener('click', () => {
                  // Resolve the record at CLICK time (7f rule): a reconcile may
                  // have replaced it since this dialog was built.
                  const live = liveRecord(recordKey(item)) || item;
                  actionClick(live, a, b);
                });
                row.appendChild(b);
                box.appendChild(row);
                s.appendChild(box);
              }
            }),
          );
        }

        if (item.bodyExcerpt) {
          inner.appendChild(
            qvSection('Description (excerpt from GitHub)', (s) => {
              // UNTRUSTED: anyone who can open an issue on a watched repo wrote
              // this. It goes through the sanitising renderer, never innerHTML.
              s.appendChild(mdField('qv-body', recordKey(item) + ':body', item.bodyExcerpt));
            }),
          );
        }

        if (Array.isArray(item.recentComments) && item.recentComments.length) {
          inner.appendChild(
            qvSection(`Recent comments (${item.recentComments.length} of ${item.commentsCount ?? item.recentComments.length})`, (s) => {
              for (const c of item.recentComments) {
                const box = el('div', 'qv-comment');
                const when = el('time', null, fmtWhen(c.at));
                when.dateTime = c.at;
                box.appendChild(when);
                // UNTRUSTED, same as the body — and comments are the easier
                // target of the two, since commenting needs no write access.
                box.appendChild(mdField('qv-comment-text', recordKey(item) + ':comment:' + c.at, c.text));
                s.appendChild(box);
              }
            }),
          );
        }

        if (Array.isArray(item.secondary) && item.secondary.length) {
          inner.appendChild(
            qvSection('Also covers', (s) => {
              for (const sec of item.secondary) {
                const row = el('div', 'qv-sub');
                row.appendChild(el('span', 'also-role', sec.role));
                if (sec.url && String(sec.url).startsWith('http')) {
                  const a = el('a', null, sec.label);
                  a.href = sec.url;
                  a.target = '_blank';
                  a.rel = 'noreferrer';
                  row.appendChild(a);
                } else {
                  row.appendChild(el('span', null, sec.label));
                }
                if (sec.title) row.appendChild(el('span', null, sec.title));
                s.appendChild(row);
              }
            }),
          );
        }

        // Your own marks, so the quick view explains a coloured button.
        const marks = [];
        if (item.doneAt) marks.push(`marked done locally ${fmtWhen(item.doneAt)} — nothing was written to GitHub`);
        const sn = snoozeState(item, PASS_NOW);
        if (sn.present) {
          marks.push(
            sn.cancelledByComment
              ? `snooze cancelled by a comment after ${fmtWhen(item.snoozedAt)}`
              : `snoozed until ${fmtWhen(item.snoozedUntil)} (Fibonacci step ${sn.step} = ${sn.days}d)`,
          );
        }
        if (item.scoopRequestedAt) marks.push(`scoop dispatch requested ${fmtWhen(item.scoopRequestedAt)}`);
        if (item.thread) {
          // Phase 7n: label the PROVENANCE of this state. It comes from the
          // snapshot, and thread state changes by the second (measured elsewhere:
          // `bb thread show` said active seconds after `bb thread list` said idle
          // for the same thread). The panel deliberately does not read it live:
          // slicc.exec from a panel was measured here at >10s for `echo hi` and
          // >20s for `bb thread show` without settling, and the hover path would
          // have spawned one subprocess per card the pointer rested on.
          marks.push(
            `bb thread ${item.thread.id}${item.thread.archived ? ' (archived)' : ''} — state "${item.thread.state}" as of the snapshot ` +
              `(${fmtWhen(META && META.generatedAt)}), not read live`,
          );
        }
        if (marks.length) {
          inner.appendChild(
            qvSection('Your marks and links', (s) => {
              for (const m of marks) s.appendChild(el('p', 'qv-act-why', m));
            }),
          );
        }

        return { inner, close };
      }

      /** Open the quick view.

          `mode` decides EVERYTHING that differs between the two cases:
            'hover'     → show()      — non-modal, no focus taken, auto-closes
            'committed' → showModal() — modal, focus trapped, stays until dismissed

          Why the hover case must not be modal, measured rather than assumed:
          with showModal() the document outside the dialog is inert, and a
          .focus() call on the hovered card's description is refused (focus stays
          on the dialog's close button). That same inert flag is what stops the
          card ever seeing the pointer leave — so no amount of extra mouseleave
          handlers could have fixed this. With show() the identical call lands on
          the description, i.e. the page outside is live again. */
      /* GHD-QV-OPEN:START */
      function openQuickView(item, trigger, mode = 'committed') {
        const d = quickViewDialog();
        if (d.open) {
          // Already open. A hover moving to a DIFFERENT card swaps the content in
          // place, which is what makes scanning with the pointer feel continuous.
          // A committed view is never hijacked by a passing pointer.
          if (mode === 'hover' && QV_MODE === 'hover' && d.dataset.key !== recordKey(item)) {
            d.textContent = '';
            const swapped = buildQuickView(item);
            d.appendChild(swapped.inner);
            d.dataset.key = recordKey(item);
            QV_OPENER = trigger; // 8f: a later promotion returns focus HERE
            if (window.LucideIcons) window.LucideIcons.render();
            cancelQuickViewClose();
          }
          return;
        }
        d.textContent = '';
        const { inner, close } = buildQuickView(item);
        d.appendChild(inner);
        d.dataset.key = recordKey(item);
        QV_MODE = mode;
        cancelQuickViewClose();
        // Where focus goes when this closes. A card is an <article> and cannot
        // take focus, so a mouse click on the card hands focus back to that
        // card's description — the one element in the card that IS focusable and
        // that opens the quick view again. Without this, closing after a card
        // click drops the keyboard user at the top of the document.
        // A hover-opened view never took focus, so it has none to give back.
        QV_OPENER = trigger;
        QV_RETURN_FOCUS = mode === 'hover' ? null : qvFocusTarget(trigger) || document.activeElement;
        if (mode === 'hover') {
          d.classList.add('is-hover');
          // show() takes focus (the dialog focusing steps run for non-modal too),
          // so remember where the keyboard was and put it straight back: a panel
          // that appeared because the pointer drifted must not move focus.
          const prevFocus = document.activeElement;
          QV_SUPPRESS_PROMOTE = true;
          d.show();
          if (prevFocus && prevFocus !== document.body && document.contains(prevFocus) && typeof prevFocus.focus === 'function') {
            prevFocus.focus();
          } else if (document.activeElement && d.contains(document.activeElement)) {
            document.activeElement.blur();
          }
          setTimeout(() => {
            QV_SUPPRESS_PROMOTE = false;
          }, 0);
          if (window.LucideIcons) window.LucideIcons.render();
        } else {
          d.classList.remove('is-hover');
          d.showModal();
          // Phase 7o: a modal view owns the viewport, so the page behind it must
          // not scroll. Only this branch locks; see lockPageScroll.
          lockPageScroll();
          if (window.LucideIcons) window.LucideIcons.render();
          // Focus the close button rather than the first link: Escape and Enter
          // then both dismiss, and Tab walks the content from the top.
          close.focus();
        }
      }

      function cancelQuickViewHover() {
        if (QV_HOVER_TIMER) {
          clearTimeout(QV_HOVER_TIMER);
          QV_HOVER_TIMER = null;
        }
      }

      /** Arm the grace timer. Only a hover-opened view is ever transient. */
      function scheduleQuickViewClose(reason) {
        if (QV_MODE !== 'hover') return;
        cancelQuickViewClose();
        QV_CLOSE_REASON = reason;
        QV_CLOSE_TIMER = setTimeout(() => {
          QV_CLOSE_TIMER = null;
          if (QV_MODE === 'hover' && QV_DIALOG && QV_DIALOG.open) QV_DIALOG.close(reason);
        }, QUICK_VIEW_CLOSE_MS);
      }

      function cancelQuickViewClose() {
        if (QV_CLOSE_TIMER) {
          clearTimeout(QV_CLOSE_TIMER);
          QV_CLOSE_TIMER = null;
        }
      }

      /** Promote a hover-opened view to committed: it stops being transient, but
          it is deliberately NOT upgraded to modal — re-opening it as a modal
          mid-interaction would move focus under the user's hands. */
      function commitQuickView() {
