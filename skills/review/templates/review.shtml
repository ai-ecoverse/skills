<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review</title>
  <link rel="icon" href="clipboard-check" />
  <style>
    /* Work-list foundation: keep this block aligned in Review and Loose ends.
           Each sprinkle stays self-contained when installed on its own. */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      color-scheme: dark;
      --fg: var(--s2-content-default, #e8e8e8);
      --fg-muted: var(--s2-content-secondary, #b0b0b0);
      --line: var(--s2-border-subtle, #454545);
      --link: #8ab4ff;
      --action: #2563eb;
    }
    :root.theme-light {
      color-scheme: light;
      --link: #245cc5;
    }
    body {
      font: 14px/1.5 var(--s2-font-family, system-ui, sans-serif);
      background: var(--s2-bg-base, #1a1a1a);
      color: var(--fg);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      min-height: 48px;
    }
    .top-bar-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .top-bar > .sprinkle-icon {
      color: var(--fg-muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: var(--s2-bg-layer-2);
      color: var(--fg-muted);
      flex-shrink: 0;
    }
    .badge.zero {
      display: none;
    }
    .sprinkle-btn {
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: var(--s2-radius-pill, 999px);
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .sprinkle-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .sprinkle-btn:not(:disabled):hover {
      background: var(--s2-bg-layer-2);
    }
    .sprinkle-btn--primary {
      background: var(--action);
      border-color: var(--action);
      color: #fff;
    }
    .sprinkle-btn--primary:not(:disabled):hover {
      background: #1d4ed8;
    }
    .sprinkle-btn--ghost,
    .sprinkle-btn--secondary {
      background: transparent;
      color: var(--fg-muted);
    }
    .sprinkle-btn--icon {
      min-width: 34px;
      padding: 6px;
    }
    :where(button, a, summary, input, textarea):focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }
    .sprinkle-icon {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .sprinkle-icon.sm {
      width: 12px;
      height: 12px;
    }
    .sprinkle-icon.lg {
      width: 16px;
      height: 16px;
    }
    .sprinkle-heading {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }
    .sprinkle-body {
      font-size: 14px;
      color: var(--fg);
    }
    .sprinkle-detail {
      font-size: 12px;
      color: var(--fg-muted);
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 48px 20px;
      color: var(--fg-muted);
      text-align: center;
    }
    .empty-state .sprinkle-icon {
      width: 32px;
      height: 32px;
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }
    .view.hidden {
      display: none;
    }
    #queue-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 24px;
    }
    .page-tools {
      padding: 8px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .page-tools-label {
      color: var(--fg-muted);
      font-size: 13px;
    }
    .page-tools-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .queue-item {
      border-bottom: 1px solid var(--line);
      container-type: inline-size;
    }
    .queue-item:hover {
      background: color-mix(in srgb, var(--fg) 3.5%, transparent);
    }
    .item-body {
      padding: 14px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      align-self: center;
    }
    .status-dot.pending {
      background: var(--s2-notice);
    }
    .status-dot.published {
      background: var(--s2-positive);
    }
    .status-dot.deferred {
      background: var(--fg-muted);
    }
    .item-title {
      flex: 1;
      min-width: 140px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .item-title-preview {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: start;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .item-title-preview:hover {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .item-status-label {
      font-size: 12px;
      color: var(--fg-muted);
      text-transform: capitalize;
    }
    .item-meta {
      font-size: 12px;
      color: var(--fg-muted);
      overflow-wrap: anywhere;
    }
    .item-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      padding: 8px 16px 14px;
    }
    .item-link {
      border:0; background:transparent; padding:0; font-family:inherit; cursor:pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      color: var(--link);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .item-footer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .item-footer-actions [data-action="publish"] {
      margin-inline-start: auto;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    @container (max-width: 380px) {
      .item-footer-actions .action-btn { padding-inline: 8px; }
      .item-footer-actions .action-btn .sprinkle-icon { display: none; }
    }
    .queue-item[data-status="published"] [data-action="publish"],
    .queue-item[data-status="published"] [data-action="defer"],
    .queue-item[data-status="deferred"] [data-action="defer"] {
      display: none;
    }
    .findings {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .findings-head {
      color: var(--fg-muted);
      font-size: 13px;
      min-height: 32px;
      padding: 5px 0;
    }
    .findings-head,
    .page-tools > summary {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      cursor: pointer;
      list-style: none;
    }
    .findings-head::-webkit-details-marker,
    .page-tools > summary::-webkit-details-marker { display: none; }
    .disclosure-chevron { flex-shrink: 0; }
    details[open] > summary .disclosure-chevron { transform: rotate(90deg); }
    .findings-badge {
      color: var(--fg);
      font-weight: 600;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .findings-summary {
      display: block;
      margin: 0 0 8px 18px;
      color: var(--fg-muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .findings-list {
      margin: 4px 0 8px 16px;
      padding-left: 16px;
      border-left: 2px solid var(--line);
      color: var(--fg);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .findings-list li + li {
      margin-top: 6px;
    }
    [hidden] {
      display: none !important;
    }

    /* Comment expand */
    .comment-row {
      overflow: hidden;
      max-height: 0;
      transition:
        max-height 0.25s ease,
        padding 0.25s ease;
      padding: 0 12px;
      background: color-mix(in srgb, var(--s2-bg-layer-1, var(--s2-bg-base)) 60%, transparent);
    }
    .comment-row.open {
      max-height: 180px;
      padding: 8px 16px;
    }

    /* Comments log */
    .comments-log {
      padding: 0 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .comments-log:empty {
      display: none;
    }
    .comment-entry {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 5px 8px;
      background: color-mix(in srgb, var(--s2-accent) 6%, transparent);
      border-radius: var(--s2-radius-default, 8px);
      border-left: 2px solid color-mix(in srgb, var(--s2-accent) 40%, transparent);
    }
    .comment-entry-text {
      flex: 1;
      font-size: 11.5px;
      color: var(--fg);
      line-height: 1.4;
    }
    .comment-entry-time {
      font-size: 10px;
      color: var(--fg-muted);
      white-space: nowrap;
      margin-top: 1px;
    }
    .comment-entry.done .comment-entry-text {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .comment-entry.done {
      opacity: 0.7;
    }
    .comment-entry-done-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      border-radius: 4px;
      flex-shrink: 0;
      transition:
        color 0.15s,
        background 0.15s;
    }
    .comment-entry-done-btn:hover {
      color: var(--s2-positive);
      background: color-mix(in srgb, var(--s2-positive) 12%, transparent);
    }
    .comment-entry.done .comment-entry-done-btn {
      color: var(--s2-positive);
    }
    #review-mode-btn.active {
      background: var(--s2-accent);
      color: #fff;
    }
    #review-mode-btn.active:hover {
      opacity: 0.88;
    }
    #speck-btn.active {
      background: #7c3aed;
      color: #fff;
    }
    #speck-btn.active:hover {
      opacity: 0.88;
    }

    .comment-inner {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .comment-input {
      flex: 1;
      background: var(--s2-bg-base);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: var(--s2-radius-default, 8px);
      color: var(--fg);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 9px;
      resize: none;
      height: 54px;
      outline: none;
      transition: border-color 0.15s;
    }
    .comment-input:focus {
      border-color: var(--s2-accent);
    }

    /* ══════════════════════════════════
           DOCUMENT VIEW
        ══════════════════════════════════ */
    #doc-view {
      overflow: hidden;
    }

    details.page-tools[open] .page-tools-actions { margin-top:8px; }
    .preview-tools [aria-pressed="true"] { border-color:var(--link); color:var(--link); background:color-mix(in srgb,var(--link) 12%,transparent); }
    #doc-scroll { flex:1; min-height:120px; position:relative; display:flex; }
    #doc-content { flex:1; min-width:0; display:flex; }
    #asset-frame { width:100%; height:100%; border:0; background:var(--s2-bg-base); }
    .preview-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); }
    .preview-tools .sprinkle-btn { font-size:12px; }
    #preview-help { flex-basis:100%; color:var(--fg-muted); font-size:12px; }
    #preview-status { color:var(--fg-muted); font-size:12px; padding:0 0 6px; }
    #annotations-toggle { width:100%; border:0; color:inherit; background:transparent; font:inherit; text-align:left; }
    #annotations-list.open { max-height:min(230px,30vh); }
    .annotation-jump { color:var(--link); text-align:left; font:inherit; border:0; width:100%; cursor:pointer; }
    .annotation-state { font-size:11px; color:var(--fg-muted); }
    #annotation-popup { max-width:calc(100vw - 24px); max-height:calc(100vh - 24px); overflow:auto; }
    #annotation-popup:focus-within { border-color:var(--s2-accent); }
    #annotation-note { min-height:72px; }
    .preview-error { align-self:center; padding:24px; overflow-wrap:anywhere; }
    #doc-filename:focus-visible { outline:2px solid var(--link); outline-offset:4px; }

    /* ── Annotation popup ── */
    #annotation-popup {
      position: fixed;
      z-index: 1000;
      background: var(--s2-bg-elevated);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: var(--s2-radius-l, 10px);
      box-shadow: var(--s2-shadow-elevated);
      padding: 10px;
      width: 260px;
      display: none;
      flex-direction: column;
      gap: 7px;
      transition: opacity 0.15s;
    }
    #annotation-popup.visible {
      display: flex;
    }
    #annotation-popup-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #annotation-selected-text {
      font-size: 11px;
      color: var(--fg);
      background: color-mix(in srgb, var(--s2-accent) 8%, transparent);
      border-radius: 5px;
      padding: 5px 7px;
      max-height: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    #annotation-note {
      background: var(--s2-bg-base);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: var(--s2-radius-default, 8px);
      color: var(--fg);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 8px;
      resize: none;
      height: 56px;
      outline: none;
      transition: border-color 0.15s;
    }
    #annotation-note:focus {
      border-color: var(--s2-accent);
    }
    #annotation-note::placeholder {
      color: color-mix(in srgb, var(--fg) 35%, transparent);
    }
    .popup-actions {
      display: flex;
      gap: 6px;
    }

    /* ── Annotations list ── */
    #annotations-section {
      flex-shrink: 0;
      border-top: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
      background: var(--s2-bg-elevated);
    }
    .annotations-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      cursor: pointer;
      user-select: none;
    }
    .annotations-header:hover {
      background: color-mix(in srgb, var(--fg) 4%, transparent);
    }
    .annotations-title {
      font-size: 12px;
      font-weight: 600;
      flex: 1;
      color: var(--fg);
    }
    .annotations-chevron {
      transition: transform 0.2s;
      color: var(--fg-muted);
    }
    .annotations-chevron.open {
      transform: rotate(180deg);
    }
    #annotations-list {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    #annotations-list.open {
      max-height: 300px;
      overflow-y: auto;
    }
    #annotations-list::-webkit-scrollbar {
      width: 3px;
    }
    #annotations-list::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--fg) 15%, transparent);
      border-radius: 2px;
    }

    .annotation-item {
      padding: 7px 12px;
      border-top: 1px solid color-mix(in srgb, var(--fg) 6%, transparent);
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .annotation-body {
      flex: 1;
      min-width: 0;
    }
    .annotation-selected {
      font-size: 10.5px;
      color: var(--fg-muted);
      background: color-mix(in srgb, var(--s2-accent) 8%, transparent);
      border-radius: 4px;
      padding: 2px 6px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .annotation-note-text {
      font-size: 12px;
      color: var(--fg);
    }
    .annotation-remove {
      color: var(--s2-negative);
      opacity: 0.6;
      cursor: pointer;
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 2px;
      display: flex;
      border-radius: 4px;
      transition:
        opacity 0.15s,
        background 0.15s;
    }
    .annotation-remove:hover {
      opacity: 1;
      background: color-mix(in srgb, var(--s2-negative) 10%, transparent);
    }

    /* Submit row */
    #submit-row {
      padding: 8px 12px 10px;
      background: var(--s2-bg-elevated);
      border-top: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
      flex-shrink: 0;
    }

    /* ── Loading state ── */
    .doc-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px;
      color: var(--fg-muted);
      opacity: 0.6;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .spin {
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    /* ── Dot pulse animation ── */
    @keyframes dotPulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.5);
      }
      100% {
        transform: scale(1);
      }
    }
    .status-dot.animating {
      animation: dotPulse 0.4s ease;
    }

    /* ── Acting (in-flight) state ── */
    @keyframes dotBlink {
      0%,
      100% {
        opacity: 0.45;
      }
      50% {
        opacity: 1;
      }
    }
    .status-dot.acting {
      background: color-mix(in srgb, var(--s2-accent) 60%, transparent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--s2-accent) 18%, transparent);
      animation: dotBlink 1s ease-in-out infinite;
    }
    .queue-item.acting {
      opacity: 0.85;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- ════════════════════════════
       QUEUE VIEW
  ════════════════════════════ -->
  <div id="queue-view" class="view hidden">
    <div class="top-bar">
      <i data-lucide="clipboard-list" class="sprinkle-icon lg"></i>
      <span class="top-bar-title">Review</span>
      <span id="queue-count-badge" class="badge zero">0</span>
    </div>
    <details class="page-tools">
      <summary class="page-tools-label"><i data-lucide="chevron-right" class="sprinkle-icon sm disclosure-chevron" aria-hidden="true"></i><span>Tools for an external browser tab</span></summary>
      <div class="page-tools-actions">
      <button class="sprinkle-btn sprinkle-btn--secondary" id="review-mode-btn" aria-pressed="false" title="Click-to-comment on the visible page">
        <i data-lucide="mouse-pointer-click" class="sprinkle-icon sm"></i>
        <span id="review-mode-label">Pin Review</span>
      </button>
      <button class="sprinkle-btn sprinkle-btn--secondary" id="speck-btn" aria-pressed="false" title="Inject the Speck element-editing layer on the visible page">
        <i data-lucide="sparkles" class="sprinkle-icon sm"></i>
        <span id="speck-label">Speck Fix</span>
      </button>
    </div>
    </details>
    <div id="queue-scroll">
      <div class="empty-state" id="empty-state">
        <i data-lucide="inbox" class="sprinkle-icon"></i>
        <span class="sprinkle-detail">No items in the queue</span>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════
       DOCUMENT VIEW
  ════════════════════════════ -->
  <div id="doc-view" class="view hidden">
    <div class="top-bar">
      <button class="sprinkle-btn sprinkle-btn--ghost sprinkle-btn--icon" id="back-btn" title="Back to queue">
        <i data-lucide="arrow-left" class="sprinkle-icon"></i>
      </button>
      <h1 class="top-bar-title" id="doc-filename" tabindex="-1">Preview</h1>
    </div>

    <div class="preview-tools">
      <button class="sprinkle-btn sprinkle-btn--secondary" id="annotate-btn" aria-pressed="true">Annotate</button>
      <button class="sprinkle-btn sprinkle-btn--ghost" id="reload-preview-btn">Reload</button>
      <a class="item-link" id="preview-source-link" target="_blank" rel="noopener noreferrer" hidden>Open source ↗</a>
      <p id="preview-help">Click an element or select text to leave a comment.</p>
    </div>
    <div id="doc-scroll">
      <div id="doc-content"></div>
    </div>

    <!-- Annotations panel -->
    <div id="annotations-section">
      <button class="annotations-header" id="annotations-toggle" aria-expanded="false" aria-controls="annotations-list">
        <i data-lucide="message-square-text" class="sprinkle-icon sm"></i>
        <span class="annotations-title">Comments</span>
        <span id="ann-count-badge" class="badge zero">0</span>
        <i data-lucide="chevron-up" class="sprinkle-icon sm annotations-chevron" id="ann-chevron"></i>
      </button>
      <div id="annotations-list"></div>
    </div>

    <div id="submit-row">
      <p id="preview-status" role="status" aria-live="polite"></p>
      <button class="sprinkle-btn sprinkle-btn--primary" id="submit-btn" style="width:100%" disabled>
        <i data-lucide="send" class="sprinkle-icon"></i>
        Send to agent
      </button>
    </div>
  </div>
</div>

<!-- ── Annotation popup ── -->
<div id="annotation-popup" role="dialog" aria-modal="false" aria-labelledby="annotation-popup-label">
  <div id="annotation-popup-label">Comment on selection</div>
  <div id="annotation-selected-text"></div>
  <textarea id="annotation-note" aria-label="Comment on selection" placeholder="What should change here?"></textarea>
  <div class="popup-actions">
    <button class="sprinkle-btn sprinkle-btn--primary" id="popup-save-btn" style="flex:1">
      <i data-lucide="check" class="sprinkle-icon"></i> Save comment
    </button>
    <button class="sprinkle-btn sprinkle-btn--secondary" id="popup-cancel-btn">
      Cancel
    </button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  ESCAPING / URL HELPERS
// ═══════════════════════════════════════════════════
function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function isSafeUrl(url) {
  return /^(https?:|mailto:|#|\/)/i.test(String(url || '').trim());
}

// ═══════════════════════════════════════════════════
//  MARKDOWN → HTML CONVERTER (escape-first; safe against
//  raw HTML / event handlers / javascript: URLs in source)
// ═══════════════════════════════════════════════════
const MD_SENT = ''; // SOH — won't appear in markdown source

function mdToHtml(md) {
  // Normalize line endings
  md = String(md ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Extract fenced code blocks to sentinel placeholders (escaped now, restored at end)
  const codeBlocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(
      '<pre><code class="lang-' + escAttr(lang) + '">' +
      escHtml(code.replace(/\n$/, '')) +
      '</code></pre>'
    );
    return MD_SENT + 'CB' + i + MD_SENT;
  });

  // Extract inline code to sentinel placeholders
  const inlineCode = [];
  md = md.replace(/`([^`\n]+)`/g, (_, code) => {
    const i = inlineCode.length;
    inlineCode.push('<code>' + escHtml(code) + '</code>');
    return MD_SENT + 'IC' + i + MD_SENT;
  });

  // Escape ALL remaining markup (raw HTML in source becomes inert text)
  let html = escHtml(md);

  // Horizontal rules
  html = html.replace(/^---+$/gm, '<hr>');

  // Headings
  html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s+(.+)$/gm,  '<h5>$1</h5>');
  html = html.replace(/^####\s+(.+)$/gm,   '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm,    '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm,     '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm,      '<h1>$1</h1>');

  // Blockquotes (note: '>' was escaped to '&gt;')
  html = html.replace(/^&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists — group consecutive items
  html = html.replace(/((?:^[ \t]*[-*+]\s+.+\n?)+)/gm, (block) => {
    const items = block.match(/^[ \t]*[-*+]\s+(.+)$/gm) || [];
    return '<ul>' + items.map(i => `<li>${i.replace(/^[ \t]*[-*+]\s+/, '')}</li>`).join('') + '</ul>';
  });

  // Ordered lists
  html = html.replace(/((?:^\d+\.\s+.+\n?)+)/gm, (block) => {
    const items = block.match(/^\d+\.\s+(.+)$/gm) || [];
    return '<ol>' + items.map(i => `<li>${i.replace(/^\d+\.\s+/, '')}</li>`).join('') + '</ol>';
  });

  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g,     '<em>$1</em>');
  html = html.replace(/__(.+?)__/g,     '<strong>$1</strong>');
  html = html.replace(/_(.+?)_/g,       '<em>$1</em>');

  // Links — protocol whitelist; unsafe URLs render as plain label
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
    if (isSafeUrl(url)) {
      return '<a href="' + escAttr(url) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }
    return label;
  });

  // Restore inline code BEFORE paragraph wrap (so they stay inline)
  const inlineRe = new RegExp(MD_SENT + 'IC(\\d+)' + MD_SENT, 'g');
  html = html.replace(inlineRe, (_, i) => inlineCode[+i] ?? '');

  // Paragraphs — wrap non-tagged lines; sentinel-only lines stay block-level
  const cbLineRe = new RegExp('^' + MD_SENT + 'CB\\d+' + MD_SENT + '$');
  const lines = html.split('\n');
  const out = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) { out.push(''); continue; }
    if (cbLineRe.test(trimmed)) { out.push(trimmed); continue; }
    if (/^<(h[1-6]|ul|ol|li|hr|blockquote|pre|p)/.test(trimmed)) {
      out.push(trimmed);
    } else {
      out.push(`<p>${trimmed}</p>`);
    }
  }
  let result = out.join('\n');

  // Restore fenced code blocks last
  const cbRe = new RegExp(MD_SENT + 'CB(\\d+)' + MD_SENT, 'g');
  result = result.replace(cbRe, (_, i) => codeBlocks[+i] ?? '');

  return result;
}

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let state = {
  view: 'queue',            // 'queue' | 'document'
  items: [],
  comments: {},             // { [itemId]: [{text, time}] }
  findings: {},             // { [itemId]: { [source]: { summary, severity, findings, ts } } }
  pins: {},   // { [url]: [ {num, comment, pageX, pageY, selector, relX, relY, url, ts, done} ] }
  docPath: null,
  docTitle: null,
  annotations: [], // legacy current-document annotations; migrated on first preview
  documents: {},
  docItem: null,
  annotationsOpen: false,
};

function loadState(saved = slicc.getState()) {
  if (saved && typeof saved === 'object') state = Object.assign(state, saved);
}

// Older standalone renderers omit sprinkle-init. Their host and iframe share
// the same sprinkle state store; read it before enabling any writes.
// A cross-origin frame must wait for the host's state-bearing init message.
function standaloneSavedState() {
  try {
    // Reading the parent's storage throws for an isolated origin. srcdoc's
    // location.origin is 'null' even when it inherits its parent's origin.
    const raw = parent.localStorage.getItem('slicc-sprinkle-state:' + (slicc.name || 'review'));
    return raw ? JSON.parse(raw) : {};
  } catch (_) { return undefined; }
}

// _stateReady is set only after hydration below.
// Guards saveState so a re-mount never clobbers the persisted queue with the
// startup-empty state (the host sends sprinkle-init AFTER our scripts run).
let _stateReady = false;

function saveState() {
  if (!_stateReady) return;
  slicc.setState({ ...state });
}

// ═══════════════════════════════════════════════════
//  VIEW TRANSITIONS
// ═══════════════════════════════════════════════════
const queueView = document.getElementById('queue-view');
const docView   = document.getElementById('doc-view');

function showView(which) {
  state.view = which;
  saveState();
  if (which === 'queue') {
    queueView.classList.remove('hidden'); queueView.classList.add('visible');
    docView.classList.remove('visible');  docView.classList.add('hidden');
  } else {
    docView.classList.remove('hidden');   docView.classList.add('visible');
    queueView.classList.remove('visible'); queueView.classList.add('hidden');
  }
  renderIcons();
}


function renderFindings(itemId, container) {
  if (!container) return;
  const bySource = (state.findings && state.findings[itemId]) || {};
  const sources = Object.keys(bySource);
  container.hidden = sources.length === 0;
  container.textContent = '';
  sources.forEach((source) => {
    const block = bySource[source] || {};
    const wrap = document.createElement('details');
    wrap.className = 'findings-block';
    const head = document.createElement('summary');
    head.className = 'findings-head';
    const chevron = document.createElement('i');
    chevron.setAttribute('data-lucide', 'chevron-right');
    chevron.setAttribute('aria-hidden', 'true');
    chevron.className = 'sprinkle-icon sm disclosure-chevron';
    const badge = document.createElement('span');
    const sev = block.severity === 'fail' || block.severity === 'warn' ? block.severity : 'info';
    badge.className = 'findings-badge ' + sev;
    badge.textContent = source + ' · ' + ({ fail: 'Needs attention', warn: 'Check', info: 'Info' }[sev]);
    const summary = document.createElement('span');
    summary.className = 'findings-summary';
    summary.textContent = block.summary || '';
    head.appendChild(chevron);
    head.appendChild(badge);
    wrap.appendChild(head);
    // <summary> is always visible. The source explanation must be its
    // sibling so even a result without finding rows can actually collapse.
    if (summary.textContent) wrap.appendChild(summary);
    const list = document.createElement('ul');
    list.className = 'findings-list';
    (block.findings || []).forEach((f) => {
      const li = document.createElement('li');
      const title = f && f.title ? String(f.title) : '';
      const body = f && f.body ? String(f.body) : '';
      li.textContent = title && body ? title + ': ' + body : (title || body);
      list.appendChild(li);
    });
    if (list.childNodes.length) wrap.appendChild(list);
    container.appendChild(wrap);
  });
}

// ═══════════════════════════════════════════════════
//  QUEUE RENDERING
//
//  Cards are built via DOM APIs so user-controlled
//  fields (title, id, URLs) can never inject HTML or
//  break attribute parsing. Live element refs live in
//  cardElements, keyed by item.id — that avoids any
//  CSS-selector or getElementById lookups against ids
//  that may contain unsafe characters.
// ═══════════════════════════════════════════════════
const cardElements = new Map(); // id -> { card, dot, label, commentRow, commentInput }

// Ids with a publish/defer lick in flight, awaiting `update-status`. The busy
// marker itself lives in the card's DOM classes, which any re-render destroys,
// so the set of acting ids is tracked here and reapplied by createItemCard.
//
// Deliberately NOT part of `state`, so saveState() never persists it: after a
// reload there is no lick in flight to answer, and a card stuck busy forever is
// worse than a duplicate lick.
const actingItems = new Set();

function renderQueue() {
  const scroll = document.getElementById('queue-scroll');
  const empty  = document.getElementById('empty-state');
  const badge  = document.getElementById('queue-count-badge');
  const pendingCount = state.items.filter(i => i.status === 'pending').length;
  badge.textContent = pendingCount;
  badge.className = 'badge' + (pendingCount === 0 ? ' zero' : '');

  // Forget in-flight markers for ids no longer in the queue (e.g. a load-items
  // replace dropped the card) so a later re-add does not inherit a busy state.
  [...actingItems].forEach(id => {
    if (!state.items.some(i => i.id === id)) actingItems.delete(id);
  });

  // Remove existing cards (keep empty state node)
  [...scroll.querySelectorAll('.queue-item')].forEach(el => el.remove());
  cardElements.clear();

  if (state.items.length === 0) {
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  state.items.forEach(item => {
    const card = createItemCard(item);
    scroll.appendChild(card);
  });
  renderIcons();
}


function primaryActionLabel(item) {
  return typeof item.primaryActionLabel === 'string' && item.primaryActionLabel.trim()
    ? item.primaryActionLabel.trim() : 'Approve';
}

function createItemCard(item) {
  const div = document.createElement('div');
  div.className = 'queue-item';
  div.dataset.status = item.status || 'pending';

  const statusLabel = item.status || 'pending';

  // Static structural HTML — no user-controlled values inlined.
  div.innerHTML =
    '<div class="item-body">' +
      '<div class="item-header">' +
        '<div class="status-dot"></div>' +
        '<div class="item-title"></div>' +
        '<span class="item-status-label"></span>' +
      '</div>' +
      '<div class="item-meta" hidden></div>' +
      '<div class="findings" hidden></div>' +
    '</div>' +
    '<div class="item-footer">' +
      '<div class="item-footer-actions">' +
        '<button class="sprinkle-btn sprinkle-btn--ghost action-btn" data-action="comment">' +
          '<i data-lucide="message-circle" class="sprinkle-icon sm"></i> Comment' +
        '</button>' +
        '<button class="sprinkle-btn sprinkle-btn--secondary action-btn" data-action="defer">' +
          '<i data-lucide="clock" class="sprinkle-icon sm"></i> Defer' +
        '</button>' +
        '<button class="sprinkle-btn sprinkle-btn--primary action-btn" data-action="publish">' +
          '<i data-lucide="check-circle" class="sprinkle-icon sm"></i> <span class="primary-action-label"></span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="comment-row">' +
      '<div class="comment-inner">' +
        '<textarea class="comment-input" aria-label="Comment" placeholder="Add a comment..." rows="2"></textarea>' +
        '<button class="sprinkle-btn sprinkle-btn--primary send-comment-btn" aria-label="Send comment">' +
          '<i data-lucide="send" class="sprinkle-icon sm"></i>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="comments-log"></div>';

  const dot         = div.querySelector('.status-dot');
  const titleEl     = div.querySelector('.item-title');
  const metaEl      = div.querySelector('.item-meta');
  const actionsEl   = div.querySelector('.item-footer-actions');
  const labelEl     = div.querySelector('.item-status-label');
  const commentRow  = div.querySelector('.comment-row');
  const commentInput = div.querySelector('.comment-input');

  // User-controlled values — assigned via safe APIs (textContent / element props).
  dot.classList.add(statusLabel);
  titleEl.textContent = item.title || item.id || '';
  div.querySelector('.primary-action-label').textContent = primaryActionLabel(item);

  // Secondary meta line: path > previewUrl hostname > nothing
  const metaText = item.path || (item.previewUrl ? (() => {
    try { return new URL(item.previewUrl).pathname; } catch { return item.previewUrl; }
  })() : '');
  if (metaText) { metaEl.textContent = metaText; metaEl.hidden = false; }
  const savedNotes = state.documents?.[documentKey(item)]?.annotations || [];
  if (savedNotes.length) { metaEl.textContent += ' · ' + savedNotes.length + ' comment' + (savedNotes.length === 1 ? '' : 's'); metaEl.hidden = false; }

  if (item.path || /^https?:\/\//i.test(item.previewUrl || item.liveUrl || '')) {
    const preview = document.createElement('button');
    preview.className = 'item-link';
    preview.type = 'button';
    preview.innerHTML = '<i data-lucide="eye" class="sprinkle-icon sm"></i> Preview';
    preview.addEventListener('click', () => openPreview(item));
    actionsEl.prepend(preview);
    const titlePreview = document.createElement('button');
    titlePreview.type = 'button';
    titlePreview.className = 'item-title-preview';
    titlePreview.textContent = titleEl.textContent;
    titlePreview.title = 'Preview ' + titleEl.textContent;
    titlePreview.addEventListener('click', () => openPreview(item));
    titleEl.replaceChildren(titlePreview);
  }

  labelEl.classList.add(statusLabel);
  labelEl.textContent = statusLabel;

  div.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', () => handleItemAction(btn.dataset.action, item.id));
  });

  div.querySelector('.send-comment-btn').addEventListener('click', () => {
    const comment = commentInput.value.trim();
    if (!comment) return;
    slicc.lick({
      action: 'comment',
      data: { id: item.id, path: item.path, url: item.liveUrl || item.previewUrl || '', comment }
    });
    commentInput.value = '';
    appendCommentEntry(item.id, comment);
    commentRow.classList.remove('open');
  });

  const commentsLog = div.querySelector('.comments-log');
  const findingsEl = div.querySelector('.findings');
  cardElements.set(item.id, { card: div, dot, label: labelEl, commentRow, commentInput, commentsLog, findings: findingsEl });
  renderFindings(item.id, findingsEl);

  // A re-render (load-items / ensure-item) rebuilds every card, so restore the
  // in-flight marker for items whose publish/defer lick is still unanswered —
  // otherwise the new buttons come back enabled and allow a duplicate lick.
  if (actingItems.has(item.id)) applyItemActing(item.id, true);

  // Render any previously saved comments
  (state.comments && state.comments[item.id] || []).forEach(c => {
    if (!c.cid) c.cid = 'c' + Date.now() + Math.floor(Math.random()*1000);
    if (typeof c.done === 'undefined') c.done = false;
  });
  const saved = (state.comments && state.comments[item.id]) || [];
  sortedComments(saved).forEach(c => renderCommentEntry(commentsLog, c, item.id));

  return div;
}

function handleItemAction(action, id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;

  if (action === 'publish' || action === 'defer') {
    // Mark as in-flight; the cone is expected to confirm via `update-status`.
    setItemActing(id, true);
    slicc.lick({
      action,
      data: { id, path: item.path, url: item.liveUrl || item.previewUrl || '' }
    });
  } else if (action === 'comment') {
    toggleComment(id);
  }
}

function setItemActing(id, acting) {
  // Record the in-flight state first so it survives a re-render, then paint it.
  if (acting) actingItems.add(id);
  else actingItems.delete(id);
  applyItemActing(id, acting);
}

// Paint (or clear) the busy marker on the card currently rendered for `id`.
function applyItemActing(id, acting) {
  const el = cardElements.get(id);
  if (!el) return;
  el.card.classList.toggle('acting', acting);
  el.dot.classList.toggle('acting', acting);
  el.card.querySelectorAll('.action-btn').forEach(b => { b.disabled = acting; });
}

function updateItemStatus(id, status) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  item.status = status;
  saveState();

  // The operation is over: drop the in-flight record as well as the marker, so a
  // later re-render does not resurrect it.
  actingItems.delete(id);

  const el = cardElements.get(id);
  if (el) {
    el.card.classList.remove('acting');
    el.card.dataset.status = status;
    el.card.querySelectorAll('.action-btn').forEach(b => { b.disabled = false; });

    el.dot.className = `status-dot ${status}`;
    el.dot.classList.add('animating');
    setTimeout(() => el.dot.classList.remove('animating'), 400);

    el.label.className = `item-status-label ${status}`;
    el.label.textContent = status;
  }

  // Update pending badge
  const pendingCount = state.items.filter(i => i.status === 'pending').length;
  const badge = document.getElementById('queue-count-badge');
  badge.textContent = pendingCount;
  badge.className = 'badge' + (pendingCount === 0 ? ' zero' : '');
}

function appendCommentEntry(id, text, num) {
  if (!state.comments) state.comments = {};
  if (!state.comments[id]) state.comments[id] = [];
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  // Idempotent upsert for pin comments (those carrying a numeric `num`):
  // if a comment line with the same `num` already exists for this item,
  // update its text in place (preserving done-state) and re-render the log
  // rather than appending a duplicate. This makes repeated `add-pin` /
  // re-seed calls safe (no more stacked duplicate lines).
  if (typeof num === 'number') {
    const list = state.comments[id];
    const existing = list.find(c => c.num === num);
    if (existing) {
      existing.text = text;
      existing.time = time;
      saveState();
      const elx = cardElements.get(id);
      if (elx && elx.commentsLog) {
        elx.commentsLog.innerHTML = '';
        sortedComments(list).forEach(c => renderCommentEntry(elx.commentsLog, c, id));
      }
      return;
    }
  }

  const c = { cid: 'c' + Date.now() + Math.floor(Math.random()*1000), text, time, done: false };
  if (typeof num === 'number') c.num = num;   // pin marker number (links to page overlay)
  state.comments[id].push(c);
  saveState();
  const el = cardElements.get(id);
  if (!el || !el.commentsLog) return;
  renderCommentEntry(el.commentsLog, c, id);
}

function storePin(pin) {
  if (!pin || !pin.url || typeof pin.num !== 'number') return;
  if (!state.pins) state.pins = {};
  if (!state.pins[pin.url]) state.pins[pin.url] = [];
  const arr = state.pins[pin.url];
  const existing = arr.find(p => p.num === pin.num);
  if (existing) { Object.assign(existing, pin); }
  else { arr.push(Object.assign({ done: false }, pin)); }
  saveState();
}

// Sort comments for display: pins (numeric `num`) ascending by num; non-pin comments
// (no num) keep their relative order and sort after pins.
function sortedComments(list) {
  return (list || []).slice().sort((a, b) => {
    const an = (typeof a.num === 'number') ? a.num : Infinity;
    const bn = (typeof b.num === 'number') ? b.num : Infinity;
    if (an !== bn) return an - bn;
    return 0; // stable for equal/both-non-pin
  });
}

function renderCommentEntry(container, c, itemId) {
  const entry = document.createElement('div');
  entry.className = 'comment-entry' + (c.done ? ' done' : '');

  // Clean the display text: strip any leading pin emoji, mojibake, or "PIN #<n>:" prefix.
  let display = (c.text || '');
  // remove a leading pin glyph or its mojibake forms, optional spaces
  display = display.replace(/^\s*(\uD83D\uDCCD|\u00F0\u0178[\u0080-\u02FF]{1,3}|\uFFFD)\s*/u, '');
  // remove a leading "PIN #<n>:" label (we render num separately if desired)
  display = display.replace(/^\s*PIN\s*#\d+\s*:?\s*/i, '');
  display = display.trim();

  const isPin = (typeof c.num === 'number');

  if (isPin) {
    const icon = document.createElement('i');
    icon.setAttribute('data-lucide', 'map-pin');
    icon.className = 'sprinkle-icon sm';
    icon.style.flexShrink = '0';
    icon.style.color = 'var(--s2-accent)';
    entry.appendChild(icon);
  }

  const textEl = document.createElement('span');
  textEl.className = 'comment-entry-text';
  textEl.textContent = isPin ? ('#' + c.num + ': ' + display) : display;

  const timeEl = document.createElement('span');
  timeEl.className = 'comment-entry-time';
  timeEl.textContent = c.time;

  const doneBtn = document.createElement('button');
  doneBtn.className = 'comment-entry-done-btn';
  doneBtn.title = c.done ? 'Mark as not done' : 'Mark as done';
  doneBtn.innerHTML = '<i data-lucide="' + (c.done ? 'check-circle' : 'x') + '" class="sprinkle-icon sm"></i>';
  doneBtn.addEventListener('click', () => toggleCommentDone(itemId, c.cid));

  entry.appendChild(textEl);
  entry.appendChild(timeEl);
  entry.appendChild(doneBtn);
  container.appendChild(entry);
  renderIcons();
}

function toggleCommentDone(itemId, cid) {
  const list = (state.comments && state.comments[itemId]) || [];
  const c = list.find(x => x.cid === cid);
  if (!c) return;
  c.done = !c.done;
  saveState();
  // Re-render the comments log for this item
  const el = cardElements.get(itemId);
  if (el && el.commentsLog) {
    el.commentsLog.innerHTML = '';
    sortedComments(list).forEach(x => renderCommentEntry(el.commentsLog, x, itemId));
  }
  // If this is a pin comment, tell the cone to update the page overlay
  if (typeof c.num === 'number') {
    slicc.lick({ action: 'comment-done', data: { num: c.num, done: c.done, itemId, cid } });
  }
}

function toggleComment(id) {
  const target = cardElements.get(id);
  if (!target) return;
  const isOpen = target.commentRow.classList.contains('open');

slicc.on('update', async (msg) => {
  if (!msg || !msg.action) return;

  if (msg.action === 'load-items') {
    state.items = msg.items || [];
    saveState();

  }

  else if (msg.action === 'ensure-item') {
    // Upsert a queue item by id: create it if missing, update it if present.
    // Only fields supplied in the message are written, other items are left
    // alone, and `status` is deliberately never touched — the panel owns
    // publish/defer state.
    if (!state.items) state.items = [];
    let existing = state.items.find(it => it.id === msg.id);
    if (!existing) {
      existing = {
        id: msg.id,
        title: msg.title || msg.id,
        path: msg.path || '',
        previewUrl: msg.previewUrl || '',
        liveUrl: msg.liveUrl || '',
        status: 'pending'

        if (msg[k] !== undefined && msg[k] !== null) existing[k] = msg[k];

      existing.primaryActionLabel = msg.primaryActionLabel;

  else if (msg.action === 'clear-findings') {
    if (!msg.id || !state.findings) return;
    if (msg.source) {
      if (state.findings[msg.id]) delete state.findings[msg.id][msg.source];
    } else {
      delete state.findings[msg.id];
    }
    saveState();
    renderQueue();
  }

  else if (msg.action === 'add-pin') {
    // Append the comment line (like add-comment) AND persist the positional marker durably.
    appendCommentEntry(msg.id, msg.comment, typeof msg.num === 'number' ? msg.num : undefined);
    if (msg.pin) storePin(msg.pin);
  }

  else if (msg.action === 'set-pin-done') {
    if (state.pins && state.pins[msg.url]) {
      const p = state.pins[msg.url].find(x => x.num === msg.num);
      if (p) { p.done = !!msg.done; saveState(); }
    }
  }

  else if (msg.action === 'set-comment-done') {
    if (state.comments && state.comments[msg.id]) {
      const c = state.comments[msg.id].find(x => x.num === msg.num);
      if (c) {
        c.done = !!msg.done;
        saveState();
        const el = cardElements.get(msg.id);
        if (el && el.commentsLog) {
          el.commentsLog.innerHTML = '';
          sortedComments(state.comments[msg.id]).forEach(x => renderCommentEntry(el.commentsLog, x, msg.id));
        }
      }
    }
  }

  else if (msg.action === 'request-pins') {
    const url = msg.url;
    const pins = (state.pins && state.pins[url]) ? state.pins[url] : [];
    slicc.lick({ action: 'pins', data: { url, pins } });
  }

  else if (msg.action === 'remove-pin') {
    if (state.pins && state.pins[msg.url]) {
      state.pins[msg.url] = state.pins[msg.url].filter(p => p.num !== msg.num);
      if (state.pins[msg.url].length === 0) delete state.pins[msg.url];
      saveState();
    }
    // Also remove the matching comment line from every item
    if (state.comments) {
      Object.keys(state.comments).forEach(itemId => {
        state.comments[itemId] = state.comments[itemId].filter(c => c.num !== msg.num);
      });
      saveState();
      cardElements.forEach((el, itemId) => {
        if (!el.commentsLog) return;
        el.commentsLog.innerHTML = '';
        sortedComments((state.comments && state.comments[itemId]) || []).forEach(c => renderCommentEntry(el.commentsLog, c, itemId));
      });
    }
  }

  else if (msg.action === 'revisions-result') {
    Object.values(state.documents || {}).forEach(doc => {
      (doc.annotations || []).forEach(ann => {
        if (ann.batchId === msg.batchId) {
          if (msg.status === 'failed') { delete ann.batchId; ann.deliveryError = msg.message || 'Agent could not process these comments. Retry when ready.'; }
          else if (msg.status === 'applied') { ann.applied = true; delete ann.deliveryError; }
        }
      });
    });
    saveState(); paintAnnotations(); renderAnnotationsList(); updateSubmitBtn();
  }

  else if (msg.action === 'set-review-mode') {
    reviewModeActive = !!msg.active;
    const btn = document.getElementById('review-mode-btn');
    if (btn) { btn.classList.toggle('active', reviewModeActive); btn.setAttribute('aria-pressed', String(reviewModeActive)); } // color only
  }

  else if (msg.action === 'set-speck') {
    speckActive = !!msg.active;
    const btn = document.getElementById('speck-btn');
    if (btn) { btn.classList.toggle('active', speckActive); btn.setAttribute('aria-pressed', String(speckActive)); } // color only
  }

  else if (msg.action === 'clear-pins') {
    if (state.comments) {
      Object.keys(state.comments).forEach(itemId => {
        state.comments[itemId] = state.comments[itemId].filter(c => {
          if (typeof c.num === 'number') return false;            // linked pins
          var t = (c.text || '');
          if (/^\s*(\u{1F4CD}\s*)?PIN\s*#/u.test(t)) return false; // legacy text pins like "📍 PIN #1 ..."
          return true;
        });
      });
    }
    state.pins = {};
    saveState();
    // Re-render every card's comments log
    cardElements.forEach((el, itemId) => {
      if (!el.commentsLog) return;
      el.commentsLog.innerHTML = '';
      sortedComments((state.comments && state.comments[itemId]) || []).forEach(c => renderCommentEntry(el.commentsLog, c, itemId));
    });
  }
});

// ═══════════════════════════════════════════════════
//  ICON RENDER HELPER
// ═══════════════════════════════════════════════════
function renderIcons() {
  if (typeof LucideIcons !== 'undefined') LucideIcons.render();
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
// Hydrate before writing. Modern hosts send sprinkle-init; older standalone
// hosts omit it, so the fallback reads their shared persisted store directly.
// An inaccessible or corrupt store stays in a waiting state, never an empty save.
let _initDone = false;
function doInit(saved) {
  if (_initDone) return;
  _initDone = true;
  _stateReady = true;
  loadState(saved);
  document.getElementById('annotations-toggle').setAttribute('aria-expanded',String(state.annotationsOpen));
  if (state.annotationsOpen) {
    document.getElementById('annotations-list').classList.add('open');
    document.getElementById('ann-chevron').classList.add('open');
  }
  if (state.view === 'document' && (state.docItem || state.docPath)) {
    openPreview(state.docItem || {path:state.docPath,title:state.docTitle});
  } else {
    renderQueue();
    showView('queue');
  }
}

window.addEventListener('message', function onSprinkleInit(e) {
  if (!e.data || e.data.type !== 'sprinkle-init') return;
  window.removeEventListener('message', onSprinkleInit);
  doInit(slicc.getState());
}, false);

// A missing init event is not permission to assume an empty saved queue.
setTimeout(function() {
  if (_initDone) return;
  const saved = standaloneSavedState();
  if (saved !== undefined) { doInit(saved); return; }
  queueView.classList.remove('hidden'); queueView.classList.add('visible');
  document.querySelector('#empty-state').textContent = 'Waiting for saved reviews…';
}, 900);
</script>
