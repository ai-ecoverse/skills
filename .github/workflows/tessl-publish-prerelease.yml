name: Tessl Tile Publish (Pre-release)

# Publishes both tiles from the `pre-release` branch with whatever version
# is in tiles/*/tile.json — bump the `-beta.N` / `-rc.N` suffix yourself
# when you want a new pre-release. The `patch-version-publish` action will
# publish the local version as-is when it is ahead of the registry; if the
# exact pre-release version already exists, it will auto-bump the patch
# component (e.g. 0.2.0-beta.1 → 0.2.1).

on:
  push:
    branches: [pre-release]
    paths:
      - 'tiles/**'
      - 'skills/**'
      - '.tileignore'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tile: [basic, advanced]
    steps:
      - uses: actions/checkout@v6

      - uses: tesslio/patch-version-publish@v1
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}
          path: tiles/${{ matrix.tile }}
