name: Tessl Plugin Publish (Pre-release)

# Publishes both plugins from the `pre-release` branch using whatever version
# is in tiles/*/.tessl-plugin/plugin.json — bump the version
# (e.g. 0.2.0-beta.1 → 0.2.0-beta.2) manually before pushing. This workflow
# does NOT auto-bump, because the patch-version-publish action does not
# support semver pre-release tags.

on:
  push:
    branches: [pre-release]
    paths:
      - 'tiles/**'
      - 'skills/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        plugin: [basic, advanced]
    steps:
      - uses: actions/checkout@v7

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}

      - name: Publish plugin (pre-release version from plugin.json)
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          MANIFEST="tiles/$PLUGIN/.tessl-plugin/plugin.json"
          NAME=$(jq -r .name "$MANIFEST")
          VERSION=$(jq -r .version "$MANIFEST")
          echo "Publishing $NAME@$VERSION from tiles/$PLUGIN"
          tessl plugin publish --resolve-symlinks "tiles/$PLUGIN"
