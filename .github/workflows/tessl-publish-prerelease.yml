name: Tessl Tile Publish (Pre-release)

# Publishes both tiles from the `pre-release` branch using whatever version
# is in tiles/*/tile.json — bump the version (e.g. 0.2.0-beta.1 → 0.2.0-beta.2)
# manually before pushing. This workflow does NOT auto-bump, because the
# patch-version-publish action does not support semver pre-release tags.

on:
  push:
    branches: [pre-release]
    paths:
      - 'tiles/**'
      - 'skills/**'
      - '.tileignore'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        tile: [basic, advanced]
    steps:
      - uses: actions/checkout@v7

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}

      - name: Publish tile (pre-release version from tile.json)
        run: |
          TILE="tiles/${{ matrix.tile }}"
          NAME=$(jq -r .name "$TILE/tile.json")
          VERSION=$(jq -r .version "$TILE/tile.json")
          echo "Publishing $NAME@$VERSION from $TILE"
          # tessl >=0.81 rejects symlinks for security. Dereference the tile
          # into a concrete temp copy (mirrors tessl-lint.yml) so the published
          # tile ships real files instead of rejected symlinks.
          TMP=$(mktemp -d)
          cp -rL "$TILE" "$TMP/${{ matrix.tile }}"
          tessl tile publish "$TMP/${{ matrix.tile }}"
