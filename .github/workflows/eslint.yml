name: Lint & Test (jsh-skills)

# Runs the repo's ESLint config (eslint-plugin-jsh-skills, lints skills/**/*.jsh)
# and the plugin's Vitest RuleTester suite. Complements the Tessl skill lint,
# which checks skill *content* rather than the JS tooling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint .)
        run: npm run lint

      - name: Test (vitest run)
        run: npm test
