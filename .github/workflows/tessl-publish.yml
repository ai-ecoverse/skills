name: Tessl Plugin Publish

on:
  push:
    branches: [main]
    paths:
      - 'tiles/**'
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    continue-on-error: ${{ matrix.plugin == 'advanced' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - plugin: basic
            base: "0.2.0"
          - plugin: advanced
            base: "0.2.13"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check for relevant changes
        id: changed
        if: >
          github.event_name != 'workflow_dispatch' &&
          github.event.before != '' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          PLUGIN: ${{ matrix.plugin }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "Commit $BEFORE_SHA not found locally; publishing unconditionally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t SKILL_PATHS < <(jq -r '.skills[]' "tiles/$PLUGIN/.tessl-plugin/plugin.json")
          WATCHED_PATHS=("tiles/$PLUGIN" "${SKILL_PATHS[@]}")

          if git diff --quiet "$BEFORE_SHA" "${{ github.sha }}" -- "${WATCHED_PATHS[@]}"; then
            echo "No changes under watched paths since $BEFORE_SHA; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # BEFORE_SHA was confirmed to exist above, so it's safe to use as the
          # range start here too. Decide bump type from conventional-commit
          # messages (this repo already uses fix:/feat: prefixes) touching the
          # watched paths: "!" or "BREAKING CHANGE" means major, "feat" means
          # minor, anything else (fix, chore, docs, refactor...) is patch.
          MESSAGES=$(git log --format='%B' "$BEFORE_SHA..${{ github.sha }}" -- "${WATCHED_PATHS[@]}")

          if echo "$MESSAGES" | grep -Eq 'BREAKING CHANGE|^[a-zA-Z]+(\([^)]*\))?!:'; then
            BUMP=major
          elif echo "$MESSAGES" | grep -Eiq '^feat(\([^)]*\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "Resolved bump type: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - uses: tesslio/setup-tessl@v2
        if: steps.changed.outputs.skip != 'true'
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}

      - name: Publish plugin
        if: steps.changed.outputs.skip != 'true'
        env:
          PLUGIN: ${{ matrix.plugin }}
          BASE: ${{ matrix.base }}
          BUMP: ${{ steps.changed.outputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          bump_version() {
            local a b c
            IFS='.' read -r a b c <<< "$1"
            case "$2" in
              major) echo "$((a + 1)).0.0" ;;
              minor) echo "$a.$((b + 1)).0" ;;
              *)     echo "$a.$b.$((c + 1))" ;;
            esac
          }

          NAME=$(jq -r .name "tiles/$PLUGIN/.tessl-plugin/plugin.json")

          LATEST=$(curl -fsS "https://api.tessl.io/v1/tiles/$NAME" | jq -r '.data.attributes.latestVersion // empty' || true)

          if echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            FLOOR="$LATEST"
          else
            FLOOR="$BASE"
          fi

          echo "Bumping $FLOOR as a $BUMP release"
          V=$(bump_version "$FLOOR" "$BUMP")

          MANIFEST="tiles/$PLUGIN/.tessl-plugin/plugin.json"

          for _ in $(seq 1 25); do
            # publish --version writes version into the manifest even on failure;
            # strip it so --version is honored on every attempt.
            tmp=$(mktemp)
            jq 'del(.version)' "$MANIFEST" > "$tmp" && mv "$tmp" "$MANIFEST"

            set +e
            OUT=$(tessl plugin publish --version "$V" --resolve-symlinks "tiles/$PLUGIN" 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -eq 0 ]; then
              echo "Published $NAME@$V"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "$MANIFEST"
              git commit -m "chore($PLUGIN): record published version $V [skip ci]"
              git push origin HEAD:main

              exit 0
            fi
            if echo "$OUT" | grep -Eiq 'already exists|not available|already published|already declares version'; then
              V=$(bump_version "$V" "patch")
              continue
            fi
            if echo "$OUT" | grep -Eiq 'timed out'; then
              sleep 5
              continue
            fi
            echo "::error::publish failed for a non-version reason"
            exit 1
          done

          echo "::error::exhausted version attempts starting from $FLOOR"
          exit 1
