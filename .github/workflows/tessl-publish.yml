name: Tessl Tile Publish

on:
  push:
    branches: [main]
    paths:
      - 'tile.json'
      - 'skills/**'
      - '.tileignore'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the bot's own version-bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v6

      - uses: tesslio/patch-version-publish@v1
        with:
          token: ${{ secrets.TESSL_TOKEN }}
