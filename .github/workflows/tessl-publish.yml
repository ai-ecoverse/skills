name: Tessl Tile Publish

on:
  push:
    branches: [main]
    paths:
      - 'tiles/**'
      - 'skills/**'
      - '.tileignore'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the bot's own version-bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      # Serialize so two parallel `git push` of bumped tile.json files
      # don't race on the same branch HEAD.
      max-parallel: 1
      matrix:
        tile: [basic, advanced]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Pick up any [skip ci] bump commit from a previous matrix job
      # so our own push isn't rejected as non-fast-forward.
      - name: Pull latest from branch
        run: |
          git fetch origin "${GITHUB_REF#refs/heads/}"
          git reset --hard "origin/${GITHUB_REF#refs/heads/}"

      - name: Dereference skill symlinks
        run: |
          # tessl >=0.81 rejects symlinks for security. The repo uses symlinks
          # in tiles/*/skills/ pointing to ../../../skills/*. Replace each
          # top-level symlink with a real copy of its target, in place, so the
          # published manifest ships concrete files. Done in-place (not a temp
          # dir) so the action's tile.json commit-back still targets the repo.
          SKILLS_DIR="tiles/${{ matrix.tile }}/skills"
          if [ -d "$SKILLS_DIR" ]; then
            for link in "$SKILLS_DIR"/*; do
              if [ -L "$link" ]; then
                target=$(readlink -f "$link")
                rm "$link"
                cp -rL "$target" "$link"
              fi
            done
          fi

      - uses: tesslio/patch-version-publish@v1
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}
          path: tiles/${{ matrix.tile }}
