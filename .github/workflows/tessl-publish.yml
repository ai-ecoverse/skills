name: Tessl Plugin Publish

on:
  push:
    branches: [main]
    paths:
      - 'tiles/**'
      - 'skills/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tile: [basic, advanced]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}

      - name: Publish plugin
        env:
          PLUGIN: ${{ matrix.tile }}
        run: |
          set -euo pipefail
          tessl plugin publish --bump patch --resolve-symlinks "tiles/$PLUGIN"
