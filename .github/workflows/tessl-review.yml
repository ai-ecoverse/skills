name: Tessl Skill Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/tessl-review.yml'
      - 'tools/detect-tessl-changes.mjs'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      has_skills: ${{ steps.detect.outputs.has_skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed canonical skills
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          DETECTED=$(printf '%s\n' "$CHANGED_FILES" | node tools/detect-tessl-changes.mjs)
          SKILLS=$(jq -c .skills <<< "$DETECTED")
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          if [ "$SKILLS" = "[]" ]; then
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
            echo "No canonical skills changed — review skipped."
          else
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
            echo "Skills to review: $SKILLS"
          fi

      - name: Skip summary
        if: steps.detect.outputs.has_skills == 'false'
        run: |
          {
            echo "## Tessl Skill Review"
            echo ""
            echo "No canonical skills changed — review skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: detect
    if: needs.detect.outputs.has_skills == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSLIO_TOKEN }}

      - name: Review skill (threshold 90%)
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          tessl review run "$SKILL" --workspace ai-ecoverse --json --threshold 90
          echo "- ✅ \`$SKILL\` passed the blocking 90% review threshold." >> "$GITHUB_STEP_SUMMARY"
