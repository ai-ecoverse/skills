name: intent kev.js bundle

# Rebuilds the kev.js bundle the intent skill ships
# (skills/intent/scripts/kev/kev-bundle.cjs) from the pinned
# @ai-ecoverse/kev.js with esbuild, smoke-tests it, and fails when the
# committed bundle differs from a fresh build. Installing the skill builds
# nothing; this job keeps the committed bundle regenerable.

on:
  pull_request:
    paths:
      - 'skills/intent/scripts/kev/**'
      - '.github/workflows/intent-build.yml'
  push:
    branches: [main]
    paths:
      - 'skills/intent/scripts/kev/**'
      - '.github/workflows/intent-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/intent/scripts/kev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install build deps
        run: npm install --no-audit --no-fund

      - name: Build bundle
        run: npm run build

      - name: Smoke test the freshly built bundle
        run: node -e "const b = require('./kev-bundle.cjs'); if (typeof b.loadKev !== 'function') { console.error('::error::kev-bundle.cjs exports no loadKev'); process.exit(1); } console.log('loadKev exported');"

      - name: Drift check (committed bundle vs freshly built)
        run: |
          if git diff --exit-code -- kev-bundle.cjs; then
            echo "committed kev-bundle.cjs matches a fresh build."
          else
            echo "::error::skills/intent/scripts/kev/kev-bundle.cjs is stale. Run 'npm install && npm run build' in skills/intent/scripts/kev and commit it."
            exit 1
          fi
