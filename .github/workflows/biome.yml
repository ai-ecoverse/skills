name: Lint (Biome)

# Lints the repo's .jsh/.bsh skill scripts with @ai-ecoverse/biome-jsh, a
# jsh-aware Biome runner (wraps each AsyncFunction body so top-level await/return
# don't trip a false parse error, discovers biome.json, and shifts diagnostics
# back onto the real file). tools/lint-jsh.sh collects the .jsh/.bsh files and
# runs `biome-jsh lint`. Complements the Tessl skill-lint workflows, which
# validate skill *content* rather than JS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Parse first: a syntax error makes every lint finding downstream noise,
      # and unlike Biome this has no maxSize limit, so the >1 MiB generated
      # bundles are covered too.
      - name: Test the .jsh parse checker
        run: node --test tools/check-jsh-parse.test.mjs

      - name: Parse-check .jsh/.bsh skills
        run: npm run check:jsh-parse

      - name: Lint .jsh/.bsh skills
        run: npm run lint:jsh
