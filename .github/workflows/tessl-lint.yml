name: Tessl Skill Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2

      - name: Detect changed skills and plugin manifests
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE..$SHA" 2>/dev/null || true)
          fi

          DETECTED=$(printf '%s\n' "$CHANGED_FILES" | node tools/detect-tessl-changes.mjs)
          echo "skills=$(jq -c .skills <<< "$DETECTED")" >> "$GITHUB_OUTPUT"
          echo "plugins=$(jq -c .plugins <<< "$DETECTED")" >> "$GITHUB_OUTPUT"
          echo "Detected Tessl targets: $DETECTED"

      - name: Skip summary
        if: steps.detect.outputs.skills == '[]' && steps.detect.outputs.plugins == '[]'
        run: |
          {
            echo "## Tessl Skill Lint"
            echo ""
            echo "No canonical skills or plugin manifests changed — lint skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint changed canonical skills
        if: steps.detect.outputs.skills != '[]'
        env:
          SKILLS: ${{ steps.detect.outputs.skills }}
        run: |
          set -euo pipefail
          LINT_ROOT=$(mktemp -d)
          trap 'rm -rf "$LINT_ROOT"' EXIT
          while IFS= read -r skill; do
            echo "::group::Lint skill $skill"
            package="$LINT_ROOT/$(basename "$skill")"
            node tools/stage-tessl-skill.mjs "$skill" "$package"
            tessl skill lint "$package"
            echo "::endgroup::"
            echo "- ✅ \`$skill\` (isolated package)" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[]' <<< "$SKILLS")

      - name: Lint changed staged plugins
        if: steps.detect.outputs.plugins != '[]'
        env:
          PLUGINS: ${{ steps.detect.outputs.plugins }}
        run: |
          set -euo pipefail
          STAGE_ROOT=$(mktemp -d)
          trap 'rm -rf "$STAGE_ROOT"' EXIT
          while IFS= read -r plugin; do
            echo "::group::Stage and lint plugin $plugin"
            node tools/stage-tessl-plugin.mjs "$plugin" "$STAGE_ROOT/$plugin"
            tessl plugin lint "$STAGE_ROOT/$plugin"
            echo "::endgroup::"
            echo "- ✅ staged plugin \`$plugin\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[]' <<< "$PLUGINS")
