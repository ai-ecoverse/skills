name: Tessl Skill Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2

      - name: Detect changed skills
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}..${{ github.sha }}" 2>/dev/null || echo "")
          fi

          # If any tile manifest or .tileignore changed, lint all affected tiles in full.
          CHANGED_TILES=$(echo "$CHANGED_FILES" \
            | grep -E '^tiles/[^/]+/tile\.json$' \
            | awk -F/ '{print $2}' | sort -u | xargs)
          if [ -n "$CHANGED_TILES" ] || echo "$CHANGED_FILES" | grep -qE '^\.tileignore$'; then
            if [ -z "$CHANGED_TILES" ]; then
              CHANGED_TILES="basic advanced"
            fi
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "tiles=$CHANGED_TILES" >> "$GITHUB_OUTPUT"
            echo "Tile manifest(s) changed — linting full tile(s): $CHANGED_TILES"
            exit 0
          fi

          # Find unique skill directories with changes
          SKILLS=$(echo "$CHANGED_FILES" | grep -E '^skills/[^/]+/' | awk -F/ '{print $2}' | sort -u | xargs)

          if [ -z "$SKILLS" ]; then
            echo "scope=none" >> "$GITHUB_OUTPUT"
            echo "No skill files changed — nothing to lint."
          else
            echo "scope=subset" >> "$GITHUB_OUTPUT"
            echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
            echo "Changed skills: $SKILLS"
          fi

      - name: Skip summary
        if: steps.detect.outputs.scope == 'none'
        run: |
          {
            echo "## Tessl Skill Lint"
            echo ""
            echo "No skill files changed — lint skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint full tile(s)
        if: steps.detect.outputs.scope == 'full'
        run: |
          # tessl >=0.81 rejects symlinks for security. The repo uses symlinks
          # in tiles/*/skills/ pointing to ../../skills/*. Dereference them into
          # a concrete temp copy before linting.
          for t in ${{ steps.detect.outputs.tiles }}; do
            echo "::group::Lint tile $t"
            TMP=$(mktemp -d)
            cp -rL "tiles/$t" "$TMP/$t"
            tessl skill lint "$TMP/$t"
            echo "::endgroup::"
          done

      - name: Lint changed skills only
        if: steps.detect.outputs.scope == 'subset'
        run: |
          # Group changed skills by their owning tile (basic|advanced),
          # build one minimal subset tile per group, then lint each.
          declare -A TILE_OF
          for tile in basic advanced; do
            for k in $(jq -r '.skills | keys[]' "tiles/$tile/tile.json"); do
              TILE_OF[$k]=$tile
            done
          done

          declare -A SUBSET
          for skill in ${{ steps.detect.outputs.skills }}; do
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "::warning::skills/$skill has no SKILL.md — skipping"
              continue
            fi
            t="${TILE_OF[$skill]:-}"
            if [ -z "$t" ]; then
              echo "::notice::$skill is not in any tile.json — skipping"
              continue
            fi
            SUBSET[$t]="${SUBSET[$t]:-} $skill"
          done

          for tile in "${!SUBSET[@]}"; do
            TMP=$(mktemp -d)
            mkdir -p "$TMP/skills"
            SKILLS_JSON="{}"
            for skill in ${SUBSET[$tile]}; do
              cp -rL "$PWD/skills/$skill" "$TMP/skills/$skill"
              SKILLS_JSON=$(echo "$SKILLS_JSON" | jq --arg k "$skill" \
                '. + {($k): {"path": ("skills/" + $k + "/SKILL.md")}}')
            done
            jq -n --arg name "$(jq -r .name tiles/$tile/tile.json)" \
                  --arg version "$(jq -r .version tiles/$tile/tile.json)" \
                  --arg summary "$(jq -r .summary tiles/$tile/tile.json)" \
                  --argjson private "$(jq .private tiles/$tile/tile.json)" \
                  --argjson skills "$SKILLS_JSON" \
                  '{name: $name, version: $version, private: $private, summary: $summary, skills: $skills}' \
              > "$TMP/tile.json"
            echo "::group::Subset tile.json for $tile"
            cat "$TMP/tile.json"
            echo "::endgroup::"
            tessl skill lint "$TMP"
          done
