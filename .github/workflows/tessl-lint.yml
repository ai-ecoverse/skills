name: Tessl Skill Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2

      - name: Detect changed skills
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}..${{ github.sha }}" 2>/dev/null || echo "")
          fi

          # If any plugin manifest changed, lint all affected plugins in full.
          CHANGED_TILES=$(echo "$CHANGED_FILES" \
            | grep -E '^tiles/[^/]+/\.tessl-plugin/plugin\.json$' \
            | awk -F/ '{print $2}' | sort -u | xargs)
          if [ -n "$CHANGED_TILES" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "tiles=$CHANGED_TILES" >> "$GITHUB_OUTPUT"
            echo "Plugin manifest(s) changed — linting full plugin(s): $CHANGED_TILES"
            exit 0
          fi

          # Find unique skill directories with changes
          SKILLS=$(echo "$CHANGED_FILES" | grep -E '^skills/[^/]+/' | awk -F/ '{print $2}' | sort -u | xargs)

          if [ -z "$SKILLS" ]; then
            echo "scope=none" >> "$GITHUB_OUTPUT"
            echo "No skill files changed — nothing to lint."
          else
            echo "scope=subset" >> "$GITHUB_OUTPUT"
            echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
            echo "Changed skills: $SKILLS"
          fi

      - name: Skip summary
        if: steps.detect.outputs.scope == 'none'
        run: |
          {
            echo "## Tessl Skill Lint"
            echo ""
            echo "No skill files changed — lint skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint full plugin(s)
        if: steps.detect.outputs.scope == 'full'
        run: |
          # tessl >=0.81 rejects symlinks for security. The repo uses symlinks
          # in tiles/*/skills/ pointing to ../../../skills/*. plugin lint has no
          # --resolve-symlinks, so dereference them into a concrete temp copy first.
          for t in ${{ steps.detect.outputs.tiles }}; do
            echo "::group::Lint plugin $t"
            TMP=$(mktemp -d)
            cp -rL "tiles/$t" "$TMP/$t"
            tessl plugin lint "$TMP/$t"
            echo "::endgroup::"
          done

      - name: Lint changed skills only
        if: steps.detect.outputs.scope == 'subset'
        run: |
          # Group changed skills by their owning plugin, build one minimal
          # subset plugin per group, then lint each.
          declare -A PLUGIN_OF
          for manifest in tiles/*/.tessl-plugin/plugin.json; do
            [ -f "$manifest" ] || continue
            plugin=$(basename "$(dirname "$(dirname "$manifest")")")
            for path in $(jq -r '.skills[]' "$manifest"); do
              PLUGIN_OF[$(basename "$path")]=$plugin
            done
          done

          declare -A SUBSET
          for skill in ${{ steps.detect.outputs.skills }}; do
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "::warning::skills/$skill has no SKILL.md — skipping"
              continue
            fi
            p="${PLUGIN_OF[$skill]:-}"
            if [ -z "$p" ]; then
              echo "::notice::$skill is not in any plugin.json — skipping"
              continue
            fi
            SUBSET[$p]="${SUBSET[$p]:-} $skill"
          done

          for plugin in "${!SUBSET[@]}"; do
            MANIFEST="tiles/$plugin/.tessl-plugin/plugin.json"
            TMP=$(mktemp -d)
            mkdir -p "$TMP/skills" "$TMP/.tessl-plugin"
            SKILLS_JSON="[]"
            for skill in ${SUBSET[$plugin]}; do
              cp -rL "$PWD/skills/$skill" "$TMP/skills/$skill"
              SKILLS_JSON=$(echo "$SKILLS_JSON" | jq --arg k "skills/$skill" '. + [$k]')
            done
            jq -n --arg name "$(jq -r .name "$MANIFEST")" \
                  --arg version "$(jq -r .version "$MANIFEST")" \
                  --arg description "$(jq -r .description "$MANIFEST")" \
                  --argjson private "$(jq .private "$MANIFEST")" \
                  --argjson skills "$SKILLS_JSON" \
                  '{name: $name, version: $version, private: $private, description: $description, skills: $skills}' \
              > "$TMP/.tessl-plugin/plugin.json"
            echo "::group::Subset plugin.json for $plugin"
            cat "$TMP/.tessl-plugin/plugin.json"
            echo "::endgroup::"
            tessl plugin lint "$TMP"
          done
